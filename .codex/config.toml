approval_policy = "on-request"

# Issue #1859 (re-revision): root default_permissions restored after the
# #1849 P0 quarantine (which dropped the root default entirely and caused
# `codex status` / `skills/list` to fail with "config defines [permissions]
# profiles but does not set default_permissions"). The root default is
# `loop-protocol-personal-dev`, a repository-defined custom profile that
# `extends = ":workspace"` (the OpenAI-defined built-in profile) and layers
# on a broad, explicit development network allowlist. This is an owner
# `HUMAN_PERMISSION_DECISION_V1` for personal hobby development (see the
# Background section of Issue #1859), not the built-in `:workspace` literal.
#
# `:workspace` filesystem semantics (inherited by `loop-protocol-personal-dev`
# below): filesystem read is NOT restricted to the workspace -- it covers
# whatever the OS-level file permissions allow the process to read across the
# whole filesystem. Filesystem WRITE is restricted to active workspace roots
# and system temporary directories. `.git`, `.agents`, and `.codex` are
# protected metadata and are not writable even though they live inside the
# workspace root, regardless of the extending profile's network settings.
#
# This does not reopen the #1849 quarantine -- hooks stay limited to the
# passive SessionEnd/SubagentStop allowlist in `.codex/hooks.json`.
default_permissions = "loop-protocol-personal-dev"

[features]
hooks = true

[features.multi_agent_v2]
enabled = true

# Total active agent threads, including the root thread.
# Expected peak:
#   root + implementation-worker + implementation-designer = 3
# One additional slot is reserved for bounded operational headroom.
max_concurrent_threads_per_session = 4

[permissions.loop-protocol-personal-dev]
description = "Personal hobby development profile: built-in workspace filesystem semantics plus broad development network access."
extends = ":workspace"

[permissions.loop-protocol-personal-dev.network]
enabled = true
mode = "full"
allow_local_binding = false

[permissions.loop-protocol-personal-dev.network.domains]
"**.github.com" = "allow"
"**.githubusercontent.com" = "allow"
"**.npmjs.org" = "allow"
"**.pypi.org" = "allow"
"**.pythonhosted.org" = "allow"
"**.crates.io" = "allow"
"**.rust-lang.org" = "allow"
"**.jsdelivr.net" = "allow"
"**.unpkg.com" = "allow"
"**.openai.com" = "allow"
"**.anthropic.com" = "allow"
"**.herdr.dev" = "allow"

# Project-local custom agents may explicitly select a profile from [permissions.*].
# Repo-local hooks live in `.codex/hooks.json`; do not mix inline hooks here.
# Known limitation: this is a fail-closed local guardrail, not a security boundary.
# Project-local config is not evidence of profile routing; runtime evidence must
# come from spawned custom-agent events and validated launch-ledger inputs.
#
# Issue #1611 (contract revision, P1-2): the `assets`/`LICENSES`/`secrets`
# read-only workspace_roots below are a PARTIAL validated mirror of the
# `root_directory` rules in `scripts/agent-guards/protected_paths_policy.v1.json`
# (PROTECTED_PATHS_POLICY_V1, the JSON SSOT). This permission profile grammar
# has no per-basename-glob primitive, so the `.env`/`.env.*` `basename_glob`
# rules from that JSON are NOT representable here -- dotenv protection is
# enforced at the git-staging/commit layer (`controlled_git_change_exec.py`)
# and the Codex apply_patch/Edit/Write hook (`scripts/check-codex-agents.mjs`
# `isProtectedPath()`, which reads the JSON SSOT directly), not via this
# workspace_roots table. If the JSON's `root_directory` rule set changes,
# update this table to match.

[permissions.loop-protocol-rtk.filesystem]
":minimal" = "read"
"~/.codex/packages/standalone/releases" = "read"

[permissions.loop-protocol-rtk.filesystem.":workspace_roots"]
"." = "write"
"assets" = "read"
"LICENSES" = "read"
"secrets" = "read"

[permissions.loop-protocol-rtk.network]
enabled = true

[permissions.loop-protocol-rtk.network.domains]
"github.com" = "allow"
"api.github.com" = "allow"
"objects.githubusercontent.com" = "allow"
# release / upload endpoints only; keep readonly/bootstrap narrower.
"uploads.github.com" = "allow"

[permissions.loop-protocol-readonly.filesystem]
":minimal" = "read"
"~/.codex/packages/standalone/releases" = "read"

[permissions.loop-protocol-readonly.filesystem.":workspace_roots"]
"." = "read"
"assets" = "read"
"LICENSES" = "read"
"secrets" = "read"

[permissions.loop-protocol-readonly.network]
enabled = true

[permissions.loop-protocol-readonly.network.domains]
"github.com" = "allow"
"api.github.com" = "allow"
"objects.githubusercontent.com" = "allow"

# Scope-rollup is repository/GitHub read-only, but its canonical executor
# atomically writes an invocation-private inventory under the platform temp
# directory.  This profile is deliberately separate from the generic readonly
# profile so the exception cannot silently widen other reviewer sessions.
[permissions.loop-protocol-scope-rollup]
description = "Read-only repository/GitHub access with a dedicated ephemeral executor directory."

[permissions.loop-protocol-scope-rollup.filesystem]
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
"~/.codex/packages/standalone/releases" = "read"

[permissions.loop-protocol-scope-rollup.filesystem.":workspace_roots"]
"." = "read"
"assets" = "read"
"LICENSES" = "read"
"secrets" = "read"

[permissions.loop-protocol-scope-rollup.network]
enabled = true

[permissions.loop-protocol-scope-rollup.network.domains]
"github.com" = "allow"
"api.github.com" = "allow"
"objects.githubusercontent.com" = "allow"

[permissions.loop-protocol-bootstrap.filesystem]
":minimal" = "read"
"~/.codex/packages/standalone/releases" = "read"

[permissions.loop-protocol-bootstrap.filesystem.":workspace_roots"]
"." = "write"
"assets" = "read"
"LICENSES" = "read"
"secrets" = "read"

[permissions.loop-protocol-bootstrap.network]
enabled = true

[permissions.loop-protocol-bootstrap.network.domains]
"github.com" = "allow"
"api.github.com" = "allow"
"objects.githubusercontent.com" = "allow"
"registry.npmjs.org" = "allow"
"*.npmjs.org" = "allow"

[project]
name = "loop-protocol-tools"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.5",
]

[tool.uv]
# uv version canonical source (Issue #1598). GitHub Actions astral-sh/setup-uv
# consumers with an explicit "version:" must match this value; verified by
# scripts/ci/tests/test_uv_toolchain_contract.py.
required-version = "==0.11.29"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not github_live'"
markers = [
  "github_live: exercises real GitHub API write access via gh CLI against a disposable Issue (deselected by default addopts; opt in explicitly with -m github_live and an authenticated gh CLI).",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
".claude/skills/create-issue/scripts/tests/test_gfm_table_detection.py" = ["E402"]
".claude/skills/create-issue/scripts/tests/test_heading_policy.py" = ["E402"]
".claude/skills/create-issue/scripts/tests/test_prose_boundary_policy.py" = ["E402"]

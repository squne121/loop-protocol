name: protected-test-verdict-execution-record

on:
  workflow_dispatch:
    inputs:
      target_pr_number:
        description: Subject pull request number
        required: true
        type: string
      linked_issue_number:
        description: Linked implementation issue number
        required: true
        type: string
      expected_head_sha:
        description: Subject PR head SHA obtained by the dispatcher
        required: true
        type: string
      expected_issue_body_sha256:
        description: Linked Issue body SHA obtained by the dispatcher
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  checks: read

jobs:
  trusted-preflight:
    # Trusted job (Issue 1711 AC3/AC4/AC6): only ever checks out this
    # workflow's own default-branch harness code (github.sha). It never
    # checks out or executes the target PR's code. It resolves the subject
    # PR's exact source identity -- repository id/full_name, commit sha, tree
    # sha -- exclusively from GitHub REST API responses (the PR "head"
    # object and "GET commit"'s commit.tree.sha), and independently
    # re-verifies that the dispatcher-supplied expected_head_sha is still
    # the PR's actual current head before any untrusted execution is allowed
    # to run (fix for the previous ordering, where PR-controlled code ran
    # before this readback -- Issue 1711 Blocker 4).
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      head_repository_id: ${{ steps.trusted-source.outputs.repository_id }}
      head_repository_full_name: ${{ steps.trusted-source.outputs.repository_full_name }}
      head_commit_sha: ${{ steps.trusted-source.outputs.commit_sha }}
      head_tree_sha: ${{ steps.trusted-source.outputs.tree_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-python-uv

      - name: Read subject before any execution
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/pulls/${{ inputs.target_pr_number }} --output subject-pre.json

      - name: Read linked issue before any execution
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/issues/${{ inputs.linked_issue_number }} --output issue-pre.json

      - name: Verify subject head SHA before any execution
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assert-json-field --file subject-pre.json --pointer head.sha --equals "${{ inputs.expected_head_sha }}"

      - name: Verify linked issue body SHA before any execution
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assert-issue-body-sha --file issue-pre.json --equals "${{ inputs.expected_issue_body_sha256 }}"

      - name: Read the exact subject commit via trusted REST API (no PR code checkout)
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/commits/${{ inputs.expected_head_sha }} --output commit-pre.json

      - name: Resolve trusted source provenance from REST readbacks only
        id: trusted-source
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py resolve-trusted-source --subject-file subject-pre.json --commit-file commit-pre.json --expected-repository-full-name "${{ github.repository }}" --expected-commit-sha "${{ inputs.expected_head_sha }}" --output trusted-source-pre.json --github-output-format >> "$GITHUB_OUTPUT"

      - name: Upload trusted source provenance (pre) and subject/issue snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-verdict-trusted-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            trusted-source-pre.json
            subject-pre.json
            issue-pre.json
          if-no-files-found: error
          retention-days: 30

  untrusted-execution:
    # Untrusted job (Issue 1711 AC3/AC4): checks out the target PR's exact
    # head SHA (bound to trusted-preflight's independently-resolved commit
    # sha, never the raw dispatcher input) into a separate "source"
    # workspace, and this workflow's own default-branch harness code into a
    # separate "harness" workspace. Only the harness's own setup-python-uv
    # action and this producer script (never the source checkout's copies)
    # are used to drive the actual pytest execution, with the source
    # checkout supplying only the pytest target file content. No secrets,
    # OIDC, or write token are exposed to this job.
    needs: trusted-preflight
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      job_name: untrusted-execution
    steps:
      - name: Checkout trusted harness (default branch, never PR-controlled)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: harness

      - name: Checkout untrusted target PR source (exact trusted-resolved head SHA only)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.trusted-preflight.outputs.head_commit_sha }}
          path: source

      - uses: ./harness/.github/actions/setup-python-uv

      - name: Verify uv toolchain
        working-directory: harness
        run: uv --version

      - name: Verify checked-out source tree matches trusted-resolved identity (pure git plumbing, no PR code executed)
        working-directory: source
        run: |
          uv run --locked python3 ../harness/scripts/agent-ops/test_verdict_execution_record_producer.py assert-source-tree-matches --actual-commit-sha "$(git rev-parse HEAD)" --actual-tree-sha "$(git rev-parse 'HEAD^{tree}')" --expected-commit-sha "${{ needs.trusted-preflight.outputs.head_commit_sha }}" --expected-tree-sha "${{ needs.trusted-preflight.outputs.head_tree_sha }}"

      - name: Execute closed manifest command against the untrusted source tree, using only the trusted harness environment
        working-directory: harness
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py execute --command-id uv.pytest.execution-record --repo-root . --source-root ../source --output ../execution-result.json
        continue-on-error: true
        id: execute-manifest

      - name: Upload untrusted execution result (treated as untrusted data downstream)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-verdict-untrusted-execution-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: execution-result.json
          if-no-files-found: error
          retention-days: 30

  produce:
    # Trusted job (Issue 1711 AC3/AC4/AC6): never checks out or executes the
    # target PR's own code. Treats the untrusted-execution job's artifact as
    # untrusted data (schema-validated, never executed). Independently
    # re-resolves the trusted source identity a second time and rejects any
    # drift (source_tampered / source_self_attested) before binding
    # source repository id / commit / tree / execution run+job ids into the
    # schema-validated execution record and producer receipt.
    needs: [trusted-preflight, untrusted-execution]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-python-uv

      - name: Download untrusted execution result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-verdict-untrusted-execution-result-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download trusted preflight provenance and subject/issue snapshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-verdict-trusted-preflight-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Read subject after untrusted execution
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/pulls/${{ inputs.target_pr_number }} --output subject-post.json

      - name: Read linked issue after untrusted execution
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/issues/${{ inputs.linked_issue_number }} --output issue-post.json

      - name: Verify subject and issue identity are stable across the untrusted execution window
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assert-stable-fields --before subject-pre.json --after subject-post.json --pointers "number,head.repo.id,head.sha"

      - name: Verify linked issue identity is stable across the untrusted execution window
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assert-stable-fields --before issue-pre.json --after issue-post.json --pointers "number"

      - name: Verify linked issue body SHA after untrusted execution
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assert-issue-body-sha --file issue-post.json --equals "${{ inputs.expected_issue_body_sha256 }}"

      - name: Re-read the exact subject commit via trusted REST API a second, independent time
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/commits/${{ inputs.expected_head_sha }} --output commit-final.json

      - name: Independently re-resolve trusted source provenance (final) and reject any drift from the pre-execution resolution
        run: |
          uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py resolve-trusted-source --subject-file subject-post.json --commit-file commit-final.json --expected-repository-full-name "${{ github.repository }}" --expected-commit-sha "${{ inputs.expected_head_sha }}" --output trusted-source-final.json

      - name: Resolve current job and check run via REST
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py resolve-job-and-check --repo ${{ github.repository }} --run-id ${{ github.run_id }} --run-attempt ${{ github.run_attempt }} --runner-name "${{ runner.name }}" --expected-head-sha ${{ github.sha }} --output-job job.json --output-check check-run.json

      - name: Fetch full jobs list for this run/attempt (to resolve the untrusted-execution job id)
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs --output jobs-list.json

      - name: Resolve the untrusted-execution job's own job id by name
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py resolve-job-id-by-name --jobs-file jobs-list.json --job-name untrusted-execution --output untrusted-job.json

      - name: Assemble producer identity
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assemble-producer --workflow-path .github/workflows/test-verdict-execution-record.yml --workflow-source-ref ${{ github.ref }} --workflow-source-sha ${{ github.sha }} --run-id ${{ github.run_id }} --run-attempt ${{ github.run_attempt }} --job-file job.json --check-file check-run.json --output producer.json

      - name: Assemble subject identity
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assemble-subject --subject-file subject-post.json --target-pr-number ${{ inputs.target_pr_number }} --output subject.json

      - name: Assemble contract identity
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assemble-contract --issue-file issue-post.json --linked-issue-number ${{ inputs.linked_issue_number }} --command-id uv.pytest.execution-record --output contract.json

      - name: Assemble source identity bound to the independently re-resolved trusted provenance and the untrusted-execution job
        run: |
          untrusted_job_id=$(uv run --locked python3 -c "import json;print(json.load(open('untrusted-job.json'))['job_id'])")
          uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assemble-source --trusted-source-file trusted-source-final.json --execution-run-id ${{ github.run_id }} --execution-job-id "$untrusted_job_id" --output source.json

      - name: Build execution-record artifact from the untrusted execution result
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py build-record --command-id uv.pytest.execution-record --producer-input producer.json --subject-input subject.json --contract-input contract.json --execution-result execution-result.json --source-input source.json --schema schemas/test-verdict-execution-record.schema.json --output execution-record.json
        continue-on-error: true
        id: build-execution-record

      - name: Diagnose execution-record build failure (fail closed, before any upload)
        if: steps.build-execution-record.outcome == 'failure'
        run: |
          echo "reason_category=execution_record_build_failed: see the 'Build execution-record artifact from the untrusted execution result' step log above for the machine-readable reason_category line" >&2
          exit 1

      - name: Upload execution record
        id: upload-execution-record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-verdict-execution-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: execution-record.json
          if-no-files-found: error
          retention-days: 30

      - name: Read subject after upload (final readback)
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/pulls/${{ inputs.target_pr_number }} --output subject-final.json

      - name: Read linked issue after upload (final readback)
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/issues/${{ inputs.linked_issue_number }} --output issue-final.json

      - name: Assemble final subject identity
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assemble-subject --subject-file subject-final.json --target-pr-number ${{ inputs.target_pr_number }} --output subject-final-assembled.json

      - name: Assemble final contract identity
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assemble-contract --issue-file issue-final.json --linked-issue-number ${{ inputs.linked_issue_number }} --command-id uv.pytest.execution-record --output contract-final-assembled.json

      - name: Fetch uploaded execution-record artifact metadata via REST
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/actions/artifacts/${{ steps.upload-execution-record.outputs.artifact-id }} --output artifact-rest.json

      - name: Download and self-verify execution-record archive via REST
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py download-artifact --repo ${{ github.repository }} --artifact-id ${{ steps.upload-execution-record.outputs.artifact-id }} --output-json downloaded-execution-record.json --output-payload-sha256 downloaded-payload-sha256.txt

      - name: Assemble execution artifact receipt input
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assemble-execution-artifact --rest-file artifact-rest.json --downloaded-payload-sha256-file downloaded-payload-sha256.txt --artifact-id "${{ steps.upload-execution-record.outputs.artifact-id }}" --artifact-url "${{ steps.upload-execution-record.outputs.artifact-url }}" --artifact-digest "${{ steps.upload-execution-record.outputs.artifact-digest }}" --expected-repository-id ${{ github.repository_id }} --expected-run-id ${{ github.run_id }} --expected-head-sha ${{ github.sha }} --expected-name "test-verdict-execution-record-${{ github.run_id }}-${{ github.run_attempt }}" --output execution-artifact-input.json

      - name: Build producer receipt from readback-bound inputs, including a second independent source re-resolution
        run: |
          uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/commits/${{ inputs.expected_head_sha }} --output commit-receipt.json
          uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py resolve-trusted-source --subject-file subject-final.json --commit-file commit-receipt.json --expected-repository-full-name "${{ github.repository }}" --expected-commit-sha "${{ inputs.expected_head_sha }}" --output trusted-source-receipt.json
          untrusted_job_id=$(uv run --locked python3 -c "import json;print(json.load(open('untrusted-job.json'))['job_id'])")
          uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assemble-source --trusted-source-file trusted-source-receipt.json --execution-run-id ${{ github.run_id }} --execution-job-id "$untrusted_job_id" --output final-source.json
          uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py build-receipt --record execution-record.json --execution-artifact-input execution-artifact-input.json --final-subject subject-final-assembled.json --final-contract contract-final-assembled.json --final-source final-source.json --command-id uv.pytest.execution-record --schema schemas/test-verdict-producer-receipt.schema.json --output producer-receipt.json
        continue-on-error: true
        id: build-producer-receipt

      - name: Diagnose producer-receipt build failure (fail closed, before any upload)
        if: steps.build-producer-receipt.outcome == 'failure'
        run: |
          echo "reason_category=producer_receipt_build_failed: see the 'Build producer receipt from readback-bound inputs, including a second independent source re-resolution' step log above for the machine-readable reason_category line (this legacy run/artifact failure shape is preserved and is never masked as an upload-artifact missing-file error)" >&2
          exit 1

      - name: Upload producer receipt
        id: upload-producer-receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-verdict-producer-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: producer-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Fetch uploaded producer-receipt artifact metadata via REST
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py gh-api --path repos/${{ github.repository }}/actions/artifacts/${{ steps.upload-producer-receipt.outputs.artifact-id }} --output receipt-artifact-rest.json

      - name: Verify producer-receipt artifact identity via REST
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assert-json-field --file receipt-artifact-rest.json --pointer expired --equals "False"

      - name: Verify producer-receipt artifact id via REST
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assert-json-field --file receipt-artifact-rest.json --pointer id --equals "${{ steps.upload-producer-receipt.outputs.artifact-id }}"

      - name: Gate the job on pass_eligible (fail closed)
        run: uv run --locked python3 scripts/agent-ops/test_verdict_execution_record_producer.py assert-json-field --file producer-receipt.json --pointer pass_eligible --equals "True"

name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      python_test_bench:
        description: >-
          When true, run ONLY the python-test job (skip every other job). Used to
          collect runner-identical base/head python-test runtime samples (Issue #1064
          AC11) without paying for the unrelated jobs on each measurement run.
        type: boolean
        default: false
      # #2159 P0-2 (fix_delta after adversarial review issuecomment-5295659213;
      # STRUCTURALLY REVISED per OWNER scope-authority ruling
      # issuecomment-5299412215, item 1): dedicated fixed-SHA E2E benchmark
      # dispatch route. The operator ALWAYS dispatches this workflow with
      # `ref` pointed at the CURRENT/default branch (e.g. `main`) -- NEVER at
      # a branch/tag whose tip is the (possibly old) measured commit -- so
      # `github.workflow_sha` (the WORKFLOW DEFINITION's own commit) stays
      # current on every benchmark sample. `target_sha` is a SEPARATE
      # checkout-selector input: the e2e-core / e2e-responsive-matrix jobs
      # below explicitly `actions/checkout@v6` with `ref: target_sha` to pin
      # ONLY the measured application code to the old/new commit under test,
      # then hard-fail if the resulting checked-out HEAD does not exactly
      # match it. `target_sha` (measured code) and `github.workflow_sha`
      # (workflow definition) are therefore EXPECTED to differ and are
      # recorded as two independent fields in the benchmark manifest/
      # ci_runtime_baseline_v1 artifact (never conflated or asserted equal;
      # see docs/dev/e2e-performance-benchmark.md).
      target_sha:
        description: >-
          Expected 40-hex commit SHA of the APPLICATION CODE to measure
          (checked out via an explicit `actions/checkout` `ref:` override in
          e2e-core / e2e-responsive-matrix, then verified via `git rev-parse
          HEAD`). Distinct from the `ref` this dispatch itself targets, which
          should stay on the current/default branch so the WORKFLOW
          DEFINITION (`github.workflow_sha`) remains current. Leave empty for
          a normal (non-benchmark) run.
        type: string
        default: ""
      cohort_role:
        description: >-
          Fixed-SHA E2E benchmark cohort role for this dispatch: "before" or
          "after" the measured code change (leave empty for a normal
          non-benchmark run). Recorded as `cohort_role` in the
          ci_runtime_baseline_v1 artifact; an
          INTENTIONAL_TREATMENT_DIFFERENCE field (#2159 P0-5/P0-7), never
          checked for cross-arm equality. Not a `type: choice` input because
          actionlint's syntax-check rejects an empty string `choice` option.
        type: string
        default: ""
      experiment_id:
        description: >-
          Free-form identifier grouping the dispatched runs belonging to one
          fixed-SHA before/after experiment (for operator bookkeeping when
          collecting `--before-runs-json`/`--after-runs-json` via `gh api`).
        type: string
        default: ""
      # #2159 OWNER scope-authority ruling (issuecomment-5299412215, items
      # 2/P0-8 and 3/P1-3/AC11): opt-in trigger for the
      # `e2e-performance-benchmark-assessment-gate` steps below (added to
      # the python-test-core job -- deliberately not a new job, see the
      # comment above those steps. Issue #2161: these steps were relocated
      # here from the retired native-Codex-CLI-lane job (Issue #2161), which
      # retirement removed). Never runs on
      # a normal push/pull_request event -- the 20-run comparable-cohort
      # wait is explicitly Out of Scope as a merge/close condition for
      # #2159/#2172 (deferred to #2155); this input lets an operator
      # exercise the REAL production gate (AC11 hard-check +
      # `build_assessment_from_percentile_cohorts`) on demand, without ever
      # blocking a regular PR's required `ci` check.
      run_performance_assessment_gate:
        description: >-
          When true, the python-test-core job additionally runs the
          `e2e-performance-benchmark-assessment-gate` steps: read
          `cohort_fixture_path` (a JSON file already present in the
          checked-out worktree -- e.g. downloaded from a prior
          collect_e2e_performance_benchmark.py manifest-derived artifact) and
          fail-closed (non-zero exit) unless BOTH the before and after arms
          have >= MIN_COHORT_RUN_COUNT post-filter samples, per Issue #2159
          AC11. Leave `cohort_fixture_path` empty to exercise this gate
          against a deliberately-insufficient smoke fixture (proves the
          mechanism itself is wired and fail-closes correctly even with zero
          real historical runs, per OWNER: "20件未満なら fail-closed する
          production path を先に配線できます").
        type: boolean
        default: false
      cohort_fixture_path:
        description: >-
          Path (relative to the repo root, already present in the
          checked-out worktree) to a JSON cohort fixture matching
          `run_evidence_gate`'s documented shape in
          tests/ci/test_ci_performance_gate.py. Leave empty to use the
          built-in insufficient-evidence smoke fixture.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # For push / pull_request: one shared group per ref with cancel-in-progress (normal
  # behaviour). For workflow_dispatch: a UNIQUE group per run (github.run_id) so the
  # 20 dispatched benchmark runs on the same ref do NOT cancel each other (Issue #1064
  # AC11 runner-identical sampling).
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'shared' }}
  cancel-in-progress: true

jobs:
  typecheck:
    if: ${{ github.event.inputs.python_test_bench != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Install dependencies (timed)
        id: timed-pnpm-install
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed pnpm_install pnpm install --frozen-lockfile
      - name: Typecheck (timed)
        id: timed-typecheck
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed pnpm_typecheck pnpm typecheck
      - name: Typecheck E2E (timed)
        # Issue #1283 PR #1517 review fix (P1): pnpm typecheck:e2e was not run
        # in CI, so tests/e2e/**/*.ts type errors (including the type-only
        # import from src/main.ts) could silently drift undetected. New step
        # only — the existing "Typecheck (timed)" step above is unchanged.
        id: timed-typecheck-e2e
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed pnpm_typecheck_e2e pnpm typecheck:e2e
      - name: Collect ci_runtime_baseline_v1 artifact
        if: ${{ !cancelled() }}
        env:
          GH_JOB: ${{ github.job }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci_runtime_baseline_artifacts
          python3 - <<'PY'
          import json, os, pathlib
          measurements = []
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      r = json.loads(line)
                      r.update({
                          "run_id": os.environ["GH_RUN_ID"],
                          "run_attempt": os.environ["GH_RUN_ATTEMPT"],
                          "head_sha": os.environ["GH_HEAD_SHA"],
                          "merge_sha": os.environ["GH_SHA"],
                          "job": os.environ["GH_JOB"],
                          "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
                          "measurement_method": "date_plus3N_ms"
                      })
                      measurements.append(r)
          artifact = {
              "schema": "ci_runtime_baseline_v1",
              "run_id": os.environ["GH_RUN_ID"],
              "run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "head_sha": os.environ["GH_HEAD_SHA"],
              "merge_sha": os.environ["GH_SHA"],
              "job": os.environ["GH_JOB"],
              "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
              "measurement_method": "date_plus3N_ms",
              "measurements": measurements,
          }
          out = pathlib.Path("ci_runtime_baseline_artifacts/ci_runtime_baseline_v1.json")
          out.write_text(json.dumps(artifact, indent=2))
          print(f"Written: {out}")
          PY
      - name: Upload ci-runtime-baseline artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-baseline-${{ github.job }}-${{ github.run_attempt }}
          path: ci_runtime_baseline_artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Output CI runtime summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## CI Runtime Baseline: ${{ github.job }}"
            echo ""
            echo "| step_id | elapsed_ms | status |"
            echo "|---|---|---|"
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      m = json.loads(line)
                      print(f"| {m['step_id']} | {m['elapsed_ms']} | {m['status']} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    if: ${{ github.event.inputs.python_test_bench != 'true' }}
    runs-on: ubuntu-latest
    steps:

  component-vrt-report:
    # Issue #1389 (Scope Delta): non-required, report-only Vitest Browser
    # Mode component VRT lane — distinct from the Playwright `e2e` job
    # above (In Scope / Out of Scope: never registered in GitHub branch
    # protection required checks, never replaces Playwright E2E VRT). The
    # `pnpm test:vrt:component` step below never uses `continue-on-error`
    # or `|| true` — its real exit code determines this job's own
    # conclusion. That conclusion never blocks merge-ready:
    # `component-vrt-report` is classified `excluded` in
    # .claude/skills/pr-review-judge/scripts/ci_verdict_summary_v2.py
    # CLASSIFICATION_MAP (Scope Delta) so determine_check_verdict() never
    # treats it as blocking regardless of pass/fail.
    if: ${{ github.event.inputs.python_test_bench != 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_VERSION: "1.60.0"
    container:
      image: mcr.microsoft.com/playwright@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable pnpm via corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.7.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Playwright Docker image version
        run: |
          PW_VERSION="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$PW_VERSION" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::resolved @playwright/test=$PW_VERSION but Docker image expects v$PLAYWRIGHT_VERSION. Update PLAYWRIGHT_VERSION and container.image digest in ci.yml."
            exit 1
          fi
          echo "playwright_version_match=ok resolved=$PW_VERSION expected=$PLAYWRIGHT_VERSION"
      - name: Typecheck component VRT
        id: typecheck-component-vrt
        run: pnpm typecheck:component-vrt
      - name: Run component VRT (Vitest Browser Mode, report-only)
        id: run-component-vrt
        run: pnpm test:vrt:component
      - name: Upload component VRT screenshots (baseline + actual/diff/expected on failure)
        id: upload-component-vrt-screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: component-vrt-screenshots
          path: |
            tests/component/__screenshots__/
            .vitest-attachments/tests/component/**
          if-no-files-found: warn
          retention-days: 30
          # PR #1977 review fix (P0 item 1, OWNER REQUEST_CHANGES):
          # `.vitest-attachments/` is a hidden (dot-prefixed) directory.
          # `actions/upload-artifact` excludes hidden files/directories by
          # default, so without this the actual/diff evidence
          # (Issue #1389 AC9) would silently never be uploaded on the case
          # that matters most: a real visual mismatch. The negative-control
          # steps below prove this end to end (not just that the YAML looks
          # right).
          include-hidden-files: true
      # --- Hidden-attachment-upload negative control (PR #1977 review fix,
      # P0 item 1) --------------------------------------------------------
      # Deliberately runs a controlled, guaranteed-mismatch fixture
      # (tests/component/__negative_control__/hidden-attachment-negative-control.vrt.test.ts,
      # never the real combat-hud-running baseline) and proves that its
      # actual/diff attachments survive a real upload-artifact round trip
      # via download-artifact, not merely that the workflow YAML declares
      # `include-hidden-files: true`.
      - name: Run hidden-attachment negative control (expected to mismatch)
        id: run-negative-control
        continue-on-error: true
        env:
          VITE_VRT_NEGATIVE_CONTROL: "true"
        run: pnpm exec vitest run --config vitest.visual.config.ts tests/component/__negative_control__/hidden-attachment-negative-control.vrt.test.ts
      - name: Verify the negative control actually mismatched
        if: ${{ always() }}
        env:
          NEGATIVE_CONTROL_OUTCOME: ${{ steps.run-negative-control.outcome }}
        run: |
          if [ "${NEGATIVE_CONTROL_OUTCOME}" != "failure" ]; then
            echo "::error::hidden-attachment negative control outcome was '${NEGATIVE_CONTROL_OUTCOME}', expected 'failure' (the fixture is designed to ALWAYS mismatch). If it passed or was skipped, the fixture itself is broken and can no longer prove the actual/diff artifact pipeline works end to end."
            exit 1
          fi
          echo "negative_control_outcome=ok (mismatched as expected)"
      - name: Upload negative control attachments
        id: upload-negative-control-attachments
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: component-vrt-negative-control-attachments
          path: .vitest-attachments/tests/component/__negative_control__/**
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Download negative control attachments (round-trip proof)
        if: ${{ always() }}
        uses: actions/download-artifact@v6
        with:
          name: component-vrt-negative-control-attachments
          path: negative-control-download
      - name: Assert actual/diff PNGs survived the hidden-file upload round trip
        if: ${{ always() }}
        id: verify-negative-control-attachments
        run: |
          shopt -s globstar nullglob
          actual_files=(negative-control-download/**/*-actual-*.png)
          diff_files=(negative-control-download/**/*-diff-*.png)
          if [ "${#actual_files[@]}" -eq 0 ]; then
            echo "::error::no *-actual-*.png found in the downloaded component-vrt-negative-control-attachments artifact — the hidden .vitest-attachments upload is NOT working end to end."
            find negative-control-download -type f
            exit 1
          fi
          if [ "${#diff_files[@]}" -eq 0 ]; then
            echo "::error::no *-diff-*.png found in the downloaded component-vrt-negative-control-attachments artifact — the hidden .vitest-attachments upload is NOT working end to end."
            find negative-control-download -type f
            exit 1
          fi
          echo "hidden_attachment_upload_proof=ok actual=${actual_files[*]} diff=${diff_files[*]}"
      # --- end negative control ------------------------------------------
      - name: Summarize component VRT evidence
        if: ${{ always() }}
        env:
          RUN_OUTCOME: ${{ steps.run-component-vrt.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck-component-vrt.outcome }}
          NEGATIVE_CONTROL_OUTCOME: ${{ steps.run-negative-control.outcome }}
          NEGATIVE_CONTROL_PROOF_OUTCOME: ${{ steps.verify-negative-control-attachments.outcome }}
          SCREENSHOTS_URL: ${{ steps.upload-component-vrt-screenshots.outputs.artifact-url || 'N/A' }}
          SCREENSHOTS_DIGEST: ${{ steps.upload-component-vrt-screenshots.outputs.artifact-digest || 'sha256:none' }}
        run: |
          PW_VERSION="$(node -p "require('@playwright/test/package.json').version" 2>/dev/null || echo 'unknown')"
          # PR #1977 review fix (P2 item, OWNER REQUEST_CHANGES): a GitHub
          # Actions step `outcome` is `success` / `failure` / `skipped` /
          # `cancelled` — never an "exit code" — and each state is reported
          # distinctly below so a `skipped` step (e.g. from an earlier
          # dependency-install failure) is never conflated with "no visual
          # mismatch".
          classify_outcome() {
            case "$1" in
              success) echo "success (no visual mismatch)" ;;
              failure) echo "failure (visual mismatch or run failure detected)" ;;
              skipped) echo "skipped (step did not run — NOT the same as a pass)" ;;
              cancelled) echo "cancelled" ;;
              *) echo "unknown ($1)" ;;
            esac
          }
          {
            echo "## Component VRT (report-only, non-required — Issue #1389)"
            echo ""
            echo "This job's pass/fail never blocks merge-ready: see the \`excluded\`"
            echo "CLASSIFICATION_MAP entry for \`component-vrt-report\` in"
            echo "\`.claude/skills/pr-review-judge/scripts/ci_verdict_summary_v2.py\`."
            echo ""
            echo "### Environment fingerprint"
            echo "- typecheck outcome: $(classify_outcome "${TYPECHECK_OUTCOME}")"
            echo "- run outcome: $(classify_outcome "${RUN_OUTCOME}")"
            echo "- runner: ${RUNNER_OS} ${RUNNER_ARCH} (image ${ImageOS:-unknown} ${ImageVersion:-unknown})"
            echo "- node: $(node -p 'process.version')"
            echo "- Playwright: ${PW_VERSION}"
            echo "- browser: chromium"
            echo "- viewport: 1280x720"
            echo "- deviceScaleFactor: 1"
            echo "- screenshot directory: tests/component/__screenshots__/"
            echo ""
            echo "### Artifacts"
            echo "- component-vrt-screenshots (baseline + actual/expected/diff on failure): ${SCREENSHOTS_URL} (digest: ${SCREENSHOTS_DIGEST})"
            echo ""
            echo "### actual / expected / diff"
            if [ "${RUN_OUTCOME}" = "failure" ]; then
              echo "- visual mismatch or run failure detected: see the component-vrt-screenshots artifact above for any *-actual.png / *-expected.png / *-diff.png Vitest Browser Mode wrote"
            else
              echo "- N/A (no visual mismatch; expected/actual/diff are only emitted on toMatchScreenshot() failure)"
            fi
            echo ""
            echo "### Hidden-attachment upload proof (negative control)"
            echo "- fixture outcome: $(classify_outcome "${NEGATIVE_CONTROL_OUTCOME}") (expected: failure — the fixture is a deliberate, controlled mismatch)"
            echo "- round-trip verification: $(classify_outcome "${NEGATIVE_CONTROL_PROOF_OUTCOME}") (proves the uploaded artifact ZIP actually contains *-actual-*.png / *-diff-*.png)"
          } >> "$GITHUB_STEP_SUMMARY"

  python-test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # fetch-depth: 0 so the ci_test_selection generator can run an explicit
          # base..head git diff for change detection. A shallow checkout (default
          # depth 1) lacks the base ref and the diff fails — which is now fail-closed
          # (Issue #1064 review), so full history is required here.
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
      - name: uv python install (timed)
        id: timed-uv-python-install
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed uv_python_install uv python install
      - name: uv lock --check (drift guard)
        run: uv lock --check

      - name: "Runtime dependency smoke (isolated, #1192)"
        run: uv run --isolated --locked --no-default-groups python scripts/ci/runtime_dependency_smoke.py

      - name: uv sync (timed)
        id: timed-uv-sync
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed uv_sync uv sync --locked --group dev
      - name: Verify Ruff configuration authority
        run: uv run --locked python3 scripts/ci/verify_ruff_configuration.py --root .
      - name: Ruff check (timed)
        id: timed-ruff-check
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed ruff_check uv run --locked ruff check .claude/scripts scripts schemas .claude/skills
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Verify Python version
        run: |
          uv run --locked python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 12), sys.version
          print(sys.version)
          PY
      - run: uv run --locked python .claude/scripts/check_secret_policy.py docs/dev/secret-policy.md
      - run: uv run --locked python .claude/scripts/check_session_recording_policy.py docs/dev/session-recording-policy.md
      - name: Check InputCommand docs schema
        run: uv run --locked python scripts/check_input_command_schema.py
      - name: Check visual artifact pipeline wiring
        run: uv run --locked python scripts/check-visual-artifact-pipeline.py
      - name: Check required-CI VRT snapshot policy
        run: uv run --locked python scripts/check-vrt-snapshot-policy.py
      - name: Verify python-test plan paths + lane union
        # Fail-closed plan checks (Issue #1064 review): every plan path exists, and the
        # collected node IDs satisfy  parallel ∪ serial == scope  and  parallel ∩ serial == ∅.
        run: |
          python3 scripts/ci/python_test_plan.py --emit scope-argv --check-paths --format json > /dev/null
          uv run --locked python scripts/ci/verify_lane_union.py
      - name: Check governed Python invocation policy (#1193)
        # Fail-closed static scan: governed surfaces (.github/workflows/** /
        # .github/actions/** / docs/dev/** / .claude/skills/**/SKILL.md /
        # package.json) must use `uv run --locked` for dependency-bearing pytest
        # and Python script invocations; direct interpreters are allowed only via
        # the stdlib_only/bootstrap exceptions registry.
        run: uv run --locked python scripts/ci/check_python_invocation_policy.py --strict
      - name: Check .claude/settings.json permissions (#1551)
        # Fail-closed static scan: permissions.allow/ask/deny in .claude/settings.json
        # must not contain scoped Write(path) rules (repository policy:
        # claude_permission_edit_rule_canonicalization_v1). Scoped path mutation is
        # expressed via Edit(path) instead.
        run: uv run --locked python scripts/ci/check_claude_settings_permissions.py --settings .claude/settings.json
      - name: Verify python-test lane topology invariants (#1760)
        # Fail-closed YAML-AST scan: python-test-core stays Python-only (no
        # Node/npm/npx/pnpm/corepack/codex commands), codex-execpolicy owns the
        # Node/Codex CLI bootstrap + matrix + tests/codex/test_local_main_branch_guard.py,
        # the python-test required aggregate is needs:[python-test-core,codex-execpolicy]
        # + if:always(), and this verifier itself stays wired (not disabled).
        run: uv run --locked python scripts/ci/verify_python_test_lane.py --ci-yml .github/workflows/ci.yml
      - name: pytest python suite (parallel) (timed)
        # Plan-driven xdist parallel step (Issue #1064). Target set / --ignore / --deselect /
        # FIXED worker count / scheduler all come from the python-test-plan SSOT via the
        # scripts/ci/python_test_plan.py loader. The parallel_exclude tests run in the serial
        # lane below; tests/codex/ runs in the dedicated codex step. JUnit + durations are
        # written to *-parallel.* and combined with the serial lane by the manifest step.
        env:
          XDIST_NUMPROCESSES_OUT: python_test_artifacts/resolved_workers.json
        run: |
          _t0=$(date +%s%3N)
          mkdir -p python_test_artifacts
          # B4 (review): run the loader as an INDEPENDENT command (a process substitution
          # would discard the producer's exit status, masking loader failures). Fail-closed:
          # a loader error or an empty argv aborts before pytest runs.
          _argv_file="${RUNNER_TEMP:-/tmp}/pytest-parallel-argv"
          if ! python3 scripts/ci/python_test_plan.py --emit run-argv --mode parallel --format nul > "$_argv_file"; then
            echo "::error::python-test plan loader failed (parallel argv)"
            exit 1
          fi
          mapfile -d '' -t _pytest_argv < "$_argv_file"
          if [ "${#_pytest_argv[@]}" -eq 0 ]; then
            echo "::error::python-test plan produced an empty parallel argv (loader failure)"
            exit 1
          fi
          _workers=$(python3 scripts/ci/python_test_plan.py --emit workers --format lines)
          _scheduler=$(python3 scripts/ci/python_test_plan.py --emit scheduler --format lines)
          export PYTHONPATH="$PWD/scripts/ci${PYTHONPATH:+:$PYTHONPATH}"
          set +e
          uv run --locked pytest "${_pytest_argv[@]}" \
            -p collect_nodeids_plugin \
            --junitxml=python_test_artifacts/junit-parallel.xml \
            --durations=25 --durations-min=0.01 \
            > python_test_artifacts/pytest_durations_parallel.log 2>&1
          _s=$?
          set -e
          cat python_test_artifacts/pytest_durations_parallel.log
          _xdist_version=$(uv run --locked python -c "import xdist; print(xdist.__version__)" 2>/dev/null || echo unknown)
          _nproc=$(nproc 2>/dev/null || echo unknown)
          # resolved_workers: the authoritative xdist worker count captured by the
          # collect_nodeids_plugin probe (controller-side numprocesses). With a FIXED -n N
          # plan this equals N; runner_nproc is kept for context only, NOT as the proof.
          _resolved=$(uv run --locked python -c "import json,sys; print(json.load(open('python_test_artifacts/resolved_workers.json')).get('resolved_workers'))" 2>/dev/null || echo "$_workers")
          printf '{"resolved_workers":"%s","configured_workers":"%s","scheduler":"%s","xdist_version":"%s","runner_nproc":"%s","junitxml_parallel":"python_test_artifacts/junit-parallel.xml","junitxml_serial":"python_test_artifacts/junit-serial.xml","durations_parallel":"python_test_artifacts/pytest_durations_parallel.log","durations_serial":"python_test_artifacts/pytest_durations_serial.log"}\n' \
            "$_resolved" "$_workers" "$_scheduler" "$_xdist_version" "$_nproc" > python_test_artifacts/xdist_meta.json
          cat python_test_artifacts/xdist_meta.json
          printf '{"step_id":"pytest_parallel","phase_id":"pytest_parallel","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: pytest serial lane (parallel-unsafe) (timed)
        # Dedicated -n 0 lane for plan.parallel_exclude tests (timing-sensitive, e.g. the
        # 80ms debounce front-gate). Its JUnit/durations cover the tests excluded from the
        # parallel lane so the two artifacts together represent the whole suite (AC9).
        run: |
          _t0=$(date +%s%3N)
          mkdir -p python_test_artifacts
          _argv_file="${RUNNER_TEMP:-/tmp}/pytest-serial-argv"
          if ! python3 scripts/ci/python_test_plan.py --emit serial-lane-argv --format nul > "$_argv_file"; then
            echo "::error::python-test plan loader failed (serial argv)"
            exit 1
          fi
          mapfile -d '' -t _serial_argv < "$_argv_file"
          if [ "${#_serial_argv[@]}" -eq 0 ]; then
            echo "no parallel_exclude tests; serial lane is empty"
            printf '{"step_id":"pytest_serial","phase_id":"pytest_serial","status":0,"elapsed_ms":%d}\n' \
              $(($(date +%s%3N)-_t0)) >> measurements.jsonl
            exit 0
          fi
          set +e
          uv run --locked pytest "${_serial_argv[@]}" \
            --junitxml=python_test_artifacts/junit-serial.xml \
            --durations=25 --durations-min=0.01 \
            > python_test_artifacts/pytest_durations_serial.log 2>&1
          _s=$?
          set -e
          cat python_test_artifacts/pytest_durations_serial.log
          printf '{"step_id":"pytest_serial","phase_id":"pytest_serial","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: Verify python-test JUnit manifest (parallel + serial == scope)
        run: |
          uv run --locked python scripts/ci/verify_python_test_manifest.py \
            --parallel-junit python_test_artifacts/junit-parallel.xml \
            --serial-junit python_test_artifacts/junit-serial.xml \
            --manifest-out python_test_artifacts/python_test_manifest.json
      - name: Upload python-test artifacts (junit + durations + xdist meta + manifest)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: python-test-junit-${{ github.run_attempt }}
          path: python_test_artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Verify hook test discovery exclusions
        run: |
          python3 - <<PY
          import subprocess
          from pathlib import Path

          # Tracked separately by Issue #412; remove this ignore once the test is CI-green.
          allowed_unregistered = {
              ".claude/hooks/tests/test_secret_boundary_contract.py",
          }
          expected = {
              hook_test.as_posix()
              for pattern in ("test_*.py", "*_test.py")
              for hook_test in Path(".claude/hooks/tests").rglob(pattern)
              if hook_test.as_posix() not in allowed_unregistered
          }

          result = subprocess.run(
              [
                  "uv",
                  "run",
                  "--locked",
                  "pytest",
                  "--collect-only",
                  "-q",
                  ".claude/hooks/tests/",
                  "--ignore=.claude/hooks/tests/test_secret_boundary_contract.py",
                  "--deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable",
                  "--deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths",
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          collected = set()
          for line in result.stdout.splitlines():
              line = line.strip()
              if not line:
                  continue
              collected.add(line.split("::", 1)[0])

          missing = sorted(expected - collected)
          if missing:
              raise SystemExit("Hook tests missing from pytest discovery:\n" + "\n".join(missing))
          PY
      - name: Kill Switch smoke test
        run: uv run --locked python3 .claude/scripts/kill_switch_runtime_smoke.py --fixtures tests/fixtures/session-recording
      - name: Secret exposure scan (production scripts)
        run: python3 .claude/scripts/secret_exposure_scanner.py --local .claude/scripts --exclude secret_exposure_scanner.py --exclude check_session_recording_runtime_safety.py --fail-on-finding
      - name: Secret exposure scan (clean fixtures)
        run: python3 .claude/scripts/secret_exposure_scanner.py --local tests/fixtures/session-recording/valid --fail-on-finding
      - name: Generate ci_test_selection/v1 artifact
        # Skipped in python_test_bench dispatch runs: change detection needs a PR base
        # SHA which a workflow_dispatch event lacks, and the bench run only measures
        # pytest runtime (Issue #1064 AC11). Normal push/PR runs always run this.
        if: ${{ github.event.inputs.python_test_bench != 'true' }}
        run: |
          mkdir -p ci_test_selection_artifacts
          uv run --locked pytest --collect-only -q \
            .claude/hooks/tests/ \
            --ignore=.claude/hooks/tests/test_secret_boundary_contract.py \
            --deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable \
            --deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths \
            > ci_test_selection_artifacts/hook_tests_collect_only.txt
          python3 - <<'PY'
          import argparse
          import importlib.util
          import pathlib
          import sys

          script_path = pathlib.Path(
              ".claude/skills/pr-review-judge/scripts/generate_ci_test_selection_artifact.py"
          )
          spec = importlib.util.spec_from_file_location(
              "generate_ci_test_selection_artifact", script_path
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          # pytest_args=None -> the generator derives the scope argv from the
          # python-test-plan SSOT (.github/ci/python-test-plan.json) via the loader,
          # so the artifact pytest_argv cannot drift from the executed target set
          # and includes schemas/tests/ exactly once (Issue #1064 AC2/AC7).
          # base_sha/head_sha drive change detection via an EXPLICIT git diff (never the
          # branch name "main", absent in a shallow checkout). For push events with no PR
          # base, fall back to the previous commit so the diff still resolves; with
          # fetch-depth: 0 both SHAs are present (Issue #1064 review false-green fix).
          args = argparse.Namespace(
              output="ci_test_selection_artifacts/ci_test_selection_v1.json",
              pytest_args=None,
              plan=".github/ci/python-test-plan.json",
              pr_head_sha="${{ github.event.pull_request.head.sha || github.sha }}",
              base_sha="${{ github.event.pull_request.base.sha || github.event.before }}",
              head_sha="${{ github.event.pull_request.head.sha || github.sha }}",
              checked_out_sha=None,
              merge_sha="${{ github.sha }}",
              workflow="ci",
              job="python-test-core",
              ci_run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          )
          sys.exit(module.generate_artifact(args))
          PY
      - name: Verify ci_test_selection evidence files
        if: ${{ github.event.inputs.python_test_bench != 'true' }}
        run: |
          test -s ci_test_selection_artifacts/hook_tests_collect_only.txt
          test -s ci_test_selection_artifacts/ci_test_selection_v1.json
      - uses: actions/upload-artifact@v7
        if: ${{ github.event.inputs.python_test_bench != 'true' }}
        with:
          name: ci_test_selection
          path: ci_test_selection_artifacts/
          if-no-files-found: error
      - name: Collect ci_runtime_baseline_v1 artifact
        if: ${{ !cancelled() }}
        env:
          GH_JOB: ${{ github.job }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci_runtime_baseline_artifacts
          python3 - <<'PY'
          import json, os, pathlib
          measurements = []
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      r = json.loads(line)
                      r.update({
                          "run_id": os.environ["GH_RUN_ID"],
                          "run_attempt": os.environ["GH_RUN_ATTEMPT"],
                          "head_sha": os.environ["GH_HEAD_SHA"],
                          "merge_sha": os.environ["GH_SHA"],
                          "job": os.environ["GH_JOB"],
                          "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
                          "measurement_method": "date_plus3N_ms"
                      })
                      measurements.append(r)
          artifact = {
              "schema": "ci_runtime_baseline_v1",
              "run_id": os.environ["GH_RUN_ID"],
              "run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "head_sha": os.environ["GH_HEAD_SHA"],
              "merge_sha": os.environ["GH_SHA"],
              "job": os.environ["GH_JOB"],
              "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
              "measurement_method": "date_plus3N_ms",
              "measurements": measurements,
          }
          out = pathlib.Path("ci_runtime_baseline_artifacts/ci_runtime_baseline_v1.json")
          out.write_text(json.dumps(artifact, indent=2))
          print(f"Written: {out}")
          PY
      - name: Upload ci-runtime-baseline artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-baseline-${{ github.job }}-${{ github.run_attempt }}
          path: ci_runtime_baseline_artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Output CI runtime summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## CI Runtime Baseline: ${{ github.job }}"
            echo ""
            echo "| step_id | elapsed_ms | status |"
            echo "|---|---|---|"
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      m = json.loads(line)
                      print(f"| {m['step_id']} | {m['elapsed_ms']} | {m['status']} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  codex-execpolicy:
    # Issue #1760: dedicated Node/Codex CLI lane. python-test-core (above) is
    # Python-only (AC1/AC2); this job owns Node/npm/npx/codex commands, the
    # real @openai/codex execpolicy matrix, and the codex-only runtime guard
    # test tests/codex/test_local_main_branch_guard.py (secondary_coverage
    # .dedicated_lanes[].provider_job in .github/ci/python-test-plan.json,
    # AC4). scripts/ci/tests/test_codex_execpolicy_matrix.py and
    # tests/codex/test_execpolicy_matrix.py stay plan targets in
    # python-test-core (AC3) AND are re-run here against the real pinned
    # codex binary (unchanged behavior, just relocated with the matrix step).
    if: ${{ github.event.inputs.python_test_bench != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      # Issue #1824 P1-4: ci-verdict-summary only needs the small status sentinel
      # (a few KB), never the full evidence artifact -- see the split upload steps
      # below. Downloading the status-only artifact avoids fetching the (formerly
      # ~110MB) npm install tree that used to be nested inside
      # codex_execpolicy_artifacts/.
      artifact_id: ${{ steps.upload-codex-execpolicy-status.outputs.artifact-id }}
      artifact_name: codex-execpolicy-status-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
      - name: uv python install
        run: uv python install
      - name: uv sync (locked, dev group)
        run: uv sync --locked --group dev
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Create codex-execpolicy sentinel artifact (AC6)
        # Written BEFORE the matrix orchestrator starts so a hard bootstrap
        # failure inside the next step (process killed, OOM, etc.) still
        # leaves a status artifact behind for scripts/ci/verify_ci_check_conclusions.py.
        run: |
          mkdir -p codex_execpolicy_artifacts
          python3 - <<'PY'
          import json
          import os
          import pathlib

          pathlib.Path("codex_execpolicy_artifacts/codex_execpolicy_matrix_status_v1.json").write_text(
              json.dumps(
                  {
                      "schema": "codex_execpolicy_matrix_status_v1",
                      "status": "started",
                      "run_id": os.environ.get("GITHUB_RUN_ID"),
                      "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  },
                  indent=2,
              )
          )
          PY
      - name: codex execpolicy + cleanup-route matrix (timed)
        run: |
          _t0=$(date +%s%3N)
          set +e
          mkdir -p codex_execpolicy_artifacts
          # The required gate is fail-closed only if install, version, and
          # `codex execpolicy check --help` all succeed inside the same
          # artifact-writing orchestrator.
          # Issue #1824 P1-4: --npm-prefix installs the FULL @openai/codex npm
          # package tree (node_modules, native binaries, etc) -- several orders of
          # magnitude larger than the JSON evidence this job actually needs to
          # keep. Installing it OUTSIDE codex_execpolicy_artifacts/ (the directory
          # actually uploaded as an artifact below) is the fix for the reported
          # ~110MB codex-execpolicy-1 artifact; only the small JSON files under
          # codex_execpolicy_artifacts/ are ever uploaded.
          python3 scripts/ci/codex_execpolicy_matrix.py \
            --npm-prefix "${RUNNER_TEMP}/codex-cli-npm-prefix" \
            --package-spec "@openai/codex@0.142.0" \
            --expected-version "codex-cli 0.142.0" \
            --rules .codex/rules/default.rules \
            --artifact codex_execpolicy_artifacts/codex_execpolicy_matrix_v1.json
          _matrix=$?
          uv run --locked pytest \
            scripts/ci/tests/test_codex_execpolicy_matrix.py \
            tests/codex/test_execpolicy_matrix.py \
            tests/codex/test_local_main_branch_guard.py \
            -q
          _pytest=$?
          _s=$(( _matrix != 0 ? _matrix : _pytest ))
          set -e
          printf '{"step_id":"codex_execpolicy_matrix","phase_id":"codex_execpolicy","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          python3 - "$_s" <<'PY'
          import json
          import pathlib
          import sys

          exit_code = int(sys.argv[1])
          p = pathlib.Path("codex_execpolicy_artifacts/codex_execpolicy_matrix_status_v1.json")
          data = json.loads(p.read_text()) if p.exists() else {"schema": "codex_execpolicy_matrix_status_v1"}
          data["status"] = "completed" if exit_code == 0 else "matrix_failed"
          data["exit_code"] = exit_code
          p.write_text(json.dumps(data, indent=2))
          PY
          exit $_s
      - name: Ensure codex-execpolicy sentinel reflects bootstrap failure (AC6)
        # If the matrix step above never ran to completion (setup-node /
        # uv sync / install failed before python3 could update the sentinel),
        # this always-run step still leaves a fail-closed status artifact.
        if: ${{ !cancelled() }}
        run: |
          mkdir -p codex_execpolicy_artifacts
          python3 - <<'PY'
          import json
          import pathlib

          p = pathlib.Path("codex_execpolicy_artifacts/codex_execpolicy_matrix_status_v1.json")
          if p.exists():
              data = json.loads(p.read_text())
              if data.get("status") == "started":
                  data["status"] = "bootstrap_failed"
          else:
              data = {"schema": "codex_execpolicy_matrix_status_v1", "status": "bootstrap_failed"}
          p.write_text(json.dumps(data, indent=2))
          PY
      - name: Upload codex-execpolicy STATUS artifact (small, always)
        # Issue #1824 P1-4: the status sentinel is the ONLY thing ci-verdict-summary
        # downloads (a few KB). Split from the fuller evidence artifact below so a
        # merge-ready check never has to fetch a large ZIP just to read one small
        # JSON file.
        id: upload-codex-execpolicy-status
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: codex-execpolicy-status-${{ github.run_attempt }}
          path: codex_execpolicy_artifacts/codex_execpolicy_matrix_status_v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload codex-execpolicy EVIDENCE artifact (npm ls / native binary sha / probes)
        # Issue #1824 P1-4: kept SEPARATE from the status artifact and with a SHORT
        # retention -- this is diagnostic detail (npm ls output, native binary
        # realpath/sha256, version/help probe stdout+stderr), not merge-ready
        # evidence. The npm install tree itself (~110MB) is never inside this path
        # because --npm-prefix now installs to $RUNNER_TEMP, outside
        # codex_execpolicy_artifacts/.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: codex-execpolicy-evidence-${{ github.run_attempt }}
          path: codex_execpolicy_artifacts/codex_execpolicy_matrix_v1.json
          if-no-files-found: warn
          retention-days: 3
      - name: Collect ci_runtime_baseline_v1 artifact
        # Issue #1824 P1-5: docs/dev/ci-performance.md documents codex-execpolicy
        # as a ci_runtime_baseline_v1 job, but this job previously only appended to
        # measurements.jsonl without ever generating/uploading the baseline
        # artifact -- connect the same collector used by every other timed job.
        if: ${{ !cancelled() }}
        env:
          GH_JOB: ${{ github.job }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci_runtime_baseline_artifacts
          python3 - <<'PY'
          import json, os, pathlib
          measurements = []
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      r = json.loads(line)
                      r.update({
                          "run_id": os.environ["GH_RUN_ID"],
                          "run_attempt": os.environ["GH_RUN_ATTEMPT"],
                          "head_sha": os.environ["GH_HEAD_SHA"],
                          "merge_sha": os.environ["GH_SHA"],
                          "job": os.environ["GH_JOB"],
                          "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
                          "measurement_method": "date_plus3N_ms"
                      })
                      measurements.append(r)
          artifact = {
              "schema": "ci_runtime_baseline_v1",
              "run_id": os.environ["GH_RUN_ID"],
              "run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "head_sha": os.environ["GH_HEAD_SHA"],
              "merge_sha": os.environ["GH_SHA"],
              "job": os.environ["GH_JOB"],
              "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
              "measurement_method": "date_plus3N_ms",
              "measurements": measurements,
          }
          out = pathlib.Path("ci_runtime_baseline_artifacts/ci_runtime_baseline_v1.json")
          out.write_text(json.dumps(artifact, indent=2))
          print(f"Written: {out}")
          PY
      - name: Upload ci-runtime-baseline artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-baseline-${{ github.job }}-${{ github.run_attempt }}
          path: ci_runtime_baseline_artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Output CI runtime summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## CI Runtime Baseline: ${{ github.job }}"
            echo ""
            echo "| step_id | elapsed_ms | status |"
            echo "|---|---|---|"
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      m = json.loads(line)
                      print(f"| {m['step_id']} | {m['elapsed_ms']} | {m['status']} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  python-test:
    # Issue #1760 AC5: required aggregate status check (name unchanged --
    # docs/ops/branch-protection.md keeps referencing "python-test"). Fails
    # or is skipped whenever either dependency job fails/skips, EXCEPT during
    # a python_test_bench workflow_dispatch run (AC10), where codex-execpolicy
    # is intentionally skipped by design (the dispatch input's documented
    # contract is "run ONLY the python-test-core job").
    runs-on: ubuntu-latest
    needs: [python-test-core, codex-execpolicy]
    if: always()
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
      - name: Evaluate python_test_bench_aggregate_policy (AC5/AC10)
        # Issue #1824 P1-1: the aggregate policy decision is delegated to a
        # dedicated, table-driven-tested script (scripts/ci/evaluate_python_test_aggregate.py)
        # instead of an inline heredoc, because a string-search verifier
        # ("does the run: text contain 'python_test_bench_aggregate_policy'?")
        # cannot detect a heredoc body being replaced with a no-op stub that
        # still contains that string. scripts/ci/verify_python_test_lane.py
        # additionally requires this EXACT invocation (no `if:`, no
        # continue-on-error, exactly one occurrence) -- see check_aggregate_job.
        run: |
          uv run --locked python3 scripts/ci/evaluate_python_test_aggregate.py \
            --core-result "${{ needs.python-test-core.result }}" \
            --codex-result "${{ needs.codex-execpolicy.result }}" \
            --bench-mode "${{ github.event.inputs.python_test_bench }}"

  node-backed-hook-tests:
    if: ${{ github.event.inputs.python_test_bench != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # fetch-depth: 0 so the ci_test_selection generator's explicit base..head git
          # diff resolves (Issue #1064 review: change detection is now fail-closed).
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-python-uv
      - name: uv python install (timed)
        id: timed-uv-python-install
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed uv_python_install uv python install
      - name: uv sync (timed)
        id: timed-uv-sync
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed uv_sync uv sync --locked --group dev
      - name: Install dependencies (timed)
        id: timed-pnpm-install
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed pnpm_install pnpm install --frozen-lockfile
      - name: pytest node-backed hook tests (timed)
        run: |
          _t0=$(date +%s%3N)
          set +e
          uv run --locked pytest -q \
            .claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable \
            .claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths
          _s=$?
          set -e
          printf '{"step_id":"pytest_node_backed_hook_tests","phase_id":"pytest_node_backed_hooks","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: pytest_session_recording_codex_hook_adapter (timed)
        # Issue #1420 fix_delta 2: dedicated node-backed-hook-tests lane for
        # tests/session_recording/codex/test_hook_adapter.py. This job already
        # runs pnpm install, so the Node child-process dependency
        # (codex-hook-adapter.mjs / ajv / ajv-formats) is available here.
        # Independent of the fixed 2-nodeid disjointness/exact-match invariant
        # check below (do not touch that block).
        run: |
          _t0=$(date +%s%3N)
          set +e
          uv run --locked pytest -q tests/session_recording/codex/test_hook_adapter.py -p no:xdist
          _s=$?
          set -e
          printf '{"step_id":"pytest_session_recording_codex_hook_adapter","phase_id":"pytest_session_recording_codex_hook_adapter","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: pytest_session_recording_codex_initial_branch_create_lane (timed)
        # Issue #1449 fix_delta (PR #1479 review): dedicated node-backed-hook-tests
        # lane for tests/session_recording/codex/test_initial_branch_create_lane.py,
        # which exercises the real codex-hook-adapter.mjs node subprocess (same
        # harness pattern as test_hook_adapter.py above) and was previously an
        # uncovered changed test file (neither python-test targets nor this job's
        # dedicated_lanes referenced it).
        run: |
          _t0=$(date +%s%3N)
          set +e
          uv run --locked pytest -q tests/session_recording/codex/test_initial_branch_create_lane.py -p no:xdist
          _s=$?
          set -e
          printf '{"step_id":"pytest_session_recording_codex_initial_branch_create_lane","phase_id":"pytest_session_recording_codex_initial_branch_create_lane","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: pytest_session_recording_codex_hook_adapter_xdist (timed)
        # Issue #1420 fix_delta 3 AC11: run the same suite under pytest-xdist
        # parallel execution (-n 4 --dist load) to regression-test the manifest
        # write-path race fix under real worker parallelism. The `-p no:xdist`
        # step above is left untouched (both lanes execute).
        run: |
          _t0=$(date +%s%3N)
          set +e
          uv run --locked pytest -q tests/session_recording/codex/test_hook_adapter.py -n 4 --dist load
          _s=$?
          set -e
          printf '{"step_id":"pytest_session_recording_codex_hook_adapter_xdist","phase_id":"pytest_session_recording_codex_hook_adapter_xdist","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: node --test session_manifest_debounce (AC4/AC6, Node 22) (timed)
        # Issue #1141 AC6: virtual-clock unit tests for flushLoop DI core.
        # Node 22 is guaranteed by the setup-node-pnpm composite action (default
        # node-version: '22'). This step runs in the node-backed-hook-tests job
        # so it has both Node and Python/uv available.
        run: |
          _t0=$(date +%s%3N)
          set +e
          node --test .claude/hooks/tests/test_session_manifest_debounce.mjs
          _s=$?
          set -e
          printf '{"step_id":"node_test_debounce_ac4","phase_id":"node_test_debounce","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: Generate node-backed hook selection artifact
        run: |
          mkdir -p ci_test_selection_artifacts
          uv run --locked pytest --collect-only -q \
            .claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable \
            .claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths \
            tests/session_recording/codex/test_hook_adapter.py \
            tests/session_recording/codex/test_initial_branch_create_lane.py \
            > ci_test_selection_artifacts/node_backed_hook_tests_collect_only.txt
          uv run --locked pytest --collect-only -q \
            .claude/hooks/tests/ \
            --ignore=.claude/hooks/tests/test_secret_boundary_contract.py \
            --deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable \
            --deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths \
            > ci_test_selection_artifacts/python_hook_tests_collect_only.txt
          python3 - <<'PY'
          import argparse
          import importlib.util
          import json
          import pathlib
          import sys

          script_path = pathlib.Path(
              ".claude/skills/pr-review-judge/scripts/generate_ci_test_selection_artifact.py"
          )
          spec = importlib.util.spec_from_file_location(
              "generate_ci_test_selection_artifact", script_path
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          args = argparse.Namespace(
              output="ci_test_selection_artifacts/ci_test_selection_v1.json",
              pytest_args=[
                  ".claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable",
                  ".claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths",
                  "tests/session_recording/codex/test_hook_adapter.py",
                  "tests/session_recording/codex/test_initial_branch_create_lane.py",
              ],
              plan=".github/ci/python-test-plan.json",
              pr_head_sha="${{ github.event.pull_request.head.sha || github.sha }}",
              base_sha="${{ github.event.pull_request.base.sha || github.event.before }}",
              head_sha="${{ github.event.pull_request.head.sha || github.sha }}",
              checked_out_sha=None,
              merge_sha="${{ github.sha }}",
              workflow="ci",
              job="node-backed-hook-tests",
              ci_run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          )
          exit_code = module.generate_artifact(args)
          if exit_code != 0:
              sys.exit(exit_code)

          # Fixed 2-nodeid sublane (Node child-process hook wrapper tests, #1064).
          # This invariant is unchanged and independent of the collect-only
          # extension below (Issue #1420 fix_delta AC8).
          node_backed_nodeids = [
              ".claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable",
              ".claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths",
          ]
          # #1420 fix_delta AC8: the session_recording sublane is now ALSO
          # collected in this same collect-only pass so the G1
          # uncovered_changed_test_files gate observes real execution evidence
          # for tests/session_recording/codex/test_hook_adapter.py instead of
          # relying solely on the python-test-plan.json declared
          # secondary_coverage entry.
          # #1449 fix_delta (PR #1479 review): tests/session_recording/codex/
          # test_initial_branch_create_lane.py joins the same sublane (same
          # directory, same real codex-hook-adapter.mjs node subprocess
          # harness) so it is also treated as session_recording, not as a
          # "fixed hook wrapper" nodeid.
          session_recording_prefixes = (
              "tests/session_recording/codex/test_hook_adapter.py",
              "tests/session_recording/codex/test_initial_branch_create_lane.py",
          )
          artifact_dir = pathlib.Path("ci_test_selection_artifacts")
          python_lines = [
              line.strip()
              for line in (artifact_dir / "python_hook_tests_collect_only.txt").read_text().splitlines()
              if line.strip() and "::" in line
          ]
          node_lines = [
              line.strip()
              for line in (artifact_dir / "node_backed_hook_tests_collect_only.txt").read_text().splitlines()
              if line.strip() and "::" in line
          ]
          session_recording_nodeids = sorted(
              line for line in node_lines if line.startswith(session_recording_prefixes)
          )
          fixed_hook_wrapper_nodeids = sorted(
              line for line in node_lines if not line.startswith(session_recording_prefixes)
          )

          python_absent = sorted(nodeid for nodeid in node_backed_nodeids if nodeid not in python_lines)
          node_exact_match = fixed_hook_wrapper_nodeids == sorted(node_backed_nodeids)
          overlap = sorted(set(python_lines) & set(node_lines))
          summary = {
              "schema": "ci_test_selection_summary_v1",
              "python_test": {
                  "collect_only_path": "ci_test_selection_artifacts/python_hook_tests_collect_only.txt",
                  "node_backed_nodeids_absent": len(python_absent) == len(node_backed_nodeids),
                  "absent_nodeids": python_absent,
                  "collected_count": len(python_lines),
              },
              "node_backed_hook_tests": {
                  "collect_only_path": "ci_test_selection_artifacts/node_backed_hook_tests_collect_only.txt",
                  "exact_nodeid_count": len(node_lines),
                  "exactly_expected_two": len(fixed_hook_wrapper_nodeids) == 2,
                  "matches_expected_nodeids": node_exact_match,
                  "collected_nodeids": node_lines,
                  "session_recording_nodeids_count": len(session_recording_nodeids),
                  "session_recording_nodeids_present": len(session_recording_nodeids) > 0,
              },
              "union_disjointness": {
                  "disjoint": not overlap,
                  "overlap_nodeids": overlap,
                  "union_count": len(set(python_lines) | set(node_lines)),
              },
          }
          out = artifact_dir / "ci_test_selection_summary_v1.json"
          out.write_text(json.dumps(summary, indent=2) + "\n")

          if not summary["python_test"]["node_backed_nodeids_absent"]:
              raise SystemExit("Node-backed nodeids still present in python-test collect-only output")
          if not summary["node_backed_hook_tests"]["exactly_expected_two"]:
              raise SystemExit("node-backed-hook-tests collect-only output did not contain exactly 2 fixed nodeids")
          if not summary["node_backed_hook_tests"]["matches_expected_nodeids"]:
              raise SystemExit("node-backed-hook-tests collect-only output did not match expected fixed nodeids")
          if not summary["node_backed_hook_tests"]["session_recording_nodeids_present"]:
              raise SystemExit("node-backed-hook-tests collect-only output did not include tests/session_recording/codex/test_hook_adapter.py nodeids")
          if not summary["union_disjointness"]["disjoint"]:
              raise SystemExit("python-test and node-backed-hook-tests collect-only outputs overlapped")
          PY
      - name: Verify node-backed ci_test_selection evidence files
        run: |
          test -s ci_test_selection_artifacts/node_backed_hook_tests_collect_only.txt
          test -s ci_test_selection_artifacts/python_hook_tests_collect_only.txt
          test -s ci_test_selection_artifacts/ci_test_selection_v1.json
          test -s ci_test_selection_artifacts/ci_test_selection_summary_v1.json
      - uses: actions/upload-artifact@v7
        with:
          name: ci_test_selection_node_backed_hook_tests
          path: ci_test_selection_artifacts/
          if-no-files-found: error
      - name: Collect ci_runtime_baseline_v1 artifact
        if: ${{ !cancelled() }}
        env:
          GH_JOB: ${{ github.job }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci_runtime_baseline_artifacts
          python3 - <<'PY'
          import json, os, pathlib
          measurements = []
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      r = json.loads(line)
                      r.update({
                          "run_id": os.environ["GH_RUN_ID"],
                          "run_attempt": os.environ["GH_RUN_ATTEMPT"],
                          "head_sha": os.environ["GH_HEAD_SHA"],
                          "merge_sha": os.environ["GH_SHA"],
                          "job": os.environ["GH_JOB"],
                          "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
                          "measurement_method": "date_plus3N_ms"
                      })
                      measurements.append(r)
          artifact = {
              "schema": "ci_runtime_baseline_v1",
              "run_id": os.environ["GH_RUN_ID"],
              "run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "head_sha": os.environ["GH_HEAD_SHA"],
              "merge_sha": os.environ["GH_SHA"],
              "job": os.environ["GH_JOB"],
              "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
              "measurement_method": "date_plus3N_ms",
              "measurements": measurements,
          }
          out = pathlib.Path("ci_runtime_baseline_artifacts/ci_runtime_baseline_v1.json")
          out.write_text(json.dumps(artifact, indent=2))
          print(f"Written: {out}")
          PY
      - name: Upload ci-runtime-baseline artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-baseline-${{ github.job }}-${{ github.run_attempt }}
          path: ci_runtime_baseline_artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Output CI runtime summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## CI Runtime Baseline: ${{ github.job }}"
            echo ""
            echo "| step_id | elapsed_ms | status |"
            echo "|---|---|---|"
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      m = json.loads(line)
                      print(f"| {m['step_id']} | {m['elapsed_ms']} | {m['status']} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  agy-causal-claim-drift-gate:
    # Issue #1788: CI required check integration for
    # scripts/check_agy_causal_claim_drift.py (added by Issue #1778 / PR
    # #1780 but never wired into CI). Baseline policy: `--apply-baseline`
    # only fails closed on NEW causal-claim drift beyond the pre-existing
    # baseline captured in _CI_GATE_BASELINE_KEYS (script docstring /
    # docs/dev/ci-operations.md have the rationale). Detection logic itself
    # is unchanged (Issue #1788 Out of Scope).
    if: ${{ github.event.inputs.python_test_bench != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
      - name: uv sync
        run: uv sync --locked --group dev
      - name: AGY causal-claim drift gate integration tests (AC4/AC5)
        run: |
          uv run --locked pytest \
            scripts/tests/test_check_agy_causal_claim_drift_ci_gate.py -q
      - name: AGY causal-claim drift gate (baseline-applied, merge-blocking on NEW drift)
        run: |
          uv run --locked python3 scripts/check_agy_causal_claim_drift.py \
            --apply-baseline


  # Issue #2119: dedicated provider job for the responsive viewport x DPR x
  # browser-zoom geometry matrix (`tests/e2e/assist-player-affordance-responsive.spec.ts`),
  # physically split out of `e2e-core` (it was that lane's single largest
  # hotspot, ~3.2min of a ~6.5min run). No DAG dependency on `e2e-core` — the
  # two run in parallel; the `e2e` aggregate job below collects both.
  e2e-responsive-matrix:
    if: ${{ github.event.inputs.python_test_bench != 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_VERSION: "1.60.0"
      # #2159 P0-1: see e2e-core's identical comment above.
      PLAYWRIGHT_CONTAINER_IMAGE_DIGEST: "sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948"
      LOOP_E2E_LANE: responsive
      EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    container:
      image: mcr.microsoft.com/playwright@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # #2159 OWNER scope-authority ruling (issuecomment-5299412215,
          # item 1/P0-2 structural fix): the `workflow_dispatch` `ref` this
          # run was DISPATCHED against stays on the current/default branch
          # (so the WORKFLOW DEFINITION -- `github.workflow_sha` -- is
          # current, never reverted). The application code being MEASURED
          # is checked out here via an EXPLICIT `ref:` override to
          # `target_sha` -- a SEPARATE checkout selector from the dispatch
          # `ref`. `target_sha` (measured code) and `github.workflow_sha`
          # (workflow definition) are therefore allowed, and expected, to
          # differ for a fixed-SHA benchmark dispatch; both are recorded as
          # two independent fields below (never conflated or asserted
          # equal).
          ref: ${{ github.event.inputs.target_sha != '' && github.event.inputs.target_sha || github.sha }}
      - name: Verify checked-out HEAD matches dispatched target_sha (#2159 P0-2)
        if: ${{ github.event.inputs.target_sha != '' }}
        env:
          BENCHMARK_TARGET_SHA: ${{ github.event.inputs.target_sha }}
        run: |
          set -euo pipefail
          # #2184 fix_delta (PR #2493, live AC6 workflow_dispatch run
          # https://github.com/squne121/loop-protocol/actions/runs/33869974220):
          # this step's shell runs inside the `container:` image above (see
          # the pre-existing "Collect ci_runtime_baseline_v1 artifact" step's
          # comment for the same root cause), and the checked-out workspace
          # at $GITHUB_WORKSPACE is owned by a different UID than the
          # container's git config sees by default, which makes ANY bare
          # `git` invocation in this step fail closed with "detected
          # dubious ownership in repository at '$GITHUB_WORKSPACE'" (exit
          # 128). This step is gated `if: target_sha != ''` and only runs
          # on an actual dispatched benchmark run, so it was never exercised
          # until the first live target_sha dispatch above surfaced it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          resolved_head="$(git rev-parse HEAD)"
          if [ "$resolved_head" != "$BENCHMARK_TARGET_SHA" ]; then
            echo "::error::checked-out HEAD ($resolved_head) does not match dispatched target_sha ($BENCHMARK_TARGET_SHA) -- the explicit checkout ref override did not resolve to the expected commit. Refusing to record a benchmark sample for the wrong commit."
            exit 1
          fi
          echo "target_sha verified: $resolved_head (workflow definition SHA: ${{ github.workflow_sha }})"
      - name: Enable pnpm via corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.7.0 --activate
      - name: Install dependencies (timed)
        id: timed-pnpm-install
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed pnpm_install pnpm install --frozen-lockfile
      - name: Verify Playwright Docker image version
        run: |
          PW_VERSION="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$PW_VERSION" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::resolved @playwright/test=$PW_VERSION but Docker image expects v$PLAYWRIGHT_VERSION. Update PLAYWRIGHT_VERSION and container.image digest in ci.yml."
            exit 1
          fi
          echo "playwright_version_match=ok resolved=$PW_VERSION expected=$PLAYWRIGHT_VERSION"
      - name: Build for E2E (timed)
        id: timed-build-e2e
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed pnpm_build_e2e env VITE_E2E_MODE=true pnpm build
      - name: Verify E2E dist boundary
        run: pnpm dist:e2e-boundary --mode e2e --dist dist
      - name: Run responsive-matrix E2E tests (timed)
        id: timed-e2e-responsive-matrix
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed test_e2e_responsive_matrix pnpm exec playwright test tests/e2e/assist-player-affordance-responsive.spec.ts
      - name: Upload Playwright report (e2e-responsive-matrix)
        id: upload-playwright-report-responsive
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-e2e-responsive-matrix
          path: playwright-report-e2e-responsive-matrix/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload test results (e2e-responsive-matrix)
        id: upload-test-results-responsive
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results-e2e-responsive-matrix
          path: test-results-e2e-responsive-matrix/
          if-no-files-found: warn
          retention-days: 30
      - name: Locate responsive-canvas-runtime-evidence.json
        # AC4/AC13: this is the required artifact for the responsive matrix's
        # RESPONSIVE_CANVAS_MATRIX_CONTRACT_V1 evidence — fail closed (not
        # warn) if the test did not actually produce it, per this Issue's
        # Runtime Verification Applicability fallback_policy
        # (fallback_success_is_pass: false).
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p responsive-canvas-runtime-evidence-artifact
          found="$(find test-results-e2e-responsive-matrix -name 'responsive-canvas-runtime-evidence.json' -print -quit || true)"
          if [ -z "$found" ]; then
            echo "::error::responsive-canvas-runtime-evidence.json not found under test-results-e2e-responsive-matrix/ — e2e-responsive-matrix did not produce the required RESPONSIVE_CANVAS_MATRIX_CONTRACT_V1 evidence."
            exit 1
          fi
          cp "$found" responsive-canvas-runtime-evidence-artifact/responsive-canvas-runtime-evidence.json
      - name: Upload responsive-canvas-runtime-evidence artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: responsive-canvas-runtime-evidence-${{ github.run_attempt }}
          path: responsive-canvas-runtime-evidence-artifact/
          if-no-files-found: error
          retention-days: 30
      - name: Collect ci_runtime_baseline_v1 artifact
        if: ${{ !cancelled() }}
        env:
          GH_JOB: ${{ github.job }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_SHA: ${{ github.sha }}
          GH_RUNNER_OS: ${{ runner.os }}
          GH_RUNNER_ARCH: ${{ runner.arch }}
          # #2159 OWNER scope-authority ruling (issuecomment-5299412215, item
          # 1/P0-2): the WORKFLOW DEFINITION's own commit SHA (distinct from
          # the measured application code's `head_sha`, which on a
          # fixed-SHA benchmark dispatch is pinned via an explicit
          # `actions/checkout` `ref:` override to `target_sha`).
          GH_WORKFLOW_SHA: ${{ github.workflow_sha }}
          # #2159 P0-2: populated only on a dedicated fixed-SHA benchmark
          # dispatch (empty string on a normal push/pull_request run, which
          # the producer below falls back to "ci_default" for).
          BENCHMARK_COHORT_ROLE: ${{ github.event.inputs.cohort_role }}
          BENCHMARK_EXPERIMENT_ID: ${{ github.event.inputs.experiment_id }}
          # Issue #2119 AC9 comparable-cohort fingerprint (PR #2137 human
          # review issuecomment-5273090534 P0 fix): the P50 cohort loader
          # must be able to verify every run in a 20-run comparable cohort
          # shares the same runner image / Node / pnpm / Playwright /
          # lockfile / workflow digest, not just runner image.
          # #2159 P0-1 (fix_delta after adversarial review
          # issuecomment-5295659213): the ci_runtime_baseline_v1 producer
          # previously emitted `runner_image` sourced from `ImageOS`/
          # `ImageVersion`, which are NOT populated inside a containerized
          # job (`container: image: mcr.microsoft.com/playwright@...`) --
          # they resolved to the fail-closed-rejected placeholder
          # "unknown/unknown", which `_fingerprint_has_placeholder`
          # correctly (but permanently) excluded every real e2e-core/
          # e2e-responsive-matrix artifact from any comparable cohort.
          # `runner.os`/`runner.arch` ARE always populated (evaluated by the
          # runner itself, not shell env inside the container). This
          # producer now emits BOTH the legacy `runner_image` field
          # (unchanged, for any existing consumer) AND the new
          # `host_runner_image` / `playwright_container_image_digest` /
          # `workflow_run_id` / `cohort_role` fields the redesigned
          # WITHIN_COHORT_REQUIRED_EQUAL / CROSS_COHORT_REQUIRED_EQUAL
          # contract (tests/ci/test_ci_performance_gate.py) requires.
          NODE_VERSION_RAW: ""
          PNPM_VERSION_RAW: ""
          LOCKFILE_HASH_RAW: ""
          WORKFLOW_DIGEST_RAW: ""
          # #2184 AC1: `measured_head_sha` (distinct from `head_sha`
          # above, which resolves to `github.sha` -- the workflow_dispatch
          # ref tip -- on a fixed-SHA benchmark dispatch, NOT `target_sha`).
          # Populated below via an independent `git rev-parse HEAD`,
          # regardless of whether `target_sha` was provided, never a
          # direct copy of the `target_sha` input itself. See
          # docs/dev/e2e-performance-benchmark.md.
          GH_MEASURED_HEAD_SHA: ""
        run: |
          mkdir -p ci_runtime_baseline_artifacts
          NODE_VERSION_RAW="$(node -v 2>/dev/null || echo unknown)"
          PNPM_VERSION_RAW="$(pnpm -v 2>/dev/null || echo unknown)"
          LOCKFILE_HASH_RAW="sha256:$(sha256sum pnpm-lock.yaml 2>/dev/null | cut -d' ' -f1 || echo unknown)"
          WORKFLOW_DIGEST_RAW="sha256:$(sha256sum .github/workflows/ci.yml 2>/dev/null | cut -d' ' -f1 || echo unknown)"
          # #2184 fix_delta (pr-reviewer REQUEST_CHANGES, PR #2493 blocker 1):
          # this step's shell runs inside the `container:` image above, and
          # the checked-out workspace at $GITHUB_WORKSPACE is owned by a
          # different UID than the container's git config sees by default,
          # which makes ANY bare `git` invocation in this step fail closed
          # with "detected dubious ownership in repository at
          # '$GITHUB_WORKSPACE'" (exit 128). The pre-existing "Verify
          # checked-out HEAD matches dispatched target_sha" step above never
          # hit this because it's gated `if: target_sha != ''` and only ever
          # ran on an actual dispatched benchmark run; this step's
          # unconditional `git rev-parse HEAD` below runs on every job
          # invocation (including plain push/pull_request CI), so it must
          # register the safe.directory exception itself before invoking
          # `git`.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # #2184 AC1: independent observation of the checked-out commit --
          # NEVER the `target_sha` input verbatim. On a `target_sha`
          # dispatch, the "Verify checked-out HEAD matches dispatched
          # target_sha" step above already hard-fails the job if this
          # would disagree with `target_sha`; on a normal (non-benchmark)
          # run, this simply reflects the actual checked-out commit.
          GH_MEASURED_HEAD_SHA="$(git rev-parse HEAD)"
          export NODE_VERSION_RAW PNPM_VERSION_RAW LOCKFILE_HASH_RAW WORKFLOW_DIGEST_RAW GH_MEASURED_HEAD_SHA
          python3 - <<'PY'
          import json, os, pathlib
          fingerprint_fields = {
              "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
              "node_version": os.environ.get("NODE_VERSION_RAW", "unknown"),
              "pnpm_version": os.environ.get("PNPM_VERSION_RAW", "unknown"),
              "playwright_version": os.environ.get("PLAYWRIGHT_VERSION", "unknown"),
              "lockfile_hash": os.environ.get("LOCKFILE_HASH_RAW", "unknown"),
              "workflow_digest": os.environ.get("WORKFLOW_DIGEST_RAW", "unknown"),
          }
          # #2159 P0-1: v2-contract fields, never placeholder-valued for a
          # containerized job (see the env-block comment above for why the
          # legacy runner_image field is placeholder-prone here).
          v2_fields = {
              "workflow_run_id": int(os.environ["GH_RUN_ID"]),
              "host_runner_image": (
                  os.environ.get("GH_RUNNER_OS", "unknown") + "/" + os.environ.get("GH_RUNNER_ARCH", "unknown")
              ),
              "host_runner_image_provenance": "os_arch_fallback",
              "playwright_container_image_digest": os.environ.get(
                  "PLAYWRIGHT_CONTAINER_IMAGE_DIGEST", "unknown"
              ),
              "cohort_role": os.environ.get("BENCHMARK_COHORT_ROLE") or "ci_default",
              "experiment_id": os.environ.get("BENCHMARK_EXPERIMENT_ID") or None,
              # #2159 OWNER scope-authority ruling (issuecomment-5299412215,
              # item 1/P0-2): `github.workflow_sha` is the commit of the
              # WORKFLOW DEFINITION that produced this run (distinct from
              # `head_sha`, the measured application code's commit, which on
              # a fixed-SHA benchmark dispatch is pinned via an explicit
              # `actions/checkout` `ref:` override to `target_sha`). Recorded
              # as an independent field -- never conflated with `head_sha`.
              "workflow_sha": os.environ.get("GH_WORKFLOW_SHA", "unknown"),
              # #2184 AC1: the MEASURED application code's commit, observed
              # independently via `git rev-parse HEAD` in this step (never a
              # direct copy of the `target_sha` dispatch input). Distinct
              # from `head_sha` above (which resolves to `github.sha` --
              # the dispatch ref tip -- on a fixed-SHA benchmark dispatch)
              # and from `workflow_sha` (the workflow DEFINITION's commit).
              "measured_head_sha": os.environ.get("GH_MEASURED_HEAD_SHA", "unknown"),
          }
          measurements = []
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      r = json.loads(line)
                      r.update({
                          "run_id": os.environ["GH_RUN_ID"],
                          "run_attempt": os.environ["GH_RUN_ATTEMPT"],
                          "head_sha": os.environ["GH_HEAD_SHA"],
                          "merge_sha": os.environ["GH_SHA"],
                          "job": os.environ["GH_JOB"],
                          "measurement_method": "date_plus3N_ms",
                          **fingerprint_fields,
                      })
                      measurements.append(r)
          artifact = {
              "schema": "ci_runtime_baseline_v1",
              "run_id": os.environ["GH_RUN_ID"],
              "run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "head_sha": os.environ["GH_HEAD_SHA"],
              "merge_sha": os.environ["GH_SHA"],
              "job": os.environ["GH_JOB"],
              "measurement_method": "date_plus3N_ms",
              "measurements": measurements,
              **fingerprint_fields,
              **v2_fields,
          }
          out = pathlib.Path("ci_runtime_baseline_artifacts/ci_runtime_baseline_v1.json")
          out.write_text(json.dumps(artifact, indent=2))
          print(f"Written: {out}")
          PY
      - name: Upload ci-runtime-baseline artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-baseline-${{ github.job }}-${{ github.run_attempt }}
          path: ci_runtime_baseline_artifacts/
          if-no-files-found: error
          retention-days: 30

  # Issue #2119 AC6: aggregate `e2e` — the stable required-check name existing
  # consumers (ci-verdict-summary, branch protection) already reference.
  # `needs` + `if: always()` so it always runs and can distinguish, without
  # degrading to success:
  #   (a) static topology failure — a provider job definition itself missing
  #       from the workflow (this would make the `needs:` list below
  #       reference an undefined job, which GitHub Actions itself rejects at
  #       workflow-parse time; `scripts/ci/verify-e2e-lane-partition.mjs` /
  #       `tests/ci/` additionally verify the static topology independently
  #       of a live run).
  #   (b) runtime result failure — `needs.<job>.result` is failure/cancelled/skipped.
  #   (c) runtime evidence failure — a provider job reports `success` but its
  #       required artifact/output is actually missing (checked below via
  #       each provider job's own fail-closed artifact upload step, whose
  #       `if-no-files-found: error` already turns evidence absence into a
  #       job failure — this step re-asserts that binding explicitly so a
  #       provider job cannot report `success` while silently omitting its
  #       required artifact).
  e2e:
    needs: [e2e-core, e2e-responsive-matrix]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate e2e-core / e2e-responsive-matrix conclusions
        env:
          E2E_CORE_RESULT: ${{ needs.e2e-core.result }}
          E2E_RESPONSIVE_RESULT: ${{ needs.e2e-responsive-matrix.result }}
        run: |
          set -euo pipefail
          echo "e2e-core.result=$E2E_CORE_RESULT"
          echo "e2e-responsive-matrix.result=$E2E_RESPONSIVE_RESULT"
          fail=0
          for pair in "e2e-core:$E2E_CORE_RESULT" "e2e-responsive-matrix:$E2E_RESPONSIVE_RESULT"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              success)
                ;;
              failure)
                echo "::error::runtime result failure: $job concluded 'failure'"
                fail=1
                ;;
              cancelled)
                echo "::error::runtime result failure: $job concluded 'cancelled'"
                fail=1
                ;;
              skipped)
                echo "::error::runtime result failure: $job concluded 'skipped' (provider job did not run)"
                fail=1
                ;;
              *)
                echo "::error::unrecognized needs.$job.result: '$result'"
                fail=1
                ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::e2e aggregate: at least one provider job did not succeed — not degrading to success."
            exit 1
          fi
          echo "e2e aggregate: both e2e-core and e2e-responsive-matrix succeeded (runtime result + provider-enforced runtime evidence via if-no-files-found: error)."

  component-vrt-report:
    # Issue #1389 (Scope Delta): non-required, report-only Vitest Browser
    # Mode component VRT lane — distinct from the Playwright `e2e` job
    # above (In Scope / Out of Scope: never registered in GitHub branch
    # protection required checks, never replaces Playwright E2E VRT). The
    # `pnpm test:vrt:component` step below never uses `continue-on-error`
    # or `|| true` — its real exit code determines this job's own
    # conclusion. That conclusion never blocks merge-ready:
    # `component-vrt-report` is classified `excluded` in
    # .claude/skills/pr-review-judge/scripts/ci_verdict_summary_v2.py
    # CLASSIFICATION_MAP (Scope Delta) so determine_check_verdict() never
    # treats it as blocking regardless of pass/fail.
    if: ${{ github.event.inputs.python_test_bench != 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_VERSION: "1.60.0"
    container:
      image: mcr.microsoft.com/playwright@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    # Issue #2019 AC18: job outputs exposing the evidence manifest artifact
    # id/digest for the `visual-impact-policy` job (`needs`d below).
    outputs:
      vrt_evidence_artifact_id: ${{ steps.vrt-evidence-artifact-digest.outputs.artifact_id }}
      vrt_evidence_artifact_digest: ${{ steps.vrt-evidence-artifact-digest.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Issue #2019 P0-5 (V2 manifest): this job's "Build ... manifest" step
      # now invokes `uv run --locked python3 scripts/agent-ops/resolve_visual_impact.py`
      # (the governed Python invocation policy, #1193) instead of a bare
      # inline `python3 - <<'PY'` heredoc -- `uv` is not preinstalled in the
      # Playwright container image this job runs in, so it must be set up
      # explicitly here (unlike jobs that run directly on `ubuntu-latest`).
      - uses: ./.github/actions/setup-python-uv
      - name: Enable pnpm via corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.7.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Playwright Docker image version
        run: |
          PW_VERSION="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$PW_VERSION" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::resolved @playwright/test=$PW_VERSION but Docker image expects v$PLAYWRIGHT_VERSION. Update PLAYWRIGHT_VERSION and container.image digest in ci.yml."
            exit 1
          fi
          echo "playwright_version_match=ok resolved=$PW_VERSION expected=$PLAYWRIGHT_VERSION"
      - name: Typecheck component VRT
        id: typecheck-component-vrt
        run: pnpm typecheck:component-vrt
      - name: Run component VRT (Vitest Browser Mode, report-only)
        id: run-component-vrt
        run: pnpm test:vrt:component
      - name: Upload component VRT screenshots (baseline + actual/diff/expected on failure)
        id: upload-component-vrt-screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: component-vrt-screenshots
          path: |
            tests/component/__screenshots__/
            .vitest-attachments/tests/component/**
          if-no-files-found: warn
          retention-days: 30
          # PR #1977 review fix (P0 item 1, OWNER REQUEST_CHANGES):
          # `.vitest-attachments/` is a hidden (dot-prefixed) directory.
          # `actions/upload-artifact` excludes hidden files/directories by
          # default, so without this the actual/diff evidence
          # (Issue #1389 AC9) would silently never be uploaded on the case
          # that matters most: a real visual mismatch. The negative-control
          # steps below prove this end to end (not just that the YAML looks
          # right).
          include-hidden-files: true
      # --- Hidden-attachment-upload negative control (PR #1977 review fix,
      # P0 item 1) --------------------------------------------------------
      # Deliberately runs a controlled, guaranteed-mismatch fixture
      # (tests/component/__negative_control__/hidden-attachment-negative-control.vrt.test.ts,
      # never the real combat-hud-running baseline) and proves that its
      # actual/diff attachments survive a real upload-artifact round trip
      # via download-artifact, not merely that the workflow YAML declares
      # `include-hidden-files: true`.
      - name: Run hidden-attachment negative control (expected to mismatch)
        id: run-negative-control
        continue-on-error: true
        env:
          VITE_VRT_NEGATIVE_CONTROL: "true"
        run: pnpm exec vitest run --config vitest.visual.config.ts tests/component/__negative_control__/hidden-attachment-negative-control.vrt.test.ts
      - name: Verify the negative control actually mismatched
        if: ${{ always() }}
        env:
          NEGATIVE_CONTROL_OUTCOME: ${{ steps.run-negative-control.outcome }}
        run: |
          if [ "${NEGATIVE_CONTROL_OUTCOME}" != "failure" ]; then
            echo "::error::hidden-attachment negative control outcome was '${NEGATIVE_CONTROL_OUTCOME}', expected 'failure' (the fixture is designed to ALWAYS mismatch). If it passed or was skipped, the fixture itself is broken and can no longer prove the actual/diff artifact pipeline works end to end."
            exit 1
          fi
          echo "negative_control_outcome=ok (mismatched as expected)"
      - name: Upload negative control attachments
        id: upload-negative-control-attachments
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: component-vrt-negative-control-attachments
          path: .vitest-attachments/tests/component/__negative_control__/**
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Download negative control attachments (round-trip proof)
        if: ${{ always() }}
        uses: actions/download-artifact@v6
        with:
          name: component-vrt-negative-control-attachments
          path: negative-control-download
      - name: Assert actual/diff PNGs survived the hidden-file upload round trip
        if: ${{ always() }}
        id: verify-negative-control-attachments
        run: |
          shopt -s globstar nullglob
          actual_files=(negative-control-download/**/*-actual-*.png)
          diff_files=(negative-control-download/**/*-diff-*.png)
          if [ "${#actual_files[@]}" -eq 0 ]; then
            echo "::error::no *-actual-*.png found in the downloaded component-vrt-negative-control-attachments artifact — the hidden .vitest-attachments upload is NOT working end to end."
            find negative-control-download -type f
            exit 1
          fi
          if [ "${#diff_files[@]}" -eq 0 ]; then
            echo "::error::no *-diff-*.png found in the downloaded component-vrt-negative-control-attachments artifact — the hidden .vitest-attachments upload is NOT working end to end."
            find negative-control-download -type f
            exit 1
          fi
          echo "hidden_attachment_upload_proof=ok actual=${actual_files[*]} diff=${diff_files[*]}"
      # --- end negative control ------------------------------------------
      # --- Mutation negative control (Issue #2014 AC3 / AC8) --------------
      # Proves the comparator (AC1's calibrated allowedMismatchedPixels cap)
      # has real detection power by deliberately hiding HULL / Pause /
      # elapsed ONE AT A TIME (env-gated `test.skipIf` in
      # tests/component/combat-hud-running.vrt.test.ts) and asserting the
      # SAME running-scenario toMatchScreenshot() call against the SAME
      # committed baseline fails with a non-zero mismatch. Each control is a
      # separate step (continue-on-error) so CI can report a per-target
      # `expected_failure` result for the evidence manifest below.
      - name: Run mutation negative control (HULL hidden, expected to mismatch)
        id: run-mutation-control-hull
        continue-on-error: true
        env:
          VITE_VRT_MUTATION_CONTROL_HULL: "true"
        run: pnpm exec vitest run --config vitest.visual.config.ts -t "hull_hidden" tests/component/combat-hud-running.vrt.test.ts
      - name: Run mutation negative control (Pause hidden, expected to mismatch)
        id: run-mutation-control-pause
        continue-on-error: true
        env:
          VITE_VRT_MUTATION_CONTROL_PAUSE: "true"
        run: pnpm exec vitest run --config vitest.visual.config.ts -t "pause_hidden" tests/component/combat-hud-running.vrt.test.ts
      - name: Run mutation negative control (elapsed hidden, expected to mismatch)
        id: run-mutation-control-elapsed
        continue-on-error: true
        env:
          VITE_VRT_MUTATION_CONTROL_ELAPSED: "true"
        run: pnpm exec vitest run --config vitest.visual.config.ts -t "elapsed_hidden" tests/component/combat-hud-running.vrt.test.ts
      # fix_delta iteration 2 (Issue #2014, independent test-runner
      # verification, CI run
      # https://github.com/squne121/loop-protocol/actions/runs/31247039563):
      # the mutation-control test bodies use `await expect(<promise>).rejects.toThrow()`
      # (tests/component/combat-hud-running.vrt.test.ts) so that a
      # genuinely-detected mismatch makes the GUARDED assertion's rejection
      # the EXPECTED outcome -- the vitest TEST itself PASSES (GH Actions
      # step outcome 'success') when the comparator correctly detects the
      # hidden fragment. This step previously required outcome == 'failure'
      # to mean "detected", which is backwards: it demanded the guard test
      # itself fail even when detection worked correctly, so a genuinely
      # working mutation lane was always reported as broken. Confirmed via
      # direct re-run in the CI-pinned canonical Docker environment
      # (mcr.microsoft.com/playwright@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948):
      # each guarded test genuinely catches a real toMatchScreenshot()
      # rejection (hull_hidden 178px, pause_hidden 371px, elapsed_hidden
      # 95px -- all >> the 48px cap) and the outer `.rejects.toThrow()`
      # assertion PASSES on that real rejection, so the correct expectation
      # is GH Actions step outcome == 'success'.
      - name: Verify all three mutation controls actually mismatched
        if: ${{ always() }}
        env:
          HULL_OUTCOME: ${{ steps.run-mutation-control-hull.outcome }}
          PAUSE_OUTCOME: ${{ steps.run-mutation-control-pause.outcome }}
          ELAPSED_OUTCOME: ${{ steps.run-mutation-control-elapsed.outcome }}
        run: |
          fail=0
          for pair in "hull_hidden:${HULL_OUTCOME}" "pause_hidden:${PAUSE_OUTCOME}" "elapsed_hidden:${ELAPSED_OUTCOME}"; do
            name="${pair%%:*}"
            outcome="${pair##*:}"
            if [ "${outcome}" != "success" ]; then
              echo "::error::mutation control '${name}' outcome was '${outcome}', expected 'success' (the guarded assertion \`await expect(<toMatchScreenshot() call>).rejects.toThrow()\` must itself PASS when hiding a critical HUD fragment is correctly detected as a mismatch). If it failed or was skipped, the comparator (or the control itself) has no real detection power for this fragment."
              fail=1
            else
              echo "mutation_control ${name}=ok (mismatched as expected)"
            fi
          done
          if [ "${fail}" -eq 1 ]; then
            exit 1
          fi
      # --- end mutation negative control -----------------------------------
      # --- Runtime evidence: triple-run determinism + evidence manifest
      # (Issue #2014 AC7 / AC8) --------------------------------------------
      - name: Capture triple-run render-determinism evidence (fresh browser process x3)
        id: evidence-triple-run
        run: pnpm run test:vrt:evidence:triple-run | tee /tmp/vrt-evidence-triple-run.log
      - name: Measure real mismatched-pixel count (zero-tolerance probe)
        id: zero-tolerance-probe
        continue-on-error: true
        run: |
          set -o pipefail
          # Scoped, never-committed override: the ONE real committed
          # `allowedMismatchedPixels: 48,` call site for
          # 'combat-hud-running.png' is temporarily tightened to 0 for this
          # single probe invocation only, then restored immediately after
          # (checked out fresh via git, never pushed/committed). This keeps
          # exactly one literal `toMatchScreenshot('combat-hud-running.png',
          # ...)` call site in the committed source at all times --
          # `scripts/check-visual-artifact-pipeline.py`'s static validator
          # fails closed on duplicate/non-literal comparatorOptions call
          # sites for the same screenshot name otherwise (Issue #2014 AC1
          # derivation comment in the spec file itself).
          cp tests/component/combat-hud-running.vrt.test.ts /tmp/combat-hud-running.vrt.test.ts.orig
          sed -i "0,/allowedMismatchedPixels: 48,/s//allowedMismatchedPixels: 0,/" tests/component/combat-hud-running.vrt.test.ts
          set +e
          pnpm exec vitest run --config vitest.visual.config.ts -t "combat-hud-running scenario" tests/component/combat-hud-running.vrt.test.ts 2>&1 | tee /tmp/vrt-zero-tolerance-probe.log
          probe_status="${PIPESTATUS[0]}"
          set -e
          cp /tmp/combat-hud-running.vrt.test.ts.orig tests/component/combat-hud-running.vrt.test.ts
          exit "${probe_status}"
      - name: Build VISUAL_BASELINE_REVIEW_EVIDENCE_V3 manifest
        # PR #2045 OWNER fix_delta P0-5 second-round REQUEST_CHANGES:
        # per-surface V3 manifest (one record per registered surface,
        # self-binding to its own contract digest + tamper-evidence digest)
        # replaces the single flat V1 record for the whole job. Record
        # construction (including baseline_sha256, which is ALWAYS computed
        # from the on-disk baseline -- never trusted from this shell step) is
        # delegated to `resolve_visual_impact.py --mode
        # build-evidence-manifest`, never re-implemented ad hoc here.
        id: build-evidence-manifest
        if: ${{ always() }}
        env:
          RUN_OUTCOME: ${{ steps.run-component-vrt.outcome }}
          PROBE_OUTCOME: ${{ steps.zero-tolerance-probe.outcome }}
          SCREENSHOTS_ARTIFACT_ID: ${{ steps.upload-component-vrt-screenshots.outputs.artifact-id || '' }}
          # Issue #2014 fix_delta iteration 4: for pull_request-triggered
          # runs, the built-in $GITHUB_SHA is the ephemeral merge-preview
          # commit (a synthetic merge of the PR head into base), not the
          # actual PR head commit -- so the manifest's head_sha must be bound
          # to this instead, matching the pattern already used elsewhere in
          # this file (e.g. line 104).
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Issue #2230 AC2: the producer's own ${{ github.run_attempt }}
          # context, threaded into the per-surface evidence manifest record
          # so the trusted consumer can bind evidence CONTENT (not merely
          # the attempt-specific artifact NAME) to the exact triggering
          # run attempt.
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -o pipefail
          ACTUAL_1="$(grep -o 'actual_sha256_run_1=.*' /tmp/vrt-evidence-triple-run.log | tail -1 | cut -d= -f2)"
          ACTUAL_2="$(grep -o 'actual_sha256_run_2=.*' /tmp/vrt-evidence-triple-run.log | tail -1 | cut -d= -f2)"
          ACTUAL_3="$(grep -o 'actual_sha256_run_3=.*' /tmp/vrt-evidence-triple-run.log | tail -1 | cut -d= -f2)"
          if [ "${ACTUAL_1}" != "${ACTUAL_2}" ] || [ "${ACTUAL_2}" != "${ACTUAL_3}" ]; then
            echo "::error::triple-run actual PNG sha256 differs across runs (${ACTUAL_1} / ${ACTUAL_2} / ${ACTUAL_3}) -- refusing to build an evidence manifest on non-deterministic render output."
            exit 1
          fi
          # AC1/AC8 (Issue #2014): `zero-tolerance-probe` re-runs the
          # running-scenario assertion with allowedMismatchedPixels forced to
          # 0. On a real 0px diff the probe PASSES (mismatched_pixels=0); on
          # any real diff Vitest's own error text reports the exact count
          # ("<N> pixels (ratio <r>) differ."), which is parsed verbatim --
          # never fabricated (Runtime Verification Applicability
          # fallback_policy).
          if [ "${PROBE_OUTCOME}" = "success" ]; then
            RUNNING_MISMATCHED=0
            RUNNING_VERIFY_SUCCEEDED=true
          else
            RUNNING_MISMATCHED="$(grep -oP '^\d+(?= pixels \(ratio)' /tmp/vrt-zero-tolerance-probe.log | tail -1)"
            if [ -z "${RUNNING_MISMATCHED}" ]; then
              echo "::error::zero-tolerance-probe outcome was '${PROBE_OUTCOME}' but no mismatch-count line was found in its output -- refusing to fabricate a mismatched_pixels value."
              RUNNING_MISMATCHED="unknown_non_zero"
            fi
            RUNNING_VERIFY_SUCCEEDED=false
          fi
          # combat-hud-critical has no independent zero-tolerance probe today
          # (only combat-hud-running is triple-run/probed above) -- its
          # verified status is derived from the whole-file component-vrt run
          # outcome (both scenarios live in the same spec file and both
          # `toMatchScreenshot()` calls must pass for RUN_OUTCOME=success).
          # On failure, never guess WHICH scenario mismatched or by how much
          # -- fail-closed sentinel string, same "never fabricate" policy as
          # the running-scenario probe above.
          if [ "${RUN_OUTCOME}" = "success" ]; then
            CRITICAL_MISMATCHED=0
            CRITICAL_VERIFY_SUCCEEDED=true
          else
            CRITICAL_MISMATCHED="unknown_non_zero"
            CRITICAL_VERIFY_SUCCEEDED=false
          fi

          python3 - "$GH_HEAD_SHA" "$GITHUB_RUN_ID" "$GH_RUN_ATTEMPT" "$ACTUAL_1" "$RUNNING_MISMATCHED" "$RUNNING_VERIFY_SUCCEEDED" "$CRITICAL_MISMATCHED" "$CRITICAL_VERIFY_SUCCEEDED" "$SCREENSHOTS_ARTIFACT_ID" <<'PY' > surface_inputs.json
          import json
          import sys

          (
              head_sha, run_id, run_attempt, running_actual_sha256, running_mismatched, running_verify_succeeded,
              critical_mismatched, critical_verify_succeeded, screenshots_artifact_id,
          ) = sys.argv[1:10]

          def to_bool(value):
              return value == "true"

          def to_mismatched(value):
              return int(value) if value.lstrip("-").isdigit() else value

          # Issue #2230 fix_delta P1-2: `workflow_run_id`/`run_attempt` are
          # IDENTITY fields consumed by `resolve_visual_impact.py`'s strict,
          # non-coercing `_require_strict_positive_int` validator (never the
          # lenient `to_mismatched`-style string-coercion above, which is
          # correct only for pixel counts). `$GITHUB_RUN_ID`/`$GH_RUN_ATTEMPT`
          # arrive here as shell strings via sys.argv; GitHub's own
          # `github.run_id`/`github.run_attempt` context values are ALWAYS
          # positive integers by contract, so a plain `int()` cast (not a
          # defensive fallback-to-string) is correct -- if this ever raises,
          # that is itself a real bug worth surfacing loudly, not silently
          # swallowing back into a string identity field.
          run_id_int = int(run_id)
          run_attempt_int = int(run_attempt)

          records = [
              {
                  "surface_id": "combat-hud-running",
                  "head_sha": head_sha,
                  "workflow_run_id": run_id_int,
                  "run_attempt": run_attempt_int,
                  "actual_sha256": running_actual_sha256,
                  "mismatched_pixels": to_mismatched(running_mismatched),
                  "verify_succeeded": to_bool(running_verify_succeeded),
                  "update_executed": False,
                  "update_succeeded": False,
                  "expected_artifact_id": screenshots_artifact_id,
                  "actual_artifact_id": screenshots_artifact_id,
                  "diff_artifact_id": screenshots_artifact_id,
              },
              {
                  "surface_id": "combat-hud-critical",
                  "head_sha": head_sha,
                  "workflow_run_id": run_id_int,
                  "run_attempt": run_attempt_int,
                  # No independent zero-tolerance probe exists for this
                  # surface today -- never fabricate a per-run actual PNG
                  # hash it did not itself produce.
                  "actual_sha256": None,
                  "mismatched_pixels": to_mismatched(critical_mismatched),
                  "verify_succeeded": to_bool(critical_verify_succeeded),
                  "update_executed": False,
                  "update_succeeded": False,
                  "expected_artifact_id": screenshots_artifact_id,
                  "actual_artifact_id": screenshots_artifact_id,
                  "diff_artifact_id": screenshots_artifact_id,
              },
          ]
          json.dump(records, sys.stdout, indent=2)
          PY
          uv run --locked python3 scripts/agent-ops/resolve_visual_impact.py \
            --mode build-evidence-manifest \
            --surface-inputs-file surface_inputs.json \
            --manifest-output /tmp/visual_baseline_review_evidence.json \
            --evidence-manifest-schema v3 \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GH_RUN_ATTEMPT" \
            --head-sha "$GH_HEAD_SHA"
          {
            echo ""
            echo "### VISUAL_BASELINE_REVIEW_EVIDENCE_V3 (Issue #2019 P0-5, Issue #2284 Phase B)"
            echo '```json'
            cat /tmp/visual_baseline_review_evidence.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload VISUAL_BASELINE_REVIEW_EVIDENCE_V3 manifest
        id: upload-evidence-manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          # Issue #2230 AC1/Outcome: attempt-specific artifact name (never a
          # fixed name across reruns) so a rerun's `visual-impact-policy`
          # (same run, matching attempt via `actions/download-artifact`'s
          # exact-name resolution) and the base-locked
          # `visual-impact-trusted-consumer.yml` `name=` filter can never
          # silently adopt an OLDER attempt's stale evidence manifest.
          name: component-vrt-evidence-manifest-${{ github.run_attempt }}
          path: /tmp/visual_baseline_review_evidence.json
          if-no-files-found: error
          retention-days: 30
      # --- end runtime evidence ---------------------------------------------
      # Issue #2019 AC18: expose the evidence manifest artifact id/digest as
      # a job output (not merely the artifact filename) so
      # `visual-impact-policy` can bind VISUAL_IMPACT_DECISION_V1 to the
      # exact artifact this run produced.
      - name: Emit vrt_evidence_artifact_digest job output
        id: vrt-evidence-artifact-digest
        if: ${{ always() }}
        env:
          VRT_EVIDENCE_ARTIFACT_ID: ${{ steps.upload-evidence-manifest.outputs.artifact-id || '' }}
          VRT_EVIDENCE_ARTIFACT_DIGEST: ${{ steps.upload-evidence-manifest.outputs.artifact-digest || '' }}
        run: |
          echo "artifact_id=${VRT_EVIDENCE_ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=${VRT_EVIDENCE_ARTIFACT_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "vrt_evidence_artifact_digest=${VRT_EVIDENCE_ARTIFACT_DIGEST}"

      - name: Summarize component VRT evidence
        if: ${{ always() }}
        env:
          RUN_OUTCOME: ${{ steps.run-component-vrt.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck-component-vrt.outcome }}
          NEGATIVE_CONTROL_OUTCOME: ${{ steps.run-negative-control.outcome }}
          NEGATIVE_CONTROL_PROOF_OUTCOME: ${{ steps.verify-negative-control-attachments.outcome }}
          SCREENSHOTS_URL: ${{ steps.upload-component-vrt-screenshots.outputs.artifact-url || 'N/A' }}
          SCREENSHOTS_DIGEST: ${{ steps.upload-component-vrt-screenshots.outputs.artifact-digest || 'sha256:none' }}
        run: |
          PW_VERSION="$(node -p "require('@playwright/test/package.json').version" 2>/dev/null || echo 'unknown')"
          # PR #1977 review fix (P2 item, OWNER REQUEST_CHANGES): a GitHub
          # Actions step `outcome` is `success` / `failure` / `skipped` /
          # `cancelled` — never an "exit code" — and each state is reported
          # distinctly below so a `skipped` step (e.g. from an earlier
          # dependency-install failure) is never conflated with "no visual
          # mismatch".
          classify_outcome() {
            case "$1" in
              success) echo "success (no visual mismatch)" ;;
              failure) echo "failure (visual mismatch or run failure detected)" ;;
              skipped) echo "skipped (step did not run — NOT the same as a pass)" ;;
              cancelled) echo "cancelled" ;;
              *) echo "unknown ($1)" ;;
            esac
          }
          {
            echo "## Component VRT (report-only, non-required — Issue #1389)"
            echo ""
            echo "This job's pass/fail never blocks merge-ready: see the \`excluded\`"
            echo "CLASSIFICATION_MAP entry for \`component-vrt-report\` in"
            echo "\`.claude/skills/pr-review-judge/scripts/ci_verdict_summary_v2.py\`."
            echo ""
            echo "### Environment fingerprint"
            echo "- typecheck outcome: $(classify_outcome "${TYPECHECK_OUTCOME}")"
            echo "- run outcome: $(classify_outcome "${RUN_OUTCOME}")"
            echo "- runner: ${RUNNER_OS} ${RUNNER_ARCH} (image ${ImageOS:-unknown} ${ImageVersion:-unknown})"
            echo "- node: $(node -p 'process.version')"
            echo "- Playwright: ${PW_VERSION}"
            echo "- browser: chromium"
            echo "- viewport: 1280x720"
            echo "- deviceScaleFactor: 1"
            echo "- screenshot directory: tests/component/__screenshots__/"
            echo ""
            echo "### Artifacts"
            echo "- component-vrt-screenshots (baseline + actual/expected/diff on failure): ${SCREENSHOTS_URL} (digest: ${SCREENSHOTS_DIGEST})"
            echo ""
            echo "### actual / expected / diff"
            if [ "${RUN_OUTCOME}" = "failure" ]; then
              echo "- visual mismatch or run failure detected: see the component-vrt-screenshots artifact above for any *-actual.png / *-expected.png / *-diff.png Vitest Browser Mode wrote"
            else
              echo "- N/A (no visual mismatch; expected/actual/diff are only emitted on toMatchScreenshot() failure)"
            fi
            echo ""
            echo "### Hidden-attachment upload proof (negative control)"
            echo "- fixture outcome: $(classify_outcome "${NEGATIVE_CONTROL_OUTCOME}") (expected: failure — the fixture is a deliberate, controlled mismatch)"
            echo "- round-trip verification: $(classify_outcome "${NEGATIVE_CONTROL_PROOF_OUTCOME}") (proves the uploaded artifact ZIP actually contains *-actual-*.png / *-diff-*.png)"
          } >> "$GITHUB_STEP_SUMMARY"

  visual-impact-policy:
    # Issue #2019: required CI check enforcing VRT disposition on
    # UI-changing PRs (In Scope B/C/F). `needs: [component-vrt-report]` +
    # `if: always()` ensure this job evaluates component-vrt-report's
    # conclusion/artifact even when that job itself fails or is cancelled
    # (component-vrt-report success alone must never gate whether this job
    # runs).
    needs: [component-vrt-report]
    if: always()
    runs-on: ubuntu-latest
    # Issue #2019 AC21: minimal read-only permissions for the APIs used
    # below (CheckRun lookup, artifact download, PR metadata). No write
    # permission is ever granted to this job.
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-python-uv
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve base/head SHAs and registry blob SHAs
        id: shas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}" 2>/dev/null; then
            echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
            # `git rev-parse --verify --quiet` (not plain `git rev-parse`) is
            # required here: without `--verify`, an unresolved `<rev>:<path>`
            # arg makes git rev-parse ALSO echo the raw arg back to stdout
            # (pathspec disambiguation fallback) before exiting non-zero,
            # which corrupts the `||` fallback value with an extra bare line
            # and breaks $GITHUB_OUTPUT parsing (##[error]Invalid format).
            BASE_REGISTRY_BLOB_SHA="$(git rev-parse --verify --quiet "${BASE_SHA}:docs/dev/visual-surfaces.yml" 2>/dev/null || echo '0000000000000000000000000000000000000000')"
          else
            # push / workflow_dispatch (no PR base) -- diff against HEAD
            # itself, which yields an empty changed-path set (no-op run).
            echo "base_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            BASE_REGISTRY_BLOB_SHA="0000000000000000000000000000000000000000"
          fi
          HEAD_REGISTRY_BLOB_SHA="$(git rev-parse --verify --quiet HEAD:docs/dev/visual-surfaces.yml 2>/dev/null || echo '0000000000000000000000000000000000000000')"
          echo "base_registry_blob_sha=${BASE_REGISTRY_BLOB_SHA}" >> "$GITHUB_OUTPUT"
          echo "head_registry_blob_sha=${HEAD_REGISTRY_BLOB_SHA}" >> "$GITHUB_OUTPUT"
      # Issue #2019 P0-6 (OWNER REQUEST_CHANGES, PR #2045): trust-boundary
      # hardening. A full untrusted/trusted 2-phase split (a
      # `pull_request_target`-triggered second workflow, base-branch
      # workflow definition, PR-head code never executed in the trusted
      # phase) is NOT implemented here -- GitHub Actions `on:` triggers are
      # workflow-file-scoped, not job-scoped, so a `pull_request_target` job
      # cannot coexist with this file's `pull_request` jobs inside the SAME
      # `ci.yml`. That split necessarily requires a SECOND workflow file,
      # which is outside this Issue's confirmed Allowed Paths (only
      # `.github/workflows/ci.yml` is confirmed) and `pull_request_target`
      # is itself a high-risk permission surface (base-repo secrets/context
      # access) that should get explicit human/branch-protection review
      # rather than being introduced silently by an implementation worker.
      #
      # Mitigation implemented instead, entirely within this job: the
      # EVALUATOR CODE ITSELF (resolve_visual_impact.py /
      # resolve_visual_impact.mjs / the two visual-impact JSON schemas) is
      # materialized from the BASE branch (`git show <base_sha>:<path>`),
      # never the PR head's own copy, before being executed below. A
      # candidate PR can therefore no longer neuter its own evaluator (e.g.
      # deleting the meta_policy_change fail-closed branch, weakening schema
      # `required`/`additionalProperties`, etc.) -- the code path that
      # judges the PR is always pinned to whatever was already committed to
      # the base branch at merge-base time, independent of what the PR
      # itself changes in the same files. This does NOT eliminate PR-head
      # code execution entirely (component-vrt-report still runs head's
      # Vitest/Playwright code to render screenshots -- that is inherent to
      # visual regression testing and carries no write/secret access), but
      # it DOES remove the PR head's ability to control the pass/fail LOGIC
      # of the required merge-gate check.
      #
      # Bootstrap exception: if a file does not exist at the base SHA yet
      # (e.g. THIS PR is the one introducing it), the head-checked-out copy
      # is used as a logged fallback -- there is no earlier trusted version
      # to fall back to. `trusted_evaluator_bootstrap.log` records every
      # fallback so this is never silently indistinguishable from a
      # genuinely base-pinned run.
      - name: Materialize base-branch-locked visual-impact evaluator (Issue #2019 P0-6)
        id: trusted-evaluator
        env:
          BASE_SHA: ${{ steps.shas.outputs.base_sha }}
        run: |
          set -e
          mkdir -p trusted_evaluator/scripts/agent-ops trusted_evaluator/docs/dev
          : > trusted_evaluator_bootstrap.log
          for rel in             scripts/agent-ops/resolve_visual_impact.py             scripts/agent-ops/resolve_visual_impact.mjs             docs/dev/visual-surfaces.schema.json             docs/dev/visual-impact.schema.json
          do
            if git show "${BASE_SHA}:${rel}" > "trusted_evaluator/${rel}" 2>/dev/null; then
              echo "base_pinned=${rel}"
            else
              cp "${rel}" "trusted_evaluator/${rel}"
              echo "bootstrap_fallback_used_for=${rel} (does not exist at base_sha=${BASE_SHA} yet -- using head copy)" | tee -a trusted_evaluator_bootstrap.log
            fi
          done
          {
            echo ""
            echo "### Trust boundary hardening (Issue #2019 P0-6)"
            echo "- evaluator materialized from base_sha: \`${BASE_SHA}\`"
            if [ -s trusted_evaluator_bootstrap.log ]; then
              echo "- bootstrap fallback (base predates these files, head copy used instead):"
              sed 's/^/  - /' trusted_evaluator_bootstrap.log
            else
              echo "- fully base-pinned: no bootstrap fallback used"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compute changed paths
        id: changed-paths
        env:
          BASE_SHA: ${{ steps.shas.outputs.base_sha }}
          HEAD_SHA: ${{ steps.shas.outputs.head_sha }}
        run: |
          set -o pipefail
          # PR #2045 OWNER fix_delta P0-4: `--name-status -z --find-renames`
          # (not plain `--name-only`) so renames/adds/removes keep their real
          # status instead of everything being forced to "modified" -- the
          # typed {"status","path","old_path"?} record set the policy check
          # consumes for both resolution (old+new path union) and the
          # VISUAL_IMPACT_DECISION_V1 changed_paths_digest.
          #
          # PR #2045 OWNER fix_delta P1-4 / P0-6: parsing is delegated to
          # `resolve_visual_impact.py --mode changed-paths`
          # (parse_git_diff_name_status_z) -- never re-implemented inline
          # here -- and, per the same P0-6 trust-boundary rationale as the
          # policy-check step below, the BASE-BRANCH-LOCKED copy
          # (trusted_evaluator/) is used so a malicious PR head cannot alter
          # its own rename-classification logic to hide a meta-policy-file
          # change from `resolve()`'s meta_policy_change detection.
          if git cat-file -e "${BASE_SHA}" 2>/dev/null; then
            git diff --name-status -z --find-renames "${BASE_SHA}" "${HEAD_SHA}" > changed_paths_name_status.nul
          else
            : > changed_paths_name_status.nul
          fi
          uv run --locked python3 trusted_evaluator/scripts/agent-ops/resolve_visual_impact.py \
            --mode changed-paths \
            --name-status-file changed_paths_name_status.nul \
            --typed-output changed_paths_typed.json \
            --flat-output changed_paths.txt
          cat changed_paths.txt
      - name: Write PR body to file (untrusted input -- never shell-expanded)
        # PR #2137 human review issuecomment-5273090534 P1 fix: the prior
        # `github.event.pull_request.body` reads a snapshot FROZEN at
        # webhook-dispatch time for whatever event triggered this run (e.g.
        # a `push`/`synchronize`), which can genuinely differ from the PR
        # body `visual-impact-trusted-consumer.yml`'s independently-derived
        # trusted step later re-fetches live via `gh api pulls/{num}`
        # (confirmed via `pr_body_digest_mismatch` even with zero
        # intervening body edits). Fetch the SAME live REST endpoint here,
        # at actual producer-job execution time, so both sides bind to a
        # freshly-read body instead of two different snapshots.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' > pr_body.md
      - name: Write trusted base-branch CODEOWNERS
        env:
          BASE_SHA: ${{ steps.shas.outputs.base_sha }}
        run: |
          git show "${BASE_SHA}:.github/CODEOWNERS" > base_codeowners.txt 2>/dev/null || : > base_codeowners.txt
      - name: Download component-vrt-evidence-manifest artifact (same run)
        id: download-evidence-manifest
        if: ${{ needs.component-vrt-report.outputs.vrt_evidence_artifact_id != '' }}
        uses: actions/download-artifact@v6
        with:
          # Issue #2230: same-run, same-attempt exact-name match (this job
          # and `component-vrt-report` always share the same
          # `github.run_attempt` since both run within the same workflow
          # attempt).
          name: component-vrt-evidence-manifest-${{ github.run_attempt }}
          path: evidence-manifest-download
      # PR #2045 OWNER fix_delta P0-5 second-round REQUEST_CHANGES: the
      # downloaded manifest is UNTRUSTED input at this point (produced by a
      # job that ran PR-head code) -- schema/digest/surface+contract binding
      # is independently re-verified by resolve_visual_impact.py itself
      # (build_evidence_from_manifest_v2 / verify_evidence_manifest_v2_record_digest)
      # in the "Run visual-impact-policy check" step below, never trusted
      # verbatim.
      - name: Resolve component-vrt-report CheckRun id for current head
        id: component-vrt-check-run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.shas.outputs.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" > check_runs.json || echo '{"check_runs":[]}' > check_runs.json
          # jq (not a bare `python3 -c` command substitution) is used here so
          # this step stays outside the governed Python invocation policy
          # (#1193) scope entirely -- `python3 -c "..."` inside `$(...)` was
          # rejected as unsupported_shell_grammar by
          # scripts/ci/check_python_invocation_policy.py --strict.
          #
          # PR #2045 OWNER fix_delta P0-5 second-round REQUEST_CHANGES:
          # filter on check_name AND status=="completed" AND
          # app.slug=="github-actions" (never name alone), then pick the
          # MOST RECENTLY COMPLETED match (never an arbitrary "first row of
          # the same name" -- a rerun can leave multiple check runs with the
          # identical name for the same head SHA).
          MATCHED="$(jq -c '(.check_runs // [])
            | map(select(.name == "component-vrt-report" and .status == "completed" and .app.slug == "github-actions"))
            | sort_by(.completed_at)
            | reverse
            | (.[0] // {})' check_runs.json)"
          CHECK_RUN_ID="$(echo "${MATCHED}" | jq -r '(.id // "") | tostring')"
          CHECK_SUITE_ID="$(echo "${MATCHED}" | jq -r '(.check_suite.id // "") | tostring')"
          APP_ID="$(echo "${MATCHED}" | jq -r '(.app.id // "") | tostring')"
          APP_SLUG="$(echo "${MATCHED}" | jq -r '(.app.slug // "")')"
          CHECK_CONCLUSION="$(echo "${MATCHED}" | jq -r '(.conclusion // "")')"
          {
            echo "check_run_id=${CHECK_RUN_ID}"
            echo "check_suite_id=${CHECK_SUITE_ID}"
            echo "app_id=${APP_ID}"
            echo "app_slug=${APP_SLUG}"
            echo "check_conclusion=${CHECK_CONCLUSION}"
          } >> "$GITHUB_OUTPUT"
      - name: Run visual-impact-policy check
        id: policy-check
        # PR #2045 OWNER fix_delta P1-5: VISUAL_IMPACT_DECISION_V1 requires
        # `pull_request_number >= 1` (see docs/dev/visual-impact.schema.json)
        # -- a push/workflow_dispatch run has no PR to gate, so it is
        # skipped rather than emitting a schema-invalid decision.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_SHA: ${{ steps.shas.outputs.head_sha }}
          BASE_SHA: ${{ steps.shas.outputs.base_sha }}
          BASE_REGISTRY_BLOB_SHA: ${{ steps.shas.outputs.base_registry_blob_sha }}
          HEAD_REGISTRY_BLOB_SHA: ${{ steps.shas.outputs.head_registry_blob_sha }}
          PR_ACTOR: ${{ github.event.pull_request.user.login || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          # Issue #2019 AC18: the evidence manifest artifact id/digest come
          # from component-vrt-report's job output (not the artifact
          # filename) -- see that job's `outputs:` block above.
          VRT_ARTIFACT_ID: ${{ needs.component-vrt-report.outputs.vrt_evidence_artifact_id || '' }}
          VRT_ARTIFACT_DIGEST: ${{ needs.component-vrt-report.outputs.vrt_evidence_artifact_digest || '' }}
          COMPONENT_VRT_CHECK_RUN_ID: ${{ steps.component-vrt-check-run.outputs.check_run_id || '' }}
          COMPONENT_VRT_CHECK_SUITE_ID: ${{ steps.component-vrt-check-run.outputs.check_suite_id || '' }}
          COMPONENT_VRT_APP_ID: ${{ steps.component-vrt-check-run.outputs.app_id || '' }}
          COMPONENT_VRT_APP_SLUG: ${{ steps.component-vrt-check-run.outputs.app_slug || '' }}
          COMPONENT_VRT_CHECK_CONCLUSION: ${{ steps.component-vrt-check-run.outputs.check_conclusion || '' }}
          # Issue #2230 AC2: the producer's own run identity, bound into the
          # decision artifact's CONTENT via `--run-id`/`--run-attempt` below.
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # PR #2045 OWNER fix_delta P0-1: `set +o pipefail` here made the
          # `| tee` pipeline's exit status always be `tee`'s (0), so a
          # non-zero evaluator exit was silently discarded and the step
          # (and therefore the required `visual-impact-policy` check)
          # PASSED regardless of the actual policy result. `set -o
          # pipefail` makes the pipeline exit non-zero whenever the
          # evaluator itself does.
          set -o pipefail
          # Issue #2019 P0-6: run the BASE-BRANCH-LOCKED copy of the
          # evaluator (materialized above), never the PR head's own
          # `scripts/agent-ops/resolve_visual_impact.py` -- see the
          # "Materialize base-branch-locked visual-impact evaluator" step
          # comment above for the full trust-boundary rationale. `--schema`
          # / `--visual-impact-schema` / `--mjs` are likewise base-pinned;
          # `--registry` stays pointed at the real (head-checked-out)
          # working-tree path because the evaluator itself resolves registry
          # CONTENT via `--head-ref`/`--base-ref` (`git show <ref>:<path>`),
          # never the raw working-tree file, for both base and head.
          #
          # NOTE (Issue #2230 fix_delta P1-1/P1-5, 2026-08-21, PR #2279
          # review comment #2279#issuecomment-5369771738): because this
          # step ALWAYS runs the BASE-BRANCH-LOCKED evaluator above, a PR
          # that changes `build_decision()`'s signature/behavior (like
          # Issue #2230's `workflow_run_id`/`run_attempt` threading) can
          # never exercise its OWN new logic on its OWN CI run -- on THIS
          # PR's own pre-merge run, `--run-id`/`--run-attempt` below parse
          # fine (base already has those CLI flags from an unrelated
          # subcommand) but are silently NOT forwarded into `decision.json`
          # yet, since base's `build_decision()` predates this change. Do
          # not mistake that for a regression. This is an INHERENT
          # bootstrap/self-validation gap shared by every past change to
          # this base-locked evaluator (#2019, #2091, #2099, #2100, #2229)
          # -- splitting a change across multiple PRs does not remove the
          # gap, it only relocates which PR carries it, since producer
          # (this job) and consumer (`visual-impact-trusted-consumer.yml`)
          # both flip to the new workflow-file version simultaneously at
          # merge (no version-skew window). The first real proof that new
          # evaluator logic works end to end can only come from a
          # POST-MERGE run on `main` (see PR #2279's AC9 section, corrected
          # to SKIP/OPEN for exactly this reason).
          uv run --locked python3 trusted_evaluator/scripts/agent-ops/resolve_visual_impact.py \
            --mode policy-check \
            --registry docs/dev/visual-surfaces.yml \
            --schema trusted_evaluator/docs/dev/visual-surfaces.schema.json \
            --visual-impact-schema trusted_evaluator/docs/dev/visual-impact.schema.json \
            --mjs trusted_evaluator/scripts/agent-ops/resolve_visual_impact.mjs \
            --repo-root . \
            --changed-paths-typed-file changed_paths_typed.json \
            --changed-paths-file changed_paths.txt \
            --pr-body-file pr_body.md \
            --evidence-manifest-file evidence-manifest-download/visual_baseline_review_evidence.json \
            --codeowners-file base_codeowners.txt \
            --actor "${PR_ACTOR}" \
            --repository "${GITHUB_REPOSITORY}" \
            --pr-number "${PR_NUMBER}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --base-ref "${BASE_SHA}" \
            --head-ref "${HEAD_SHA}" \
            --base-registry-blob-sha "${BASE_REGISTRY_BLOB_SHA}" \
            --head-registry-blob-sha "${HEAD_REGISTRY_BLOB_SHA}" \
            --component-vrt-check-run-id "${COMPONENT_VRT_CHECK_RUN_ID}" \
            --component-vrt-check-suite-id "${COMPONENT_VRT_CHECK_SUITE_ID}" \
            --component-vrt-app-id "${COMPONENT_VRT_APP_ID}" \
            --component-vrt-app-slug "${COMPONENT_VRT_APP_SLUG}" \
            --component-vrt-check-conclusion "${COMPONENT_VRT_CHECK_CONCLUSION}" \
            --github-actions-app-identity "github-actions[bot]" \
            --artifact-id "${VRT_ARTIFACT_ID}" \
            --artifact-digest "${VRT_ARTIFACT_DIGEST}" \
            --run-id "${GH_RUN_ID}" \
            --run-attempt "${GH_RUN_ATTEMPT}" \
            --decision-output visual_impact_decision_v1.json \
            | tee policy_check_output.json
      - name: Upload VISUAL_IMPACT_DECISION_V1 artifact
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          # Issue #2230 AC1/Outcome: attempt-specific artifact name -- see
          # the identical rationale on the evidence-manifest upload step
          # above.
          name: visual-impact-decision-v1-${{ github.run_attempt }}
          path: visual_impact_decision_v1.json
          # PR #2045 OWNER fix_delta P0-1: `warn` let a policy-check failure
          # (which now, with `--decision-output` withheld on schema-invalid
          # decisions -- see resolve_visual_impact.py
          # _validate_decision_schema -- may leave no file on disk at all)
          # silently succeed this step instead of failing the job.
          if-no-files-found: error
          retention-days: 30

  python-test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # fetch-depth: 0 so the ci_test_selection generator can run an explicit
          # base..head git diff for change detection. A shallow checkout (default
          # depth 1) lacks the base ref and the diff fails — which is now fail-closed
          # (Issue #1064 review), so full history is required here.
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
      - name: uv python install (timed)
        id: timed-uv-python-install
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed uv_python_install uv python install
      - name: uv lock --check (drift guard)
        run: uv lock --check

      - name: "Runtime dependency smoke (isolated, #1192)"
        run: uv run --isolated --locked --no-default-groups python scripts/ci/runtime_dependency_smoke.py

      - name: uv sync (timed)
        id: timed-uv-sync
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed uv_sync uv sync --locked --group dev
      - name: Verify Ruff configuration authority
        run: uv run --locked python3 scripts/ci/verify_ruff_configuration.py --root .
      - name: Ruff check (timed)
        id: timed-ruff-check
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed ruff_check uv run --locked ruff check .claude/scripts scripts schemas .claude/skills
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Verify Python version
        run: |
          uv run --locked python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 12), sys.version
          print(sys.version)
          PY
      - run: uv run --locked python .claude/scripts/check_secret_policy.py docs/dev/secret-policy.md
      - run: uv run --locked python .claude/scripts/check_session_recording_policy.py docs/dev/session-recording-policy.md
      - name: Check InputCommand docs schema
        run: uv run --locked python scripts/check_input_command_schema.py
      - name: Check visual artifact pipeline wiring
        run: uv run --locked python scripts/check-visual-artifact-pipeline.py
      - name: Check required-CI VRT snapshot policy
        run: uv run --locked python scripts/check-vrt-snapshot-policy.py
      - name: Verify python-test plan paths + lane union
        # Fail-closed plan checks (Issue #1064 review): every plan path exists, and the
        # collected node IDs satisfy  parallel ∪ serial == scope  and  parallel ∩ serial == ∅.
        run: |
          python3 scripts/ci/python_test_plan.py --emit scope-argv --check-paths --format json > /dev/null
          uv run --locked python scripts/ci/verify_lane_union.py
      - name: Check governed Python invocation policy (#1193)
        # Fail-closed static scan: governed surfaces (.github/workflows/** /
        # .github/actions/** / docs/dev/** / .claude/skills/**/SKILL.md /
        # package.json) must use `uv run --locked` for dependency-bearing pytest
        # and Python script invocations; direct interpreters are allowed only via
        # the stdlib_only/bootstrap exceptions registry.
        run: uv run --locked python scripts/ci/check_python_invocation_policy.py --strict
      - name: Check .claude/settings.json permissions (#1551)
        # Fail-closed static scan: permissions.allow/ask/deny in .claude/settings.json
        # must not contain scoped Write(path) rules (repository policy:
        # claude_permission_edit_rule_canonicalization_v1). Scoped path mutation is
        # expressed via Edit(path) instead.
        run: uv run --locked python scripts/ci/check_claude_settings_permissions.py --settings .claude/settings.json
      - name: Verify python-test lane topology invariants (#1760)
        # Fail-closed YAML-AST scan: python-test-core stays Python-only (no
        # Node/npm/npx/pnpm/corepack/codex commands -- Issue #2161: the former
        # native-Codex-CLI-lane job that owned the Node/Codex CLI bootstrap + matrix
        # + tests/codex/test_local_main_branch_guard.py was retired), the
        # python-test required aggregate is needs:[python-test-core]
        # + if:always(), and this verifier itself stays wired (not disabled).
        run: uv run --locked python scripts/ci/verify_python_test_lane.py --ci-yml .github/workflows/ci.yml
      - name: pytest python suite (parallel) (timed)
        # Plan-driven xdist parallel step (Issue #1064). Target set / --ignore / --deselect /
        # FIXED worker count / scheduler all come from the python-test-plan SSOT via the
        # scripts/ci/python_test_plan.py loader. The parallel_exclude tests run in the serial
        # lane below; tests/codex/ runs in the dedicated codex step. JUnit + durations are
        # written to *-parallel.* and combined with the serial lane by the manifest step.
        env:
          XDIST_NUMPROCESSES_OUT: python_test_artifacts/resolved_workers.json
        run: |
          _t0=$(date +%s%3N)
          mkdir -p python_test_artifacts
          # B4 (review): run the loader as an INDEPENDENT command (a process substitution
          # would discard the producer's exit status, masking loader failures). Fail-closed:
          # a loader error or an empty argv aborts before pytest runs.
          _argv_file="${RUNNER_TEMP:-/tmp}/pytest-parallel-argv"
          if ! python3 scripts/ci/python_test_plan.py --emit run-argv --mode parallel --format nul > "$_argv_file"; then
            echo "::error::python-test plan loader failed (parallel argv)"
            exit 1
          fi
          mapfile -d '' -t _pytest_argv < "$_argv_file"
          if [ "${#_pytest_argv[@]}" -eq 0 ]; then
            echo "::error::python-test plan produced an empty parallel argv (loader failure)"
            exit 1
          fi
          _workers=$(python3 scripts/ci/python_test_plan.py --emit workers --format lines)
          _scheduler=$(python3 scripts/ci/python_test_plan.py --emit scheduler --format lines)
          export PYTHONPATH="$PWD/scripts/ci${PYTHONPATH:+:$PYTHONPATH}"
          set +e
          uv run --locked pytest "${_pytest_argv[@]}" \
            -p collect_nodeids_plugin \
            --junitxml=python_test_artifacts/junit-parallel.xml \
            --durations=25 --durations-min=0.01 \
            > python_test_artifacts/pytest_durations_parallel.log 2>&1
          _s=$?
          set -e
          cat python_test_artifacts/pytest_durations_parallel.log
          _xdist_version=$(uv run --locked python -c "import xdist; print(xdist.__version__)" 2>/dev/null || echo unknown)
          _nproc=$(nproc 2>/dev/null || echo unknown)
          # resolved_workers: the authoritative xdist worker count captured by the
          # collect_nodeids_plugin probe (controller-side numprocesses). With a FIXED -n N
          # plan this equals N; runner_nproc is kept for context only, NOT as the proof.
          _resolved=$(uv run --locked python -c "import json,sys; print(json.load(open('python_test_artifacts/resolved_workers.json')).get('resolved_workers'))" 2>/dev/null || echo "$_workers")
          printf '{"resolved_workers":"%s","configured_workers":"%s","scheduler":"%s","xdist_version":"%s","runner_nproc":"%s","junitxml_parallel":"python_test_artifacts/junit-parallel.xml","junitxml_serial":"python_test_artifacts/junit-serial.xml","durations_parallel":"python_test_artifacts/pytest_durations_parallel.log","durations_serial":"python_test_artifacts/pytest_durations_serial.log"}\n' \
            "$_resolved" "$_workers" "$_scheduler" "$_xdist_version" "$_nproc" > python_test_artifacts/xdist_meta.json
          cat python_test_artifacts/xdist_meta.json
          printf '{"step_id":"pytest_parallel","phase_id":"pytest_parallel","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: pytest serial lane (parallel-unsafe) (timed)
        # Dedicated -n 0 lane for plan.parallel_exclude tests (timing-sensitive, e.g. the
        # 80ms debounce front-gate). Its JUnit/durations cover the tests excluded from the
        # parallel lane so the two artifacts together represent the whole suite (AC9).
        run: |
          _t0=$(date +%s%3N)
          mkdir -p python_test_artifacts
          _argv_file="${RUNNER_TEMP:-/tmp}/pytest-serial-argv"
          if ! python3 scripts/ci/python_test_plan.py --emit serial-lane-argv --format nul > "$_argv_file"; then
            echo "::error::python-test plan loader failed (serial argv)"
            exit 1
          fi
          mapfile -d '' -t _serial_argv < "$_argv_file"
          if [ "${#_serial_argv[@]}" -eq 0 ]; then
            echo "no parallel_exclude tests; serial lane is empty"
            printf '{"step_id":"pytest_serial","phase_id":"pytest_serial","status":0,"elapsed_ms":%d}\n' \
              $(($(date +%s%3N)-_t0)) >> measurements.jsonl
            exit 0
          fi
          set +e
          uv run --locked pytest "${_serial_argv[@]}" \
            --junitxml=python_test_artifacts/junit-serial.xml \
            --durations=25 --durations-min=0.01 \
            > python_test_artifacts/pytest_durations_serial.log 2>&1
          _s=$?
          set -e
          cat python_test_artifacts/pytest_durations_serial.log
          printf '{"step_id":"pytest_serial","phase_id":"pytest_serial","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: Verify python-test JUnit manifest (parallel + serial == scope)
        run: |
          uv run --locked python scripts/ci/verify_python_test_manifest.py \
            --parallel-junit python_test_artifacts/junit-parallel.xml \
            --serial-junit python_test_artifacts/junit-serial.xml \
            --manifest-out python_test_artifacts/python_test_manifest.json
      - name: Upload python-test artifacts (junit + durations + xdist meta + manifest)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: python-test-junit-${{ github.run_attempt }}
          path: python_test_artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Verify hook test discovery exclusions
        run: |
          python3 - <<PY
          import subprocess
          from pathlib import Path

          # Tracked separately by Issue #412; remove this ignore once the test is CI-green.
          allowed_unregistered = {
              ".claude/hooks/tests/test_secret_boundary_contract.py",
          }
          expected = {
              hook_test.as_posix()
              for pattern in ("test_*.py", "*_test.py")
              for hook_test in Path(".claude/hooks/tests").rglob(pattern)
              if hook_test.as_posix() not in allowed_unregistered
          }

          result = subprocess.run(
              [
                  "uv",
                  "run",
                  "--locked",
                  "pytest",
                  "--collect-only",
                  "-q",
                  ".claude/hooks/tests/",
                  "--ignore=.claude/hooks/tests/test_secret_boundary_contract.py",
                  "--deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable",
                  "--deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths",
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          collected = set()
          for line in result.stdout.splitlines():
              line = line.strip()
              if not line:
                  continue
              collected.add(line.split("::", 1)[0])

          missing = sorted(expected - collected)
          if missing:
              raise SystemExit("Hook tests missing from pytest discovery:\n" + "\n".join(missing))
          PY
      - name: Kill Switch smoke test
        run: uv run --locked python3 .claude/scripts/kill_switch_runtime_smoke.py --fixtures tests/fixtures/session-recording
      - name: Secret exposure scan (production scripts)
        run: python3 .claude/scripts/secret_exposure_scanner.py --local .claude/scripts --exclude secret_exposure_scanner.py --exclude check_session_recording_runtime_safety.py --fail-on-finding
      - name: Secret exposure scan (clean fixtures)
        run: python3 .claude/scripts/secret_exposure_scanner.py --local tests/fixtures/session-recording/valid --fail-on-finding
      - name: Generate ci_test_selection/v1 artifact
        # Skipped in python_test_bench dispatch runs: change detection needs a PR base
        # SHA which a workflow_dispatch event lacks, and the bench run only measures
        # pytest runtime (Issue #1064 AC11). Normal push/PR runs always run this.
        if: ${{ github.event.inputs.python_test_bench != 'true' }}
        run: |
          mkdir -p ci_test_selection_artifacts
          uv run --locked pytest --collect-only -q \
            .claude/hooks/tests/ \
            --ignore=.claude/hooks/tests/test_secret_boundary_contract.py \
            --deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable \
            --deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths \
            > ci_test_selection_artifacts/hook_tests_collect_only.txt
          python3 - <<'PY'
          import argparse
          import importlib.util
          import pathlib
          import sys

          script_path = pathlib.Path(
              ".claude/skills/pr-review-judge/scripts/generate_ci_test_selection_artifact.py"
          )
          spec = importlib.util.spec_from_file_location(
              "generate_ci_test_selection_artifact", script_path
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          # pytest_args=None -> the generator derives the scope argv from the
          # python-test-plan SSOT (.github/ci/python-test-plan.json) via the loader,
          # so the artifact pytest_argv cannot drift from the executed target set
          # and includes schemas/tests/ exactly once (Issue #1064 AC2/AC7).
          # base_sha/head_sha drive change detection via an EXPLICIT git diff (never the
          # branch name "main", absent in a shallow checkout). For push events with no PR
          # base, fall back to the previous commit so the diff still resolves; with
          # fetch-depth: 0 both SHAs are present (Issue #1064 review false-green fix).
          args = argparse.Namespace(
              output="ci_test_selection_artifacts/ci_test_selection_v1.json",
              pytest_args=None,
              plan=".github/ci/python-test-plan.json",
              pr_head_sha="${{ github.event.pull_request.head.sha || github.sha }}",
              base_sha="${{ github.event.pull_request.base.sha || github.event.before }}",
              head_sha="${{ github.event.pull_request.head.sha || github.sha }}",
              checked_out_sha=None,
              merge_sha="${{ github.sha }}",
              workflow="ci",
              job="python-test-core",
              ci_run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          )
          sys.exit(module.generate_artifact(args))
          PY
      - name: Verify ci_test_selection evidence files
        if: ${{ github.event.inputs.python_test_bench != 'true' }}
        run: |
          test -s ci_test_selection_artifacts/hook_tests_collect_only.txt
          test -s ci_test_selection_artifacts/ci_test_selection_v1.json
      - uses: actions/upload-artifact@v7
        if: ${{ github.event.inputs.python_test_bench != 'true' }}
        with:
          name: ci_test_selection
          path: ci_test_selection_artifacts/
          if-no-files-found: error
      - name: Collect ci_runtime_baseline_v1 artifact
        if: ${{ !cancelled() }}
        env:
          GH_JOB: ${{ github.job }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci_runtime_baseline_artifacts
          python3 - <<'PY'
          import json, os, pathlib
          measurements = []
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      r = json.loads(line)
                      r.update({
                          "run_id": os.environ["GH_RUN_ID"],
                          "run_attempt": os.environ["GH_RUN_ATTEMPT"],
                          "head_sha": os.environ["GH_HEAD_SHA"],
                          "merge_sha": os.environ["GH_SHA"],
                          "job": os.environ["GH_JOB"],
                          "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
                          "measurement_method": "date_plus3N_ms"
                      })
                      measurements.append(r)
          artifact = {
              "schema": "ci_runtime_baseline_v1",
              "run_id": os.environ["GH_RUN_ID"],
              "run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "head_sha": os.environ["GH_HEAD_SHA"],
              "merge_sha": os.environ["GH_SHA"],
              "job": os.environ["GH_JOB"],
              "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
              "measurement_method": "date_plus3N_ms",
              "measurements": measurements,
          }
          out = pathlib.Path("ci_runtime_baseline_artifacts/ci_runtime_baseline_v1.json")
          out.write_text(json.dumps(artifact, indent=2))
          print(f"Written: {out}")
          PY
      - name: Upload ci-runtime-baseline artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-baseline-${{ github.job }}-${{ github.run_attempt }}
          path: ci_runtime_baseline_artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Output CI runtime summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## CI Runtime Baseline: ${{ github.job }}"
            echo ""
            echo "| step_id | elapsed_ms | status |"
            echo "|---|---|---|"
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      m = json.loads(line)
                      print(f"| {m['step_id']} | {m['elapsed_ms']} | {m['status']} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate CI_TEST_PERFORMANCE_ASSESSMENT_V2 artifact
        if: ${{ !cancelled() }}
        env:
          GH_ISSUE_NUMBER: "2159"
          GH_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ci_test_performance_assessment_artifacts
          python3 - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone

          pr_number_raw = os.environ.get("GH_PR_NUMBER", "")
          assessment = {
              "schema": "CI_TEST_PERFORMANCE_ASSESSMENT_V2",
              "schema_version": 2,
              "issue_number": int(os.environ["GH_ISSUE_NUMBER"]),
              "pr_number": int(pr_number_raw) if pr_number_raw else None,
              "measured_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              # Issue #2159 AC10: this producer runs on EVERY CI run of the
              # python-test-core job and asserts no performance CLAIM for
              # this specific job's own instrumentation (claim.kind: none).
              # A dedicated performance CLAIM (improvement/non_regression/
              # absolute_budget) is authored separately, out-of-band, by
              # scripts/ci/collect_e2e_performance_benchmark.py's fixed
              # before/after SHA benchmark route (Issue #2159 AC1/AC2/AC7),
              # not by this per-run producer -- this step's job is to prove
              # a REAL CI_TEST_PERFORMANCE_ASSESSMENT_V2 artifact is
              # actually generated from a real run (not just documented as
              # a string in this workflow file).
              "claim": {"kind": "none"},
              "performance_evidence": {"status": "not_required"},
              "observation": {"outcome": "not_observed"},
              "claim_evaluation": {"outcome": "not_applicable"},
              "functional_evidence": {
                  "proof_level": "check_run_only",
                  "coverage_bound": False,
              },
              "declared_impact": (
                  "Routine CI_TEST_PERFORMANCE_ASSESSMENT_V2 producer run "
                  f"(head_sha={os.environ['GH_HEAD_SHA']}); no performance "
                  "claim is made by this per-run instrumentation step."
              ),
              "risk_acknowledgement": {
                  "reference": {
                      "source_kind": "commit_message",
                      "source_id": os.environ["GH_HEAD_SHA"],
                  },
                  "verification_status": "unverified",
              },
          }
          out = pathlib.Path(
              "ci_test_performance_assessment_artifacts/ci_test_performance_assessment_v2.json"
          )
          out.write_text(json.dumps(assessment, indent=2))
          print(f"Written: {out}")
          PY
      - name: Validate CI_TEST_PERFORMANCE_ASSESSMENT_V2 artifact
        if: ${{ !cancelled() }}
        run: |
          uv run --locked python3 \
            .claude/skills/ci-test-performance/scripts/validate_ci_performance_assessment_v2.py \
            --assessment ci_test_performance_assessment_artifacts/ci_test_performance_assessment_v2.json \
            --output ci_test_performance_assessment_artifacts/ci_test_performance_assessment_v2_validation_result.json
      - name: Upload CI_TEST_PERFORMANCE_ASSESSMENT_V2 artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-performance-assessment-v2-${{ github.run_attempt }}
          path: ci_test_performance_assessment_artifacts/
          if-no-files-found: error
          retention-days: 30

      # #2159 OWNER scope-authority ruling (issuecomment-5299412215, items
      # 2/P0-8 and 3/P1-3/AC11): the REAL, callable production wiring of (a)
      # the AC11 evidence-readiness hard-check
      # (`_evidence_readiness_hard_check_post_filter`,
      # tests/ci/test_ci_performance_gate.py) into an actual workflow job's
      # close/gate step, and (b) the P0-8 real (non-no-op)
      # CI_TEST_PERFORMANCE_ASSESSMENT_V2 producer
      # (`build_assessment_from_percentile_cohorts`). Distinct from the
      # unconditional producer above, which intentionally remains a fixed
      # `claim.kind: none` schema smoke-test payload run on EVERY regular CI
      # run (per the review's own suggestion to keep that producer distinct
      # from #2159 AC10's real performance producer). These steps are
      # opt-in (`run_performance_assessment_gate: true` on
      # `workflow_dispatch` only) so the 20-run comparable-cohort wait --
      # Out of Scope as a #2159/#2172 merge/close condition -- never blocks
      # a normal PR's required `ci` check; deliberately kept INSIDE this
      # existing job (rather than a new job) so no new check-run name is
      # introduced (a new job name would require a
      # .claude/skills/pr-review-judge/scripts/ci_verdict_summary_v2.py
      # CLASSIFICATION_MAP entry, which is outside #2159's Allowed Paths).
      - name: Resolve cohort fixture (operator-supplied or built-in insufficient-evidence smoke fixture)
        if: ${{ github.event.inputs.run_performance_assessment_gate == 'true' }}
        env:
          COHORT_FIXTURE_PATH_INPUT: ${{ github.event.inputs.cohort_fixture_path }}
        run: |
          set -euo pipefail
          mkdir -p e2e_performance_assessment_gate_artifacts
          if [ -n "$COHORT_FIXTURE_PATH_INPUT" ]; then
            if [ ! -f "$COHORT_FIXTURE_PATH_INPUT" ]; then
              echo "::error::cohort_fixture_path=$COHORT_FIXTURE_PATH_INPUT does not exist in the checked-out worktree."
              exit 1
            fi
            cp "$COHORT_FIXTURE_PATH_INPUT" e2e_performance_assessment_gate_artifacts/cohort_fixture.json
            echo "cohort_fixture_source=operator_supplied path=$COHORT_FIXTURE_PATH_INPUT"
          else
            # #2159 OWNER ruling: "20件未満なら fail-closed する production
            # path を先に配線できます" -- this built-in fixture is
            # DELIBERATELY below MIN_COHORT_RUN_COUNT (20) per arm, proving
            # the gate fail-closes correctly with zero real historical CI
            # runs, exactly the state of this dev environment today.
            python3 - <<'PY'
          import json

          def arm(commit_sha: str, count: int, start_id: int) -> dict:
              core = [
                  {
                      "workflow_run_id": start_id + i,
                      "job": "e2e-core",
                      "measurements": [{"phase_id": "test_e2e_core", "elapsed_ms": 60000 + i}],
                  }
                  for i in range(count)
              ]
              responsive = [
                  {
                      "workflow_run_id": start_id + i,
                      "job": "e2e-responsive-matrix",
                      "measurements": [{"phase_id": "test_e2e_core", "elapsed_ms": 60000 + i}],
                  }
                  for i in range(count)
              ]
              gate_ready = [
                  {
                      "workflow_run_id": start_id + i,
                      "run_started_at": "2026-08-15T00:00:00Z",
                      "check_completed_at": "2026-08-15T00:05:00Z",
                  }
                  for i in range(count)
              ]
              return {
                  "commit_sha": commit_sha,
                  "core_baselines": core,
                  "responsive_baselines": responsive,
                  "gate_ready_baselines": gate_ready,
              }

          fixture = {
              "issue_number": 2159,
              "pr_number": 2172,
              "measured_at": "2026-08-15T00:00:00Z",
              "functional_evidence": {"proof_level": "check_run_only", "coverage_bound": False},
              "declared_impact": (
                  "e2e-performance-benchmark-assessment-gate smoke fixture "
                  "(no cohort_fixture_path supplied) -- deliberately below "
                  "MIN_COHORT_RUN_COUNT to prove the AC11 fail-closed gate "
                  "is wired into a real workflow job."
              ),
              "risk_acknowledgement": {
                  "reference": {"source_kind": "issue_comment", "source_id": "issuecomment-5299412215"},
                  "verification_status": "unverified",
              },
              "cohort_provenance": {
                  "runner_image": "ubuntu-24.04",
                  "workers": 1,
                  "scheduler": "loadscope",
                  "command_manifest_digest": "sha256:" + "0" * 64,
                  "test_selection_digest": "sha256:" + "0" * 64,
              },
              # 3 << MIN_COHORT_RUN_COUNT (20) -- intentional, see comment above.
              "before": arm("0" * 40, 3, 9000),
              "after": arm("1" * 40, 3, 19000),
          }
          with open("e2e_performance_assessment_gate_artifacts/cohort_fixture.json", "w", encoding="utf-8") as handle:
              json.dump(fixture, handle, indent=2)
          print("cohort_fixture_source=built_in_insufficient_evidence_smoke_fixture")
          PY
          fi
      - name: Run AC11 evidence gate + P0-8 assessment producer (#2159 OWNER ruling issuecomment-5299412215 items 2/3)
        if: ${{ github.event.inputs.run_performance_assessment_gate == 'true' }}
        run: |
          uv run --locked python3 tests/ci/test_ci_performance_gate.py \
            --cohort-fixture e2e_performance_assessment_gate_artifacts/cohort_fixture.json \
            --output e2e_performance_assessment_gate_artifacts/gate_result.json
      - name: Upload e2e-performance-benchmark-assessment-gate artifact
        if: ${{ !cancelled() && github.event.inputs.run_performance_assessment_gate == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-performance-benchmark-assessment-gate-${{ github.run_attempt }}
          path: e2e_performance_assessment_gate_artifacts/
          if-no-files-found: error
          retention-days: 30

  python-test:
    # Issue #1760 AC5: required aggregate status check (name unchanged --
    # docs/ops/branch-protection.md keeps referencing "python-test"). Fails
    # or is skipped whenever the dependency job fails/skips. Issue #2161
    # (native Codex CLI retirement): this job previously also depended on
    # the native-Codex-CLI-lane job, which was removed (Issue #2161).
    runs-on: ubuntu-latest
    needs: [python-test-core]
    if: always()
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
      - name: Evaluate python_test_bench_aggregate_policy (AC5/AC10)
        # Issue #1824 P1-1: the aggregate policy decision is delegated to a
        # dedicated, table-driven-tested script (scripts/ci/evaluate_python_test_aggregate.py)
        # instead of an inline heredoc, because a string-search verifier
        # ("does the run: text contain 'python_test_bench_aggregate_policy'?")
        # cannot detect a heredoc body being replaced with a no-op stub that
        # still contains that string. scripts/ci/verify_python_test_lane.py
        # additionally requires this EXACT invocation (no `if:`, no
        # continue-on-error, exactly one occurrence) -- see check_aggregate_job.
        run: |
          uv run --locked python3 scripts/ci/evaluate_python_test_aggregate.py \
            --core-result "${{ needs.python-test-core.result }}" \
            --bench-mode "${{ github.event.inputs.python_test_bench }}"

  node-backed-hook-tests:
    if: ${{ github.event.inputs.python_test_bench != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # fetch-depth: 0 so the ci_test_selection generator's explicit base..head git
          # diff resolves (Issue #1064 review: change detection is now fail-closed).
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-python-uv
      - name: uv python install (timed)
        id: timed-uv-python-install
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed uv_python_install uv python install
      - name: uv sync (timed)
        id: timed-uv-sync
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed uv_sync uv sync --locked --group dev
      - name: Install dependencies (timed)
        id: timed-pnpm-install
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed pnpm_install pnpm install --frozen-lockfile
      - name: pytest node-backed hook tests (timed)
        run: |
          _t0=$(date +%s%3N)
          set +e
          uv run --locked pytest -q \
            .claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable \
            .claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths
          _s=$?
          set -e
          printf '{"step_id":"pytest_node_backed_hook_tests","phase_id":"pytest_node_backed_hooks","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: node --test session_manifest_debounce (AC4/AC6, Node 22) (timed)
        # Issue #1141 AC6: virtual-clock unit tests for flushLoop DI core.
        # Node 22 is guaranteed by the setup-node-pnpm composite action (default
        # node-version: '22'). This step runs in the node-backed-hook-tests job
        # so it has both Node and Python/uv available.
        run: |
          _t0=$(date +%s%3N)
          set +e
          node --test .claude/hooks/tests/test_session_manifest_debounce.mjs
          _s=$?
          set -e
          printf '{"step_id":"node_test_debounce_ac4","phase_id":"node_test_debounce","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: pytest_session_recording_fixed_location_cutover (timed)
        # Issue #2004 P1-2 (PR #2008 OWNER REQUEST_CHANGES): these 8 nodeids
        # in tests/session-recording/test_fixed_location_cutover.py spawn a
        # real `node` child process (the readiness bootstrap producer,
        # directly or via its `--repo-root` / `--print-resolved-override`
        # test seams) and were previously running inside python-test-core
        # (a Node-free-by-contract job, Issue #1760), which violates that
        # job's Python-only invariant. The remaining
        # pure-Python nodeids in the same file stay in python-test-core (see
        # .github/ci/python-test-plan.json deselect +
        # secondary_coverage.dedicated_lanes).
        run: |
          _t0=$(date +%s%3N)
          set +e
          uv run --locked pytest -q \
            tests/session-recording/test_fixed_location_cutover.py::test_default_fixed_location_producer_paths \
            tests/session-recording/test_fixed_location_cutover.py::test_new_private_directory_and_artifact_mode \
            tests/session-recording/test_fixed_location_cutover.py::test_env_override_repo_root_normalized \
            tests/session-recording/test_fixed_location_cutover.py::test_source_bound_default_path_roundtrip \
            tests/session-recording/test_fixed_location_cutover.py::test_digest_update_regeneration_order \
            tests/session-recording/test_fixed_location_cutover.py::test_cross_language_override_resolution_parity \
            tests/session-recording/test_fixed_location_cutover.py::test_readiness_producer_parent_dir_toctou_hardening \
            tests/session-recording/test_fixed_location_cutover.py::test_hermetic_default_path_producer_consumer_roundtrip \
            -p no:xdist
          _s=$?
          set -e
          printf '{"step_id":"pytest_session_recording_fixed_location_cutover","phase_id":"pytest_session_recording_fixed_location_cutover","status":%d,"elapsed_ms":%d}\n' \
            $_s $(($(date +%s%3N)-_t0)) >> measurements.jsonl
          exit $_s
      - name: Generate node-backed hook selection artifact
        run: |
          mkdir -p ci_test_selection_artifacts
          uv run --locked pytest --collect-only -q \
            .claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable \
            .claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths \
            tests/session-recording/test_fixed_location_cutover.py::test_default_fixed_location_producer_paths \
            tests/session-recording/test_fixed_location_cutover.py::test_new_private_directory_and_artifact_mode \
            tests/session-recording/test_fixed_location_cutover.py::test_env_override_repo_root_normalized \
            tests/session-recording/test_fixed_location_cutover.py::test_source_bound_default_path_roundtrip \
            tests/session-recording/test_fixed_location_cutover.py::test_digest_update_regeneration_order \
            tests/session-recording/test_fixed_location_cutover.py::test_cross_language_override_resolution_parity \
            tests/session-recording/test_fixed_location_cutover.py::test_readiness_producer_parent_dir_toctou_hardening \
            tests/session-recording/test_fixed_location_cutover.py::test_hermetic_default_path_producer_consumer_roundtrip \
            > ci_test_selection_artifacts/node_backed_hook_tests_collect_only.txt
          uv run --locked pytest --collect-only -q \
            .claude/hooks/tests/ \
            --ignore=.claude/hooks/tests/test_secret_boundary_contract.py \
            --deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable \
            --deselect=.claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths \
            > ci_test_selection_artifacts/python_hook_tests_collect_only.txt
          python3 - <<'PY'
          import argparse
          import importlib.util
          import json
          import pathlib
          import sys

          script_path = pathlib.Path(
              ".claude/skills/pr-review-judge/scripts/generate_ci_test_selection_artifact.py"
          )
          spec = importlib.util.spec_from_file_location(
              "generate_ci_test_selection_artifact", script_path
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          args = argparse.Namespace(
              output="ci_test_selection_artifacts/ci_test_selection_v1.json",
              pytest_args=[
                  ".claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable",
                  ".claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths",
                  "tests/session-recording/test_fixed_location_cutover.py::test_default_fixed_location_producer_paths",
                  "tests/session-recording/test_fixed_location_cutover.py::test_new_private_directory_and_artifact_mode",
                  "tests/session-recording/test_fixed_location_cutover.py::test_env_override_repo_root_normalized",
                  "tests/session-recording/test_fixed_location_cutover.py::test_source_bound_default_path_roundtrip",
                  "tests/session-recording/test_fixed_location_cutover.py::test_digest_update_regeneration_order",
                  "tests/session-recording/test_fixed_location_cutover.py::test_cross_language_override_resolution_parity",
                  "tests/session-recording/test_fixed_location_cutover.py::test_readiness_producer_parent_dir_toctou_hardening",
                  "tests/session-recording/test_fixed_location_cutover.py::test_hermetic_default_path_producer_consumer_roundtrip",
              ],
              plan=".github/ci/python-test-plan.json",
              pr_head_sha="${{ github.event.pull_request.head.sha || github.sha }}",
              base_sha="${{ github.event.pull_request.base.sha || github.event.before }}",
              head_sha="${{ github.event.pull_request.head.sha || github.sha }}",
              checked_out_sha=None,
              merge_sha="${{ github.sha }}",
              workflow="ci",
              job="node-backed-hook-tests",
              ci_run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          )
          exit_code = module.generate_artifact(args)
          if exit_code != 0:
              sys.exit(exit_code)

          # Fixed 2-nodeid sublane (Node child-process hook wrapper tests, #1064).
          # This invariant is unchanged and independent of the collect-only
          # extension below (Issue #1420 fix_delta AC8).
          node_backed_nodeids = [
              ".claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stdout_is_silent_and_artifact_path_is_overridable",
              ".claude/hooks/tests/test_generate_session_manifest_from_hook.py::test_wrapper_stderr_redacts_posix_windows_and_wsl_paths",
          ]
          # #1420 fix_delta AC8: the session_recording sublane is now ALSO
          # collected in this same collect-only pass so the G1
          # uncovered_changed_test_files gate observes real execution evidence
          # instead of relying solely on the python-test-plan.json declared
          # secondary_coverage entry.
          # Issue #2004 P1-2 (PR #2008 review): the 8 node-backed nodeids in
          # tests/session-recording/test_fixed_location_cutover.py (a
          # hyphenated directory) join this "not a fixed hook wrapper nodeid"
          # classification because they spawn a real node child process.
          # Issue #2412: the sibling tests/session_recording/codex/ (Codex
          # passive-recorder adapter) node-backed lane was retired -- the
          # producer chain (.codex/hooks.json -> composite hook -> the
          # session-recording adapter script) was removed by PR #2409, and
          # the last remaining production inbound reference was removed here.
          session_recording_prefixes = (
              "tests/session-recording/test_fixed_location_cutover.py",
          )
          artifact_dir = pathlib.Path("ci_test_selection_artifacts")
          python_lines = [
              line.strip()
              for line in (artifact_dir / "python_hook_tests_collect_only.txt").read_text().splitlines()
              if line.strip() and "::" in line
          ]
          node_lines = [
              line.strip()
              for line in (artifact_dir / "node_backed_hook_tests_collect_only.txt").read_text().splitlines()
              if line.strip() and "::" in line
          ]
          session_recording_nodeids = sorted(
              line for line in node_lines if line.startswith(session_recording_prefixes)
          )
          fixed_hook_wrapper_nodeids = sorted(
              line for line in node_lines if not line.startswith(session_recording_prefixes)
          )

          python_absent = sorted(nodeid for nodeid in node_backed_nodeids if nodeid not in python_lines)
          node_exact_match = fixed_hook_wrapper_nodeids == sorted(node_backed_nodeids)
          overlap = sorted(set(python_lines) & set(node_lines))
          summary = {
              "schema": "ci_test_selection_summary_v1",
              "python_test": {
                  "collect_only_path": "ci_test_selection_artifacts/python_hook_tests_collect_only.txt",
                  "node_backed_nodeids_absent": len(python_absent) == len(node_backed_nodeids),
                  "absent_nodeids": python_absent,
                  "collected_count": len(python_lines),
              },
              "node_backed_hook_tests": {
                  "collect_only_path": "ci_test_selection_artifacts/node_backed_hook_tests_collect_only.txt",
                  "exact_nodeid_count": len(node_lines),
                  "exactly_expected_two": len(fixed_hook_wrapper_nodeids) == 2,
                  "matches_expected_nodeids": node_exact_match,
                  "collected_nodeids": node_lines,
                  "session_recording_nodeids_count": len(session_recording_nodeids),
                  "session_recording_nodeids_present": len(session_recording_nodeids) > 0,
              },
              "union_disjointness": {
                  "disjoint": not overlap,
                  "overlap_nodeids": overlap,
                  "union_count": len(set(python_lines) | set(node_lines)),
              },
          }
          out = artifact_dir / "ci_test_selection_summary_v1.json"
          out.write_text(json.dumps(summary, indent=2) + "\n")

          if not summary["python_test"]["node_backed_nodeids_absent"]:
              raise SystemExit("Node-backed nodeids still present in python-test collect-only output")
          if not summary["node_backed_hook_tests"]["exactly_expected_two"]:
              raise SystemExit("node-backed-hook-tests collect-only output did not contain exactly 2 fixed nodeids")
          if not summary["node_backed_hook_tests"]["matches_expected_nodeids"]:
              raise SystemExit("node-backed-hook-tests collect-only output did not match expected fixed nodeids")
          if not summary["node_backed_hook_tests"]["session_recording_nodeids_present"]:
              raise SystemExit("node-backed-hook-tests collect-only output did not include tests/session-recording/test_fixed_location_cutover.py nodeids")
          if not summary["union_disjointness"]["disjoint"]:
              raise SystemExit("python-test and node-backed-hook-tests collect-only outputs overlapped")
          PY
      - name: Verify node-backed ci_test_selection evidence files
        run: |
          test -s ci_test_selection_artifacts/node_backed_hook_tests_collect_only.txt
          test -s ci_test_selection_artifacts/python_hook_tests_collect_only.txt
          test -s ci_test_selection_artifacts/ci_test_selection_v1.json
          test -s ci_test_selection_artifacts/ci_test_selection_summary_v1.json
      - uses: actions/upload-artifact@v7
        with:
          name: ci_test_selection_node_backed_hook_tests
          path: ci_test_selection_artifacts/
          if-no-files-found: error
      - name: Collect ci_runtime_baseline_v1 artifact
        if: ${{ !cancelled() }}
        env:
          GH_JOB: ${{ github.job }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci_runtime_baseline_artifacts
          python3 - <<'PY'
          import json, os, pathlib
          measurements = []
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      r = json.loads(line)
                      r.update({
                          "run_id": os.environ["GH_RUN_ID"],
                          "run_attempt": os.environ["GH_RUN_ATTEMPT"],
                          "head_sha": os.environ["GH_HEAD_SHA"],
                          "merge_sha": os.environ["GH_SHA"],
                          "job": os.environ["GH_JOB"],
                          "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
                          "measurement_method": "date_plus3N_ms"
                      })
                      measurements.append(r)
          artifact = {
              "schema": "ci_runtime_baseline_v1",
              "run_id": os.environ["GH_RUN_ID"],
              "run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "head_sha": os.environ["GH_HEAD_SHA"],
              "merge_sha": os.environ["GH_SHA"],
              "job": os.environ["GH_JOB"],
              "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
              "measurement_method": "date_plus3N_ms",
              "measurements": measurements,
          }
          out = pathlib.Path("ci_runtime_baseline_artifacts/ci_runtime_baseline_v1.json")
          out.write_text(json.dumps(artifact, indent=2))
          print(f"Written: {out}")
          PY
      - name: Upload ci-runtime-baseline artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-baseline-${{ github.job }}-${{ github.run_attempt }}
          path: ci_runtime_baseline_artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Output CI runtime summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## CI Runtime Baseline: ${{ github.job }}"
            echo ""
            echo "| step_id | elapsed_ms | status |"
            echo "|---|---|---|"
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      m = json.loads(line)
                      print(f"| {m['step_id']} | {m['elapsed_ms']} | {m['status']} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"


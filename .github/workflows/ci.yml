  ci-verdict-summary:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event.inputs.python_test_bench != 'true' }}
    needs: [typecheck, lint, test, build, e2e, python-test-core, python-test, node-backed-hook-tests, actionlint, agy-causal-claim-drift-gate, visual-impact-policy]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          # pull_request の既定 checkout は merge commit になるため、verdict の
          # current-head contract には PR head を明示して checkout する。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up locked Python runner
        uses: ./.github/actions/setup-python-uv
      - name: Generate ci_verdict_summary_v2 binding input
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          mkdir -p ci_verdict_summary_v2_binding_artifacts
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("ci_verdict_summary_v2_binding_artifacts/ci_verdict_summary_v2_binding.json").write_text(
              json.dumps(
                  {
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                      "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "event_name": os.environ["GITHUB_EVENT_NAME"],
                      "head_sha": os.environ["PR_HEAD_SHA"],
                  },
                  indent=2,
              )
          )
          PY
      - name: Upload ci_verdict_summary_v2 binding input
        id: upload-ci-verdict-summary-v2-binding
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-verdict-summary-v2-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_verdict_summary_v2_binding_artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Generate ci_verdict_summary_v2 artifact
        # P0: needs.result is synthetic and carries neither a CheckRun id nor
        # a per-check head SHA. Read commit-scoped GitHub CheckRun evidence
        # for this exact workflow run before generating a merge-ready artifact.
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?per_page=100" \
            > ci_verdict_summary_v2_check_runs.json
          test -s ci_verdict_summary_v2_check_runs.json
          mkdir -p ci_verdict_summary_v2_artifacts
          uv run --locked python3 .claude/skills/pr-review-judge/scripts/ci_verdict_summary_v2.py \
            --expected-head-sha "$PR_HEAD_SHA" \
            --pr-head-sha "$PR_HEAD_SHA" \
            --repository "${{ github.repository }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --event-name "${{ github.event_name }}" \
            --check-runs-api-json ci_verdict_summary_v2_check_runs.json \
            --artifact-id "${{ steps.upload-ci-verdict-summary-v2-binding.outputs.artifact-id }}" \
            --artifact-url "${{ steps.upload-ci-verdict-summary-v2-binding.outputs.artifact-url }}" \
            --artifact-digest "${{ steps.upload-ci-verdict-summary-v2-binding.outputs.artifact-digest }}" \
            --artifact-name "ci-verdict-summary-v2-binding-${{ github.run_id }}-${{ github.run_attempt }}" \
            --artifact-workflow-run-id "${{ github.run_id }}" \
            --artifact-workflow-run-attempt "${{ github.run_attempt }}" \
            --output ci_verdict_summary_v2_artifacts/ci_verdict_summary_v2.json
      - name: Upload ci-verdict-summary-v2 artifact
        id: upload-ci-verdict-summary-v2
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-verdict-summary-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_verdict_summary_v2_artifacts/
          if-no-files-found: error
          retention-days: 30
      # Issue #2119 AC9(b) (PR #2137 human review issuecomment-5273090534 P0
      # fix): gate-ready latency is the wall-clock time from workflow-run
      # start until the required stable `e2e` aggregate check itself
      # reaches a conclusion. Computed here (not inside jobs.e2e itself,
      # which check-visual-artifact-pipeline.py's AC13 guard forbids from
      # carrying any upload-artifact/download-artifact step, to prevent a
      # compatibility shim impersonating the pre-#2119 jobs.e2e visual
      # artifact contract) from the real per-commit check-run `completed_at`
      # for the "e2e" check (fetched below) minus the real workflow-run
      # `run_started_at` (both authoritative GitHub API timestamps, not
      # self-measured wall-clock deltas). Prior to this Issue, the
      # monolithic `e2e` job's OWN job runtime already equaled this
      # quantity; post-split, the aggregate job depends on `needs`, so its
      # own step runtime alone would undercount the real gate-ready latency.
      - name: Record gate-ready latency (ci_runtime_baseline_v1)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ci_runtime_baseline_artifacts
          RUN_STARTED_AT="$(gh api "repos/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}" --jq .run_started_at)"
          export RUN_STARTED_AT
          python3 - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone

          run_started_at = datetime.fromisoformat(
              os.environ["RUN_STARTED_AT"].replace("Z", "+00:00")
          )

          check_runs = json.loads(
              pathlib.Path("ci_verdict_summary_v2_check_runs.json").read_text(encoding="utf-8")
          ).get("check_runs", [])
          e2e_runs = [c for c in check_runs if c.get("name") == "e2e" and c.get("status") == "completed"]

          artifact = {
              "schema": "ci_runtime_baseline_v1",
              "run_id": os.environ["GH_RUN_ID"],
              "run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "head_sha": os.environ["GH_HEAD_SHA"],
              "merge_sha": os.environ["GH_SHA"],
              "job": "e2e",
              "run_started_at": os.environ["RUN_STARTED_AT"],
              "measurements": [],
          }

          if e2e_runs:
              completed_at = datetime.fromisoformat(
                  e2e_runs[0]["completed_at"].replace("Z", "+00:00")
              )
              gate_ready_latency_ms = int((completed_at - run_started_at).total_seconds() * 1000)
              artifact["gate_ready_latency_ms"] = gate_ready_latency_ms
              artifact["gate_ready_at"] = e2e_runs[0]["completed_at"]
              print(f"gate_ready_latency_ms={gate_ready_latency_ms}")
          else:
              # The "e2e" check-run was not found completed at fetch time --
              # do NOT fabricate a latency value (fail-closed: this run is
              # simply excluded from the gate-ready-latency cohort rather
              # than silently degrading to success).
              print("no completed 'e2e' check-run found; gate_ready_latency_ms omitted")

          out = pathlib.Path("ci_runtime_baseline_artifacts") / "ci_runtime_baseline_v1_e2e.json"
          out.write_text(json.dumps(artifact, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload ci_runtime_baseline_v1 (e2e aggregate gate-ready latency)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-baseline-e2e-gate-ready-${{ github.run_attempt }}
          path: ci_runtime_baseline_artifacts/ci_runtime_baseline_v1_e2e.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify real CI check conclusions (AC9)
        # Issue #2161 (native Codex CLI retirement): the former
        # native-Codex-CLI-lane sentinel download + AC6 sentinel verification
        # branch were removed along with the job.
        if: ${{ !cancelled() }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHON_TEST_BENCH: ${{ github.event.inputs.python_test_bench }}
        run: |
          if [ "$PYTHON_TEST_BENCH" = "true" ]; then
            uv run --locked python3 scripts/ci/verify_ci_check_conclusions.py \
              --check-runs-api-json ci_verdict_summary_v2_check_runs.json \
              --expected-head-sha "$PR_HEAD_SHA" \
              --workflow-run-id "${{ github.run_id }}" \
              --workflow-run-attempt "${{ github.run_attempt }}" \
              --bench-mode
          else
            uv run --locked python3 scripts/ci/verify_ci_check_conclusions.py \
              --check-runs-api-json ci_verdict_summary_v2_check_runs.json \
              --expected-head-sha "$PR_HEAD_SHA" \
              --workflow-run-id "${{ github.run_id }}" \
              --workflow-run-attempt "${{ github.run_attempt }}"
          fi
      - name: Output ci_verdict_summary_v2 Step Summary
        # Render the exact uploaded payload; never regenerate it after upload.
        if: ${{ !cancelled() }}
        run: |
          uv run --locked python3 .claude/skills/pr-review-judge/scripts/ci_verdict_summary_v2.py \
            --summary-input ci_verdict_summary_v2_artifacts/ci_verdict_summary_v2.json
      - name: Enforce ci_verdict_summary_v2 overall_status gate (Issue #1824 P0-1)
        # The ci-verdict-summary job itself must fail closed whenever the generated
        # artifact's overall_status is not merge_ready -- otherwise an unclassified
        # (CLASSIFICATION_MAP-missing) upstream job can silently produce a
        # gh_error/blocked verdict that no CI check surfaces as a failure.
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("ci_verdict_summary_v2_artifacts/ci_verdict_summary_v2.json") as f:
              artifact = json.load(f)

          overall_status = artifact.get("overall_status")
          print(f"ci_verdict_summary_v2 overall_status={overall_status!r}")
          if overall_status != "merge_ready":
              print(
                  f"::error::ci_verdict_summary_v2 overall_status={overall_status!r} "
                  "(expected 'merge_ready'); failing ci-verdict-summary closed"
              )
              sys.exit(1)
          PY

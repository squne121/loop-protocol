          artifact = {
              "schema": "ci_runtime_baseline_v1",
              "run_id": os.environ["GH_RUN_ID"],
              "run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "head_sha": os.environ["GH_HEAD_SHA"],
              "merge_sha": os.environ["GH_SHA"],
              "job": os.environ["GH_JOB"],
              "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
              "measurement_method": "date_plus3N_ms",
              "measurements": measurements,
          }
          out = pathlib.Path("ci_runtime_baseline_artifacts/ci_runtime_baseline_v1.json")
          out.write_text(json.dumps(artifact, indent=2))
          print(f"Written: {out}")
          PY
      - name: Upload ci-runtime-baseline artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-baseline-${{ github.job }}-${{ github.run_attempt }}
          path: ci_runtime_baseline_artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Output CI runtime summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## CI Runtime Baseline: ${{ github.job }}"
            echo ""
            echo "| step_id | elapsed_ms | status |"
            echo "|---|---|---|"
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      m = json.loads(line)
                      print(f"| {m['step_id']} | {m['elapsed_ms']} | {m['status']} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  # Issue #2119: `e2e-core` owns the standard E2E suite (every spec except
  # the responsive matrix), the exactly-once preview-namespace lane, and the
  # existing visual artifact evidence pipeline (`scripts/check-visual-artifact-pipeline.py`
  # producer authority). `e2e-responsive-matrix` (below) runs ONLY
  # `assist-player-affordance-responsive.spec.ts` in parallel, with no DAG
  # dependency between the two. The `e2e` aggregate job further below
  # collects both via `needs` + `if: always()`.
  e2e-core:
    if: ${{ github.event.inputs.python_test_bench != 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_VERSION: "1.60.0"
      # #2159 P0-1 (fix_delta after adversarial review issuecomment-5295659213):
      # single source-of-truth mirror of this job's `container.image` digest
      # (GH Actions does not support referencing `env.*` from `container:`),
      # consumed by the ci_runtime_baseline_v2 producer below as
      # `playwright_container_image_digest`.
      PLAYWRIGHT_CONTAINER_IMAGE_DIGEST: "sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948"
      LOOP_E2E_LANE: core
      # Issue #1958 fix_delta iteration 3 (PR #2006 review, blocker 4): the
      # real PR head SHA for pull_request events (never the synthetic
      # "Merge <head> into <base>" ref that process.env.GITHUB_SHA resolves
      # to on pull_request events); falls back to github.sha for push events
      # (the actual pushed commit -- no synthetic-merge issue there).
      # tests/e2e/visual-utils.ts's resolveExpectedHeadSha() requires this to
      # be a valid 40-hex commit SHA and throws otherwise.
      EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    container:
      image: mcr.microsoft.com/playwright@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # #2159 OWNER scope-authority ruling (issuecomment-5299412215,
          # item 1/P0-2 structural fix): the `workflow_dispatch` `ref` this
          # run was DISPATCHED against stays on the current/default branch
          # (so the WORKFLOW DEFINITION -- `github.workflow_sha` -- is
          # current, never reverted). The application code being MEASURED
          # is checked out here via an EXPLICIT `ref:` override to
          # `target_sha` -- a SEPARATE checkout selector from the dispatch
          # `ref`. `target_sha` (measured code) and `github.workflow_sha`
          # (workflow definition) are therefore allowed, and expected, to
          # differ for a fixed-SHA benchmark dispatch; both are recorded as
          # two independent fields below (never conflated or asserted
          # equal).
          ref: ${{ github.event.inputs.target_sha != '' && github.event.inputs.target_sha || github.sha }}
      - name: Verify checked-out HEAD matches dispatched target_sha (#2159 P0-2)
        if: ${{ github.event.inputs.target_sha != '' }}
        env:
          BENCHMARK_TARGET_SHA: ${{ github.event.inputs.target_sha }}
        run: |
          set -euo pipefail
          # #2184 fix_delta (PR #2493, live AC6 workflow_dispatch run
          # https://github.com/squne121/loop-protocol/actions/runs/33869974220):
          # this step's shell runs inside the `container:` image above (see
          # the pre-existing "Collect ci_runtime_baseline_v1 artifact" step's
          # comment for the same root cause), and the checked-out workspace
          # at $GITHUB_WORKSPACE is owned by a different UID than the
          # container's git config sees by default, which makes ANY bare
          # `git` invocation in this step fail closed with "detected
          # dubious ownership in repository at '$GITHUB_WORKSPACE'" (exit
          # 128). This step is gated `if: target_sha != ''` and only runs
          # on an actual dispatched benchmark run, so it was never exercised
          # until the first live target_sha dispatch above surfaced it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          resolved_head="$(git rev-parse HEAD)"
          if [ "$resolved_head" != "$BENCHMARK_TARGET_SHA" ]; then
            echo "::error::checked-out HEAD ($resolved_head) does not match dispatched target_sha ($BENCHMARK_TARGET_SHA) -- the explicit checkout ref override did not resolve to the expected commit. Refusing to record a benchmark sample for the wrong commit."
            exit 1
          fi
          echo "target_sha verified: $resolved_head (workflow definition SHA: ${{ github.workflow_sha }})"
      - name: Enable pnpm via corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.7.0 --activate
      - name: Install dependencies (timed)
        id: timed-pnpm-install
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed pnpm_install pnpm install --frozen-lockfile
      - name: Verify resolved required-CI snapshot mode
        # JSON reporter emits Playwright FullConfig without running browser tests.
        run: |
          CI=true pnpm exec playwright test --list --reporter=json > playwright-full-config.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("playwright-full-config.json").read_text())["config"]
          assert config["updateSnapshots"] == "none", config["updateSnapshots"]
          print("PLAYWRIGHT_FULL_CONFIG_SNAPSHOT_POLICY_V1 status: pass")
          PY
      - name: Verify Playwright Docker image version
        run: |
          PW_VERSION="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$PW_VERSION" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::resolved @playwright/test=$PW_VERSION but Docker image expects v$PLAYWRIGHT_VERSION. Update PLAYWRIGHT_VERSION and container.image digest in ci.yml."
            exit 1
          fi
          echo "playwright_version_match=ok resolved=$PW_VERSION expected=$PLAYWRIGHT_VERSION"
      - name: Build for E2E (timed)
        id: timed-build-e2e
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed pnpm_build_e2e env VITE_E2E_MODE=true pnpm build
      - name: Verify E2E dist boundary
        run: pnpm dist:e2e-boundary --mode e2e --dist dist
      - name: Run E2E tests (timed)
        id: timed-e2e
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed test_e2e_ci pnpm test:e2e:ci
      # Visual regression evidence pipeline — docs/dev/visual-baseline-registry.md §5
      # Upload on success AND failure (not just failure()) so baseline evidence is
      # always retained. Uses !cancelled() (not always()) — see registry §5 for rationale.
      # Artifact digest (PR #1813 review fix, P1 Blocker 4): the official
      # `upload-artifact` `outputs.artifact-digest` is used directly (below, in
      # the summary step env) instead of a repo-computed tree digest — a
      # locally-computed `find | sha256sum` digest can silently diverge from
      # what GitHub actually uploads (e.g. hidden files are excluded from
      # upload by default but were previously included in the local `find`),
      # so it is not a trustworthy substitute for the platform's own digest.
      - name: Upload Playwright report
        id: upload-playwright-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload test results
        id: upload-test-results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
      # AC9 dedicated preview-namespace lane (Issue #1283 PR #1517 review fix,
      # P0 Blocker 1): tests/e2e/m4-preview-namespace.spec.ts is excluded from
      # the standard e2e lane above (playwright.config.ts testIgnore) and only
      # runs here, against a clean, production-like build (no VITE_E2E_MODE)
      # with VITE_LOOP_STORAGE_NAMESPACE set — the same namespace-resolution
      # path deploy-pages.yml's deploy-pr job uses for PR preview builds.
      # New steps only — the existing steps above/below are unchanged.
      - name: Resolve preview storage namespace (AC9 dedicated lane)
        id: preview-namespace
        run: |
          set -euo pipefail
          namespace="pr-${{ github.event.number || github.run_id }}"
          case "$namespace" in
            pr-[0-9]*) ;;
            *) echo "Invalid preview storage namespace: $namespace" >&2; exit 1 ;;
          esac
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "expected_key=loop-protocol.preview.${namespace}.mvp.save" >> "$GITHUB_OUTPUT"
          # Issue #1283 (2026-08-03 OWNER review repair, AC9/AC15): deploy-pr
          # equivalent nested base -- matches deploy-pages.yml deploy-pr job
          # (Resolve Vite base path step).
          repo_name="${GITHUB_REPOSITORY#*/}"
          base_path="/${repo_name}/${namespace}/"
          case "$base_path" in
            /*/) ;;
            *) echo "Invalid preview base path: $base_path" >&2; exit 1 ;;
          esac
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"
      - name: Run AC9 preview-namespace lane via pnpm run test:e2e:preview-namespace (timed)
        # Issue #1283 repair iteration 1 (P1 Blocker 4): CI previously
        # reimplemented the build + dist:e2e-boundary + playwright
        # invocation directly instead of calling the package.json script
        # whose fail-closed guard this Issue hardens -- so a broken guard
        # would stay green in CI even though the guard itself never ran.
        # This step now calls the SAME `pnpm run test:e2e:preview-namespace`
        # script a local dedicated-lane invocation uses (guard validation +
        # clean dist + production build + dist:e2e-boundary check +
        # Playwright run), so CI actually exercises the guard.
        # GITHUB_REPOSITORY is set by default on GitHub-hosted runners, so
        # the guard's VITE_BASE_PATH-vs-repo-name cross-check (P1 Blocker 4)
        # is active here.
        id: timed-e2e-preview-namespace
        env:
          VITE_LOOP_STORAGE_NAMESPACE: ${{ steps.preview-namespace.outputs.namespace }}
          LOOP_EXPECTED_STORAGE_KEY: ${{ steps.preview-namespace.outputs.expected_key }}
          # Issue #1283 (2026-08-03 OWNER review repair, AC9): playwright.config.ts
          # reads VITE_BASE_PATH at config-load time to resolve the nested baseURL/
          # webServer.url for this lane -- must match the same value the guard/build use.
          VITE_BASE_PATH: ${{ steps.preview-namespace.outputs.base_path }}
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed test_e2e_preview_namespace pnpm run test:e2e:preview-namespace
      - name: Upload AC9 preview-namespace Playwright report
        id: upload-playwright-report-preview-namespace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-preview-namespace
          path: playwright-report-preview-namespace/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect ci_runtime_baseline_v1 artifact
        if: ${{ !cancelled() }}
        env:
          GH_JOB: ${{ github.job }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_SHA: ${{ github.sha }}
          GH_RUNNER_OS: ${{ runner.os }}
          GH_RUNNER_ARCH: ${{ runner.arch }}
          # #2159 OWNER scope-authority ruling (issuecomment-5299412215, item
          # 1/P0-2): the WORKFLOW DEFINITION's own commit SHA (distinct from
          # the measured application code's `head_sha`, which on a
          # fixed-SHA benchmark dispatch is pinned via an explicit
          # `actions/checkout` `ref:` override to `target_sha`).
          GH_WORKFLOW_SHA: ${{ github.workflow_sha }}
          # #2159 P0-2: populated only on a dedicated fixed-SHA benchmark
          # dispatch (empty string on a normal push/pull_request run, which
          # the producer below falls back to "ci_default" for).
          BENCHMARK_COHORT_ROLE: ${{ github.event.inputs.cohort_role }}
          BENCHMARK_EXPERIMENT_ID: ${{ github.event.inputs.experiment_id }}
          # Issue #2119 AC9 comparable-cohort fingerprint (PR #2137 human
          # review issuecomment-5273090534 P0 fix): the P50 cohort loader
          # must be able to verify every run in a 20-run comparable cohort
          # shares the same runner image / Node / pnpm / Playwright /
          # lockfile / workflow digest, not just runner image.
          # #2159 P0-1 (fix_delta after adversarial review
          # issuecomment-5295659213): the ci_runtime_baseline_v1 producer
          # previously emitted `runner_image` sourced from `ImageOS`/
          # `ImageVersion`, which are NOT populated inside a containerized
          # job (`container: image: mcr.microsoft.com/playwright@...`) --
          # they resolved to the fail-closed-rejected placeholder
          # "unknown/unknown", which `_fingerprint_has_placeholder`
          # correctly (but permanently) excluded every real e2e-core/
          # e2e-responsive-matrix artifact from any comparable cohort.
          # `runner.os`/`runner.arch` ARE always populated (evaluated by the
          # runner itself, not shell env inside the container). This
          # producer now emits BOTH the legacy `runner_image` field
          # (unchanged, for any existing consumer) AND the new
          # `host_runner_image` / `playwright_container_image_digest` /
          # `workflow_run_id` / `cohort_role` fields the redesigned
          # WITHIN_COHORT_REQUIRED_EQUAL / CROSS_COHORT_REQUIRED_EQUAL
          # contract (tests/ci/test_ci_performance_gate.py) requires.
          NODE_VERSION_RAW: ""
          PNPM_VERSION_RAW: ""
          LOCKFILE_HASH_RAW: ""
          WORKFLOW_DIGEST_RAW: ""
          # #2184 AC1: `measured_head_sha` (distinct from `head_sha`
          # above, which resolves to `github.sha` -- the workflow_dispatch
          # ref tip -- on a fixed-SHA benchmark dispatch, NOT `target_sha`).
          # Populated below via an independent `git rev-parse HEAD`,
          # regardless of whether `target_sha` was provided, never a
          # direct copy of the `target_sha` input itself. See
          # docs/dev/e2e-performance-benchmark.md.
          GH_MEASURED_HEAD_SHA: ""
        run: |
          mkdir -p ci_runtime_baseline_artifacts
          NODE_VERSION_RAW="$(node -v 2>/dev/null || echo unknown)"
          PNPM_VERSION_RAW="$(pnpm -v 2>/dev/null || echo unknown)"
          LOCKFILE_HASH_RAW="sha256:$(sha256sum pnpm-lock.yaml 2>/dev/null | cut -d' ' -f1 || echo unknown)"
          WORKFLOW_DIGEST_RAW="sha256:$(sha256sum .github/workflows/ci.yml 2>/dev/null | cut -d' ' -f1 || echo unknown)"
          # #2184 fix_delta (pr-reviewer REQUEST_CHANGES, PR #2493 blocker 1):
          # this step's shell runs inside the `container:` image above, and
          # the checked-out workspace at $GITHUB_WORKSPACE is owned by a
          # different UID than the container's git config sees by default,
          # which makes ANY bare `git` invocation in this step fail closed
          # with "detected dubious ownership in repository at
          # '$GITHUB_WORKSPACE'" (exit 128). The pre-existing "Verify
          # checked-out HEAD matches dispatched target_sha" step above never
          # hit this because it's gated `if: target_sha != ''` and only ever
          # ran on an actual dispatched benchmark run; this step's
          # unconditional `git rev-parse HEAD` below runs on every job
          # invocation (including plain push/pull_request CI), so it must
          # register the safe.directory exception itself before invoking
          # `git`.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # #2184 AC1: independent observation of the checked-out commit --
          # NEVER the `target_sha` input verbatim. On a `target_sha`
          # dispatch, the "Verify checked-out HEAD matches dispatched
          # target_sha" step above already hard-fails the job if this
          # would disagree with `target_sha`; on a normal (non-benchmark)
          # run, this simply reflects the actual checked-out commit.
          GH_MEASURED_HEAD_SHA="$(git rev-parse HEAD)"
          export NODE_VERSION_RAW PNPM_VERSION_RAW LOCKFILE_HASH_RAW WORKFLOW_DIGEST_RAW GH_MEASURED_HEAD_SHA
          python3 - <<'PY'
          import json, os, pathlib
          fingerprint_fields = {
              "runner_image": os.environ.get("ImageOS","unknown") + "/" + os.environ.get("ImageVersion","unknown"),
              "node_version": os.environ.get("NODE_VERSION_RAW", "unknown"),
              "pnpm_version": os.environ.get("PNPM_VERSION_RAW", "unknown"),
              "playwright_version": os.environ.get("PLAYWRIGHT_VERSION", "unknown"),
              "lockfile_hash": os.environ.get("LOCKFILE_HASH_RAW", "unknown"),
              "workflow_digest": os.environ.get("WORKFLOW_DIGEST_RAW", "unknown"),
          }
          # #2159 P0-1: v2-contract fields, never placeholder-valued for a
          # containerized job (see the env-block comment above for why the
          # legacy runner_image field is placeholder-prone here).
          v2_fields = {
              "workflow_run_id": int(os.environ["GH_RUN_ID"]),
              "host_runner_image": (
                  os.environ.get("GH_RUNNER_OS", "unknown") + "/" + os.environ.get("GH_RUNNER_ARCH", "unknown")
              ),
              "host_runner_image_provenance": "os_arch_fallback",
              "playwright_container_image_digest": os.environ.get(
                  "PLAYWRIGHT_CONTAINER_IMAGE_DIGEST", "unknown"
              ),
              "cohort_role": os.environ.get("BENCHMARK_COHORT_ROLE") or "ci_default",
              "experiment_id": os.environ.get("BENCHMARK_EXPERIMENT_ID") or None,
              # #2159 OWNER scope-authority ruling (issuecomment-5299412215,
              # item 1/P0-2): `github.workflow_sha` is the commit of the
              # WORKFLOW DEFINITION that produced this run (distinct from
              # `head_sha`, the measured application code's commit, which on
              # a fixed-SHA benchmark dispatch is pinned via an explicit
              # `actions/checkout` `ref:` override to `target_sha`). Recorded
              # as an independent field -- never conflated with `head_sha`.
              "workflow_sha": os.environ.get("GH_WORKFLOW_SHA", "unknown"),
              # #2184 AC1: the MEASURED application code's commit, observed
              # independently via `git rev-parse HEAD` in this step (never a
              # direct copy of the `target_sha` dispatch input). Distinct
              # from `head_sha` above (which resolves to `github.sha` --
              # the dispatch ref tip -- on a fixed-SHA benchmark dispatch)
              # and from `workflow_sha` (the workflow DEFINITION's commit).
              "measured_head_sha": os.environ.get("GH_MEASURED_HEAD_SHA", "unknown"),
          }
          measurements = []
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      r = json.loads(line)
                      r.update({
                          "run_id": os.environ["GH_RUN_ID"],
                          "run_attempt": os.environ["GH_RUN_ATTEMPT"],
                          "head_sha": os.environ["GH_HEAD_SHA"],
                          "merge_sha": os.environ["GH_SHA"],
                          "job": os.environ["GH_JOB"],
                          "measurement_method": "date_plus3N_ms",
                          **fingerprint_fields,
                      })
                      measurements.append(r)
          artifact = {
              "schema": "ci_runtime_baseline_v1",
              "run_id": os.environ["GH_RUN_ID"],
              "run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "head_sha": os.environ["GH_HEAD_SHA"],
              "merge_sha": os.environ["GH_SHA"],
              "job": os.environ["GH_JOB"],
              "measurement_method": "date_plus3N_ms",
              "measurements": measurements,
              **fingerprint_fields,
              **v2_fields,
          }
          out = pathlib.Path("ci_runtime_baseline_artifacts/ci_runtime_baseline_v1.json")
          out.write_text(json.dumps(artifact, indent=2))
          print(f"Written: {out}")
          PY
      - name: Upload ci-runtime-baseline artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-baseline-${{ github.job }}-${{ github.run_attempt }}
          path: ci_runtime_baseline_artifacts/
          if-no-files-found: error
          retention-days: 30
      # Summary step MUST be after upload steps: outputs.artifact-url is only
      # available once upload-artifact has run, and $GITHUB_STEP_SUMMARY is
      # per-step (a later step cannot edit an earlier step's summary).
      - name: Summarize visual regression evidence
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_REPORT_URL: ${{ steps.upload-playwright-report.outputs.artifact-url || 'N/A' }}
          TEST_RESULTS_URL: ${{ steps.upload-test-results.outputs.artifact-url || 'N/A' }}
          # Official GitHub `upload-artifact` digest output (PR #1813 review
          # fix, P1 Blocker 4) — not a repo-computed tree digest.
          TEST_RESULTS_DIGEST: ${{ steps.upload-test-results.outputs.artifact-digest || 'sha256:none' }}
          PLAYWRIGHT_REPORT_DIGEST: ${{ steps.upload-playwright-report.outputs.artifact-digest || 'sha256:none' }}
          UPLOAD_PLAYWRIGHT_REPORT_OUTCOME: ${{ steps.upload-playwright-report.outcome }}
          UPLOAD_TEST_RESULTS_OUTCOME: ${{ steps.upload-test-results.outcome }}
          # `outputs.artifact-id` is only populated when the step actually
          # uploaded content (PR #1813 review fix, P1 Blocker 3) — used below
          # instead of a post-hoc local directory scan, which can no longer
          # be trusted once a later step in the same job reuses a
          # differently-scoped `test-results`-named directory (see the
          # dedicated `outputDir` split in playwright.config.ts).
          UPLOAD_PLAYWRIGHT_REPORT_ARTIFACT_ID: ${{ steps.upload-playwright-report.outputs.artifact-id }}
          UPLOAD_TEST_RESULTS_ARTIFACT_ID: ${{ steps.upload-test-results.outputs.artifact-id }}
        run: |
          PW_VERSION="$(node -p "require('@playwright/test/package.json').version" 2>/dev/null || echo 'unknown')"
          # Artifact absence-state classification (Issue #1387 AC7; PR #1813
          # review fix, P1 Blocker 3): distinguish uploaded / no_files /
          # step_not_run / upload_failed from the upload step's own outcome +
          # artifact-id output — not a local directory scan.
          classify_artifact_status() {
            local outcome="$1" artifact_id="$2"
            if [ "$outcome" = "skipped" ]; then
              echo "step_not_run"
            elif [ "$outcome" = "failure" ]; then
              echo "upload_failed"
            elif [ "$outcome" = "success" ]; then
              if [ -n "$artifact_id" ]; then
                echo "uploaded"
              else
                echo "no_files"
              fi
            else
              echo "step_not_run"
            fi
          }
          TEST_RESULTS_STATE="$(classify_artifact_status "$UPLOAD_TEST_RESULTS_OUTCOME" "$UPLOAD_TEST_RESULTS_ARTIFACT_ID")"
          PLAYWRIGHT_REPORT_STATE="$(classify_artifact_status "$UPLOAD_PLAYWRIGHT_REPORT_OUTCOME" "$UPLOAD_PLAYWRIGHT_REPORT_ARTIFACT_ID")"
          {
            echo "## CI Runtime Baseline: ${{ github.job }}"
            echo ""
            echo "| step_id | elapsed_ms | status |"
            echo "|---|---|---|"
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("measurements.jsonl")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line:
                      m = json.loads(line)
                      print(f"| {m['step_id']} | {m['elapsed_ms']} | {m['status']} |")
          PY
            echo ""
            echo "## Visual regression evidence"
            echo ""
            echo "Visual baseline 契約は docs/dev/visual-baseline-registry.md を参照。"
            echo ""
            echo "### Environment fingerprint"
            echo "- runner: ${RUNNER_OS} ${RUNNER_ARCH} (image ${ImageOS:-unknown} ${ImageVersion:-unknown})"
            echo "- node: $(node -p 'process.version')"
            echo "- Playwright: ${PW_VERSION}"
            echo "- browser: chromium"
            echo "- project: chromium (Desktop Chrome)"
            echo "- viewport: 1280x720"
            echo "- deviceScaleFactor: 1 (Desktop Chrome default; not overridden)"
            echo "- snapshotPathTemplate: {testDir}/__screenshots__/{testFilePath}/{arg}{ext}"
            echo ""
            echo "### Artifacts"
            echo "- playwright-report: ${PLAYWRIGHT_REPORT_URL} (status: ${PLAYWRIGHT_REPORT_STATE}, digest: ${PLAYWRIGHT_REPORT_DIGEST})"
            echo "- test-results: ${TEST_RESULTS_URL} (status: ${TEST_RESULTS_STATE}, digest: ${TEST_RESULTS_DIGEST})"
            echo ""
            echo "### actual / expected / diff"
            if [ -d test-results ] && find test-results -name '*-diff.png' -print -quit | grep -q .; then
              echo "- visual mismatch detected: see *-actual.png / *-expected.png / *-diff.png in the test-results artifact above"
            else
              echo "- N/A (no visual mismatch; expected/actual/diff are only emitted on toHaveScreenshot failure)"
            fi
            echo ""
            echo "### Active VRT captures"
            echo ""
            echo "Each row below is one active capture (an individual toHaveScreenshot() /"
            echo "expectDomOverlayScreenshot() / expectCanvasVisualCueScreenshot() call site) —"
            echo "not a suite. There is no separate suite-level fingerprint (PR #1813 review"
            echo "fix, P1 Blocker 2) — every field below is cross-validated against the real"
            echo "spec sources by scripts/check-visual-artifact-pipeline.py (Issue #1387)."
            echo "| capture_id | screenshot directory | browser | project | viewport | DPR | comparator | stylePath | artifact scope | artifact URL | digest | retention (days) |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|---|"
            TEST_RESULTS_URL="$TEST_RESULTS_URL" TEST_RESULTS_DIGEST="$TEST_RESULTS_DIGEST" python3 - <<'PY'

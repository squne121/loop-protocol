  e2e:
    if: ${{ github.event.inputs.python_test_bench != 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_VERSION: "1.60.0"
      # Issue #1958 fix_delta iteration 3 (PR #2006 review, blocker 4): the
      # real PR head SHA for pull_request events (never the synthetic
      # "Merge <head> into <base>" ref that process.env.GITHUB_SHA resolves
      # to on pull_request events); falls back to github.sha for push events
      # (the actual pushed commit -- no synthetic-merge issue there).
      # tests/e2e/visual-utils.ts's resolveExpectedHeadSha() requires this to
      # be a valid 40-hex commit SHA and throws otherwise.
      EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    container:
      image: mcr.microsoft.com/playwright@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable pnpm via corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.7.0 --activate
      - name: Install dependencies (timed)
        id: timed-pnpm-install
        run: |
          run_timed() {
            local step_id="$1"; shift
            local start_ms end_ms elapsed_ms status
            start_ms=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            printf '{"step_id":"%s","phase_id":"%s","status":%d,"elapsed_ms":%d}\n' \
              "$step_id" "$step_id" "$status" "$elapsed_ms" \
              >> measurements.jsonl
            return $status
          }
          run_timed pnpm_install pnpm install --frozen-lockfile
      - name: Verify resolved required-CI snapshot mode
        # JSON reporter emits Playwright FullConfig without running browser tests.
        run: |
          CI=true pnpm exec playwright test --list --reporter=json > playwright-full-config.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("playwright-full-config.json").read_text())["config"]
          assert config["updateSnapshots"] == "none", config["updateSnapshots"]
          print("PLAYWRIGHT_FULL_CONFIG_SNAPSHOT_POLICY_V1 status: pass")
          PY
      - name: Verify Playwright Docker image version
        run: |
          PW_VERSION="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$PW_VERSION" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::resolved @playwright/test=$PW_VERSION but Docker image expects v$PLAYWRIGHT_VERSION. Update PLAYWRIGHT_VERSION and container.image digest in ci.yml."
            exit 1
          fi
          echo "playwright_version_match=ok resolved=$PW_VERSION expected=$PLAYWRIGHT_VERSION"

name: visual-impact-policy-trusted-consumer

# Issue #2019 In Scope I (P0-6 trust boundary, Scope Delta 2026-08-09):
#
# The `pull_request`-triggered `visual-impact-policy` job in `ci.yml` has a
# structural trust-boundary gap that base-locking the EVALUATOR CODE alone
# cannot close: the job's own DEFINITION (trigger, permissions, step list)
# is always resolved from the candidate PR head's own `ci.yml`, so a
# candidate PR can neuter the job itself (delete the materialize step,
# force `exit 0`, weaken the schema, etc.) regardless of what the
# evaluator source it calls contains.
#
# This workflow closes that gap using a GitHub Actions guarantee that a
# `pull_request`-triggered job cannot replicate: for a `workflow_run`
# trigger, GitHub always resolves the TRIGGERED workflow's own file
# (trigger/permissions/jobs/steps -- this entire file) from the
# base/default branch, never from the candidate PR head, independent of
# what the candidate PR changes in its own copy of this same path. This
# job therefore never checks out, and never executes, the candidate PR
# head's code (no `actions/checkout` step references a PR head ref; no
# step runs PR-head scripts, local composite actions, `package.json`
# scripts, or dependency code -- AC30/AC36). It treats the `visual-impact-policy`
# producer job's `VISUAL_IMPACT_DECISION_V1` decision artifact and
# `component-vrt-evidence-manifest` evidence artifact as fully UNTRUSTED
# input (schema validation, size limits, `manifest_sha256`/digest
# verification, head_sha/PR-number/repository binding -- AC31/AC32/AC34)
# and rejects stale `workflow_run` events whose `head_sha` no longer
# matches the PR's current live head (AC35). Its own judgement is
# published as a dedicated `visual-impact-policy-trusted` CheckRun bound
# to the candidate PR's exact current head SHA -- a different check name
# than the producer's `visual-impact-policy` (AC37) -- so a candidate PR
# that forces the producer job to report success cannot force THIS job's
# independently-computed verdict to change (AC33).
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: visual-impact-trusted-consumer-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  visual-impact-policy-trusted:
    # Only `pull_request`-triggered `ci` runs produce a
    # `visual-impact-decision-v1` artifact at all (the producer's
    # `policy-check` step is itself gated on
    # `github.event_name == 'pull_request'`); push/workflow_dispatch/
    # merge_group-triggered `ci` runs are ignored here.
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    # Minimal permissions: `actions: read` to list/download the producer
    # run's artifacts, `checks: write` to publish the dedicated
    # `visual-impact-policy-trusted` CheckRun. No other write scope is
    # granted, and this is the ONLY job in this file.
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      # AC30/AC36: no `ref:` is given here. For a `workflow_run`-triggered
      # job, `actions/checkout` without an explicit `ref:` resolves to the
      # SHA that triggered THIS workflow's own run -- i.e. the base/default
      # branch commit this workflow file itself lives at -- never the
      # candidate PR head. This step (and this job as a whole) never
      # checks out, nor executes, the candidate PR head's own copy of
      # `resolve_visual_impact.py` / `visual-impact.schema.json` / any
      # `package.json` script.
      - name: Checkout base/default branch (never the candidate PR head)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # actions/checkout keeps its GitHub token in RUNNER_TEMP and
          # removes it during post-job cleanup. This is the supported Git
          # transport path for the trusted-side object fetch below; no token
          # value is interpolated into the fetch command or persisted as an
          # artifact.
          persist-credentials: true

      - uses: ./.github/actions/setup-python-uv

      - name: Resolve candidate PR number, workflow_run head_sha, and live PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # PR #2229 review fix_delta P2: pin the REST API version/media
          # type explicitly on every `gh api` call in this step rather than
          # relying on `gh api`'s current defaults.
          gh_api() { gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          PR_NUMBER="$(gh_api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')"
          if [ -z "${PR_NUMBER}" ]; then
            # `workflow_run.pull_requests[]` is only populated for
            # same-repo (non-fork) PRs; fall back to the
            # commits-associated-PRs API so a same-repo PR is still found
            # even when the run payload omitted it.
            PR_NUMBER="$(gh_api "repos/${REPO}/commits/${RUN_HEAD_SHA}/pulls" --jq '[.[] | select(.state=="open")][0].number // empty')"
          fi
          if [ -z "${PR_NUMBER}" ]; then
            echo "::warning::no open PR associated with workflow_run head_sha ${RUN_HEAD_SHA}; nothing to verify"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "live_head_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LIVE_HEAD_SHA="$(gh_api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "live_head_sha=${LIVE_HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download producer artifacts (untrusted input)
        id: download
        if: ${{ steps.pr.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO: ${{ github.repository }}
          # Issue #2230 fix_delta P2-1 (best-effort): the triggering
          # workflow_run's OWN head_sha -- this is what the acquired
          # artifact's nested `workflow_run.head_sha` should equal (this is
          # a same-run consistency check, distinct from the separate
          # RUN_HEAD_SHA-vs-LIVE_HEAD_SHA staleness check the publish step
          # below already performs).
          EXPECTED_ARTIFACT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # PR #2229 review fix_delta P2: pin the REST API version/media
          # type explicitly on every `gh api` call in this step.
          gh_api() { gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          ARTIFACT_ROOT="$(mktemp -d "${RUNNER_TEMP}/visual-impact-trusted-${RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          mkdir -p "${ARTIFACT_ROOT}/decision" "${ARTIFACT_ROOT}/evidence"

          # Issue #2505 (ADR 0009 "## ZIP Resource Bound" follow-up): known
          # entry names and the three resource bounds (downloaded ZIP
          # bytes, original ZIP entry count, selected-entry
          # decompressed/read bytes) enforced against decision.zip /
          # evidence.zip below, before either archive's contents ever reach
          # the semantic verifier. Named as grep-able constants -- see this
          # Issue's Verification Commands.
          DECISION_ENTRY_NAME="visual_impact_decision_v1.json"
          EVIDENCE_ENTRY_NAME_V3="visual_baseline_review_evidence.json"
          EVIDENCE_ENTRY_NAME_V2="visual_baseline_review_evidence_v2.json"
          DECISION_ZIP_MAX_BYTES=2097152
          EVIDENCE_ZIP_MAX_BYTES=8388608
          DECISION_ZIP_MAX_ENTRIES=16
          EVIDENCE_ZIP_MAX_ENTRIES=16
          DECISION_MAX_READ_BYTES=1000000
          EVIDENCE_MAX_READ_BYTES=5000000

          # Issue #2505: a small, adversarially-testable Python one-off
          # (see scripts/agent-ops/tests/test_visual_impact_trusted_consumer.py)
          # that streams `gh api <zip-url>` into a BOUNDED in-memory buffer
          # -- never written to disk, aborted and reaped the instant it
          # exceeds the byte cap -- lists the ORIGINAL ZIP entry set before
          # selecting any target entry (so ambiguity is evaluated against
          # the full entry list, never a name-narrowed subset -- duplicate
          # entries and V2+V3 coexistence are both caught), opens the
          # selected `ZipInfo` object directly (never "open by name", which
          # is ambiguous when duplicates exist), performs a bounded read of
          # at most max_read_bytes+1 bytes of only that entry, and writes
          # ONLY that entry's bytes to one of the fixed destination paths
          # this step's callers already expect -- never a path derived
          # from the ZIP entry's own recorded name. Lives only inside this
          # step: Allowed Paths for Issue #2505 permit only this workflow
          # YAML and the test file above, never a new production file
          # under scripts/agent-ops/.
          BOUNDED_ZIP_RETRIEVE_PY="${ARTIFACT_ROOT}/bounded_zip_retrieve.py"
          cat > "${BOUNDED_ZIP_RETRIEVE_PY}" <<'BOUNDED_ZIP_RETRIEVE_PY_EOF'
          from __future__ import annotations

          import argparse
          import io
          import subprocess
          import sys
          import zipfile

          STATUS_OK = "ok"
          STATUS_DOWNLOAD_SIZE_EXCEEDED = "download_size_exceeded"
          STATUS_ENTRY_COUNT_EXCEEDED = "entry_count_exceeded"
          STATUS_ENTRY_AMBIGUOUS_OR_MISSING = "entry_ambiguous_or_missing"
          STATUS_READ_SIZE_EXCEEDED = "read_size_exceeded"
          STATUS_INVALID_ZIP = "invalid_zip"
          STATUS_DOWNLOAD_COMMAND_FAILED = "download_command_failed"

          EXIT_CODES = {
              STATUS_OK: 0,
              STATUS_DOWNLOAD_SIZE_EXCEEDED: 10,
              STATUS_ENTRY_COUNT_EXCEEDED: 11,
              STATUS_ENTRY_AMBIGUOUS_OR_MISSING: 12,
              STATUS_READ_SIZE_EXCEEDED: 13,
              STATUS_INVALID_ZIP: 14,
              STATUS_DOWNLOAD_COMMAND_FAILED: 15,
          }


          def write_status(path: str, status: str, artifact: str, limit) -> None:
              with open(path, "w", encoding="utf-8") as fh:
                  fh.write(f"STATUS={status}\n")
                  fh.write(f"ARTIFACT={artifact}\n")
                  fh.write(f"LIMIT={'' if limit is None else limit}\n")


          def bounded_download(zip_url: str, max_download_bytes: int):
              """Stream `gh api <zip_url>` into a bounded in-memory buffer,
              aborting and reaping the process the instant more than
              max_download_bytes have been received. Never writes the
              response to disk (no post-hoc `stat` of a downloaded file)."""
              proc = subprocess.Popen(
                  [
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      "-H",
                      "X-GitHub-Api-Version: 2022-11-28",
                      zip_url,
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              buffer = bytearray()
              chunk_size = 65536
              assert proc.stdout is not None
              try:
                  while True:
                      chunk = proc.stdout.read(chunk_size)
                      if not chunk:
                          break
                      buffer.extend(chunk)
                      if len(buffer) > max_download_bytes:
                          proc.kill()
                          proc.wait()
                          return STATUS_DOWNLOAD_SIZE_EXCEEDED, None
              finally:
                  proc.stdout.close()
              returncode = proc.wait()
              if returncode != 0:
                  return STATUS_DOWNLOAD_COMMAND_FAILED, None
              return STATUS_OK, bytes(buffer)


          def select_entry(entries, targets):
              """Evaluate ambiguity against the FULL original entry list
              (never a name-narrowed subset): exactly one physical entry
              whose filename is one of the accepted names -- 0 matches
              (missing), >=2 matches of the SAME accepted name (duplicate),
              or one-each of two DIFFERENT accepted names (co-existence)
              are all rejected by this single condition."""
              matches = [info for info in entries if info.filename in targets]
              if len(matches) != 1:
                  return None, None
              selected = matches[0]
              return selected, targets[selected.filename]


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--label", required=True)
              parser.add_argument("--zip-url", required=True)
              parser.add_argument("--max-download-bytes", type=int, required=True)
              parser.add_argument("--max-entries", type=int, required=True)
              parser.add_argument("--max-read-bytes", type=int, required=True)
              parser.add_argument(
                  "--target", nargs=2, metavar=("NAME", "DEST"), action="append", required=True
              )
              parser.add_argument("--status-output-file", required=True)
              args = parser.parse_args()
              targets = {name: dest for name, dest in args.target}

              status, buffer = bounded_download(args.zip_url, args.max_download_bytes)
              if status != STATUS_OK:
                  limit = args.max_download_bytes if status == STATUS_DOWNLOAD_SIZE_EXCEEDED else None
                  write_status(args.status_output_file, status, args.label, limit)
                  return EXIT_CODES[status]

              try:
                  zf = zipfile.ZipFile(io.BytesIO(buffer))
                  entries = zf.infolist()
              except zipfile.BadZipFile:
                  write_status(args.status_output_file, STATUS_INVALID_ZIP, args.label, None)
                  return EXIT_CODES[STATUS_INVALID_ZIP]

              if len(entries) > args.max_entries:
                  write_status(args.status_output_file, STATUS_ENTRY_COUNT_EXCEEDED, args.label, args.max_entries)
                  return EXIT_CODES[STATUS_ENTRY_COUNT_EXCEEDED]

              selected, dest_file = select_entry(entries, targets)
              if selected is None:
                  write_status(args.status_output_file, STATUS_ENTRY_AMBIGUOUS_OR_MISSING, args.label, None)
                  return EXIT_CODES[STATUS_ENTRY_AMBIGUOUS_OR_MISSING]

              try:
                  with zf.open(selected) as fh:
                      data = fh.read(args.max_read_bytes + 1)
              except (zipfile.BadZipFile, NotImplementedError, EOFError, RuntimeError):
                  write_status(args.status_output_file, STATUS_INVALID_ZIP, args.label, None)
                  return EXIT_CODES[STATUS_INVALID_ZIP]

              if len(data) > args.max_read_bytes:
                  write_status(args.status_output_file, STATUS_READ_SIZE_EXCEEDED, args.label, args.max_read_bytes)
                  return EXIT_CODES[STATUS_READ_SIZE_EXCEEDED]

              with open(dest_file, "wb") as out:
                  out.write(data)

              write_status(args.status_output_file, STATUS_OK, args.label, None)
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          BOUNDED_ZIP_RETRIEVE_PY_EOF

          DECISION_STATUS_FILE="${ARTIFACT_ROOT}/decision_download_status.kv"
          EVIDENCE_STATUS_FILE="${ARTIFACT_ROOT}/evidence_download_status.kv"

          write_not_attempted_status() {
            printf 'STATUS=not_attempted\n' > "$2"
            printf 'ARTIFACT=%s\n' "$1" >> "$2"
            printf 'LIMIT=\n' >> "$2"
          }

          # Issue #2230 AC3/AC4/AC5: replaces the former inline
          # `gh api .../artifacts?per_page=100 | jq
          # '[.artifacts[] | select(.name=="...")][0]'` pattern (no
          # pagination-completion check, no cardinality check, no `expired`
          # check -- silently adopted the FIRST same-named artifact
          # regardless of which run attempt produced it) with
          # `acquire_trusted_artifact()` -- an executable, adversarially
          # tested Python function (scripts/agent-ops/tests/
          # test_resolve_visual_impact_artifact_attempt_binding.py) that
          # queries the `name=` filter, paginates fully via `per_page=100`,
          # fails closed on `total_count` mismatch/incomplete pagination,
          # and requires cardinality exactly one for the expected
          # attempt-specific name.
          DECISION_ARTIFACT_NAME="visual-impact-decision-v1-${RUN_ATTEMPT}"
          EVIDENCE_ARTIFACT_NAME="component-vrt-evidence-manifest-${RUN_ATTEMPT}"
          set +e
          uv run --locked python3 scripts/agent-ops/resolve_visual_impact.py \
            --mode acquire-trusted-artifact \
            --repository "${REPO}" \
            --run-id "${RUN_ID}" \
            --expected-artifact-name "${DECISION_ARTIFACT_NAME}" \
            --expected-artifact-head-sha "${EXPECTED_ARTIFACT_HEAD_SHA}" \
            --artifact-id-output-file "${ARTIFACT_ROOT}/decision_artifact_id.txt"
          DECISION_ACQUIRE_STATUS=$?
          uv run --locked python3 scripts/agent-ops/resolve_visual_impact.py \
            --mode acquire-trusted-artifact \
            --repository "${REPO}" \
            --run-id "${RUN_ID}" \
            --expected-artifact-name "${EVIDENCE_ARTIFACT_NAME}" \
            --expected-artifact-head-sha "${EXPECTED_ARTIFACT_HEAD_SHA}" \
            --artifact-id-output-file "${ARTIFACT_ROOT}/evidence_artifact_id.txt"
          EVIDENCE_ACQUIRE_STATUS=$?
          set -e
          if [ "${DECISION_ACQUIRE_STATUS}" -eq 0 ] && [ -s "${ARTIFACT_ROOT}/decision_artifact_id.txt" ]; then
            DECISION_ARTIFACT_ID="$(cat "${ARTIFACT_ROOT}/decision_artifact_id.txt")"
            set +e
            uv run --locked python3 "${BOUNDED_ZIP_RETRIEVE_PY}" \
              --label decision \
              --zip-url "repos/${REPO}/actions/artifacts/${DECISION_ARTIFACT_ID}/zip" \
              --max-download-bytes "${DECISION_ZIP_MAX_BYTES}" \
              --max-entries "${DECISION_ZIP_MAX_ENTRIES}" \
              --max-read-bytes "${DECISION_MAX_READ_BYTES}" \
              --status-output-file "${DECISION_STATUS_FILE}" \
              --target "${DECISION_ENTRY_NAME}" "${ARTIFACT_ROOT}/decision/${DECISION_ENTRY_NAME}"
            set -e
          else
            write_not_attempted_status "decision" "${DECISION_STATUS_FILE}"
            echo "::warning::trusted decision artifact '${DECISION_ARTIFACT_NAME}' could not be acquired (fail-closed; exit=${DECISION_ACQUIRE_STATUS})"
          fi
          if [ "${EVIDENCE_ACQUIRE_STATUS}" -eq 0 ] && [ -s "${ARTIFACT_ROOT}/evidence_artifact_id.txt" ]; then
            EVIDENCE_ARTIFACT_ID="$(cat "${ARTIFACT_ROOT}/evidence_artifact_id.txt")"
            set +e
            uv run --locked python3 "${BOUNDED_ZIP_RETRIEVE_PY}" \
              --label evidence \
              --zip-url "repos/${REPO}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}/zip" \
              --max-download-bytes "${EVIDENCE_ZIP_MAX_BYTES}" \
              --max-entries "${EVIDENCE_ZIP_MAX_ENTRIES}" \
              --max-read-bytes "${EVIDENCE_MAX_READ_BYTES}" \
              --status-output-file "${EVIDENCE_STATUS_FILE}" \
              --target "${EVIDENCE_ENTRY_NAME_V3}" "${ARTIFACT_ROOT}/evidence/${EVIDENCE_ENTRY_NAME_V3}" \
              --target "${EVIDENCE_ENTRY_NAME_V2}" "${ARTIFACT_ROOT}/evidence/${EVIDENCE_ENTRY_NAME_V2}"
            set -e
          else
            write_not_attempted_status "evidence" "${EVIDENCE_STATUS_FILE}"
            echo "::warning::trusted evidence-manifest artifact '${EVIDENCE_ARTIFACT_NAME}' could not be acquired (fail-closed; exit=${EVIDENCE_ACQUIRE_STATUS})"
          fi

          # Issue #2505 AC7/AC8/AC9: aggregate the two per-artifact status
          # files into step outputs the Publish step below can distinguish
          # from trusted_input_derivation_failed /
          # producer_artifact_verification_rejected -- and hard-fail this
          # step (never `continue-on-error`) the instant either artifact
          # hit a resource bound / invalid ZIP / download-command failure,
          # so the default GitHub Actions same-job step-skip behavior keeps
          # the `trusted` and `verify` steps below from ever running
          # against a partial or absent file (AC9: `continue-on-error` is
          # never used to turn this rejection into a reported success).
          DOWNLOAD_STATUS="ok"
          DOWNLOAD_FAILURE_REASON=""
          DOWNLOAD_FAILURE_DETAIL=""
          for STATUS_FILE in "${DECISION_STATUS_FILE}" "${EVIDENCE_STATUS_FILE}"; do
            if [ "${DOWNLOAD_STATUS}" = "ok" ] && [ -f "${STATUS_FILE}" ]; then
              STATUS=""
              ARTIFACT=""
              LIMIT=""
              # shellcheck disable=SC1090
              . "${STATUS_FILE}"
              if [ "${STATUS}" != "ok" ] && [ "${STATUS}" != "not_attempted" ]; then
                DOWNLOAD_STATUS="rejected"
                DOWNLOAD_FAILURE_REASON="${STATUS}"
                DOWNLOAD_FAILURE_DETAIL="artifact=${ARTIFACT} limit=${LIMIT}"
              fi
            fi
          done

          {
            echo "artifact_root=${ARTIFACT_ROOT}"
            echo "download_status=${DOWNLOAD_STATUS}"
            echo "download_failure_reason=${DOWNLOAD_FAILURE_REASON}"
            echo "download_failure_detail=${DOWNLOAD_FAILURE_DETAIL}"
          } >> "$GITHUB_OUTPUT"

          if [ "${DOWNLOAD_STATUS}" != "ok" ]; then
            echo "::error::download/archive validation rejected: ${DOWNLOAD_FAILURE_REASON} (${DOWNLOAD_FAILURE_DETAIL})"
            exit 1
          fi

      # Issue #2091 AC1: independently obtain/compute every input
      # `verify-trusted-artifact` cross checks the producer decision
      # against -- live base_sha, PR body, changed-path set, and
      # base/head registry blobs -- NEVER by checking out or running any
      # candidate-PR-head code (only `git fetch`/`git show`/`git diff`
      # plumbing against fetched commit OBJECTS, i.e. static data reads,
      # never `actions/checkout --ref` and never a package-manager
      # invocation; see the AC30/AC36 tests in
      # scripts/agent-ops/tests/test_visual_impact_trusted_consumer.py).
      - name: Independently re-derive trusted-side inputs
        id: trusted
        if: ${{ steps.pr.outputs.pr_number != '' }}
        # Preserve the derivation failure as a distinct diagnostic. The
        # publishing step still runs and must not mislabel this as a producer
        # artifact semantic rejection.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          LIVE_HEAD_SHA: ${{ steps.pr.outputs.live_head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          # PR #2229 review fix_delta P2: pin the REST API version/media
          # type explicitly on every `gh api` call in this step.
          gh_api() { gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          mkdir -p artifacts/trusted
          # Issue #2100 PR #2229 review fix_delta P1-3: authenticate the
          # producer CheckRun via `acquire_component_vrt_checkrun()` in
          # resolve_visual_impact.py -- an executable, adversarially tested
          # Python function with an injectable HTTP transport -- instead of
          # this formerly-inline `gh api`/`jq` shell (which had no
          # executable/current-head runtime test coverage, only grep-style
          # assertions against the workflow YAML text). The attempt-scoped
          # endpoint plus the function's own total-count pagination loop
          # makes an earlier run attempt or an unvisited page ineligible as
          # evidence, same as before.
          EXPECTED_RUN_ID="${RUN_ID:?missing workflow run id}"
          EXPECTED_RUN_ATTEMPT="${RUN_ATTEMPT:?missing workflow run attempt}"
          uv run --locked python3 scripts/agent-ops/resolve_visual_impact.py \
            --mode acquire-component-vrt-checkrun \
            --repository "${REPO}" \
            --run-id "${EXPECTED_RUN_ID}" \
            --run-attempt "${EXPECTED_RUN_ATTEMPT}" \
            --jobs-output-file artifacts/trusted/component_vrt_attempt_jobs.json \
            --check-run-output-file artifacts/trusted/component_vrt_check_run.json
          LIVE_BASE_SHA="$(gh_api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.base.sha')"
          echo "live_base_sha=${LIVE_BASE_SHA}" >> "$GITHUB_OUTPUT"

          # Authentication is supplied by actions/checkout's persisted
          # credential helper. Do not pass or echo a credential in this
          # command: this trusted job only fetches commit objects as data.
          git fetch --no-tags --depth=1 origin "${LIVE_BASE_SHA}" "${LIVE_HEAD_SHA}"

          gh_api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""' > artifacts/trusted/pr_body.txt

          # Issue #2099 AC6: no `|| true` fail-open here -- `set -euo
          # pipefail` above makes a genuine `git diff` plumbing failure
          # abort this step (and this step's `continue-on-error: true`
          # already keeps the publish step reachable to report it as
          # `trusted_input_derivation_failed`, never a silently-empty
          # changed-path set).
          git diff --name-status -z --find-renames "${LIVE_BASE_SHA}" "${LIVE_HEAD_SHA}" \
            > artifacts/trusted/name_status.nul
          uv run --locked python3 scripts/agent-ops/resolve_visual_impact.py \
            --mode changed-paths \
            --name-status-file artifacts/trusted/name_status.nul \
            --typed-output artifacts/trusted/changed_paths_typed.json > /dev/null

          # Issue #2099 AC7: `--mode resolve-trusted-registry-blob`
          # distinguishes "registry does not exist at this ref" (normal,
          # exit 0, no output file) from any OTHER git plumbing failure
          # (exit 1, fail-closed via `set -euo pipefail` above) -- see
          # `read_git_blob_at_ref()` in resolve_visual_impact.py.
          REGISTRY_PATH="docs/dev/visual-surfaces.yml"
          uv run --locked python3 scripts/agent-ops/resolve_visual_impact.py \
            --mode resolve-trusted-registry-blob \
            --ref "${LIVE_BASE_SHA}" \
            --path "${REGISTRY_PATH}" \
            --output-file artifacts/trusted/base_registry.yml \
            --blob-sha-output-file artifacts/trusted/base_registry_blob_sha.txt
          uv run --locked python3 scripts/agent-ops/resolve_visual_impact.py \
            --mode resolve-trusted-registry-blob \
            --ref "${LIVE_HEAD_SHA}" \
            --path "${REGISTRY_PATH}" \
            --output-file artifacts/trusted/head_registry.yml \
            --blob-sha-output-file artifacts/trusted/head_registry_blob_sha.txt

      - name: Independently re-verify producer artifacts (base-locked evaluator)
        id: verify
        if: ${{ steps.pr.outputs.pr_number != '' && steps.trusted.outcome == 'success' }}
        # Keep publishing after a semantic rejection. `outcome` remains
        # `failure` while continuation lets the publisher classify that result.
        continue-on-error: true
        env:
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.live_head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.trusted.outputs.live_base_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          ARTIFACT_ROOT: ${{ steps.download.outputs.artifact_root }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          DECISION_FILE="${ARTIFACT_ROOT}/decision/visual_impact_decision_v1.json"
          [ -f "${DECISION_FILE}" ] || DECISION_FILE=""

          # Issue #2284 Phase A/B: migration-window dual-filename
          # acceptance. The producer (`ci.yml`) may have run at EITHER
          # the pre-#2284 (V2, legacy filename) or post-#2284 (V3, generic
          # filename) commit depending on which `main` revision triggered
          # this `workflow_run` -- never assume only one filename can
          # exist. If BOTH are present in the acquired artifact, refuse to
          # silently pick one (fail-closed) rather than risk consuming a
          # stale/duplicated evidence manifest.
          LEGACY_EVIDENCE_FILE="${ARTIFACT_ROOT}/evidence/visual_baseline_review_evidence_v2.json"
          GENERIC_EVIDENCE_FILE="${ARTIFACT_ROOT}/evidence/visual_baseline_review_evidence.json"
          LEGACY_EVIDENCE_PRESENT=0
          GENERIC_EVIDENCE_PRESENT=0
          [ -f "${LEGACY_EVIDENCE_FILE}" ] && LEGACY_EVIDENCE_PRESENT=1
          [ -f "${GENERIC_EVIDENCE_FILE}" ] && GENERIC_EVIDENCE_PRESENT=1
          if [ "${LEGACY_EVIDENCE_PRESENT}" -eq 1 ] && [ "${GENERIC_EVIDENCE_PRESENT}" -eq 1 ]; then
            echo "::error::evidence-manifest artifact contains BOTH the legacy V2 filename (${LEGACY_EVIDENCE_FILE}) and the generic V3 filename (${GENERIC_EVIDENCE_FILE}) -- refusing to silently pick one during the Issue #2284 V2/V3 migration window."
            exit 1
          elif [ "${GENERIC_EVIDENCE_PRESENT}" -eq 1 ]; then
            EVIDENCE_FILE="${GENERIC_EVIDENCE_FILE}"
          elif [ "${LEGACY_EVIDENCE_PRESENT}" -eq 1 ]; then
            EVIDENCE_FILE="${LEGACY_EVIDENCE_FILE}"
          else
            EVIDENCE_FILE=""
          fi

          EXTRA_ARGS=()
          [ -f artifacts/trusted/base_registry.yml ] && EXTRA_ARGS+=(--trusted-base-registry-file artifacts/trusted/base_registry.yml)
          [ -f artifacts/trusted/head_registry.yml ] && EXTRA_ARGS+=(--trusted-head-registry-file artifacts/trusted/head_registry.yml)
          [ -f artifacts/trusted/base_registry_blob_sha.txt ] && EXTRA_ARGS+=(--expected-base-registry-blob-sha "$(cat artifacts/trusted/base_registry_blob_sha.txt)")
          [ -f artifacts/trusted/head_registry_blob_sha.txt ] && EXTRA_ARGS+=(--expected-head-registry-blob-sha "$(cat artifacts/trusted/head_registry_blob_sha.txt)")

          uv run --locked python3 scripts/agent-ops/resolve_visual_impact.py \
            --mode verify-trusted-artifact \
            --visual-impact-schema docs/dev/visual-impact.schema.json \
            --schema docs/dev/visual-surfaces.schema.json \
            --decision-file "${DECISION_FILE}" \
            --evidence-manifest-file "${EVIDENCE_FILE}" \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --expected-base-sha "${EXPECTED_BASE_SHA}" \
            --expected-repository "${EXPECTED_REPOSITORY}" \
            --expected-workflow-run-id "${EXPECTED_WORKFLOW_RUN_ID}" \
            --expected-workflow-run-attempt "${EXPECTED_WORKFLOW_RUN_ATTEMPT}" \
            --component-vrt-jobs-file artifacts/trusted/component_vrt_attempt_jobs.json \
            --component-vrt-check-run-file artifacts/trusted/component_vrt_check_run.json \
            --component-vrt-jobs-complete \
            --expected-pr-number "${EXPECTED_PR_NUMBER}" \
            --pr-body-file artifacts/trusted/pr_body.txt \
            --changed-paths-typed-file artifacts/trusted/changed_paths_typed.json \
            --trusted-candidate-tree-ref "${EXPECTED_HEAD_SHA}" \
            "${EXTRA_ARGS[@]}" \
            --verdict-output verdict.json
          cat verdict.json

      - name: Publish visual-impact-policy-trusted CheckRun bound to candidate PR head
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LIVE_HEAD_SHA: ${{ steps.pr.outputs.live_head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          TRUSTED_OUTCOME: ${{ steps.trusted.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DOWNLOAD_STATUS: ${{ steps.download.outputs.download_status }}
          DOWNLOAD_FAILURE_REASON: ${{ steps.download.outputs.download_failure_reason }}
          DOWNLOAD_FAILURE_DETAIL: ${{ steps.download.outputs.download_failure_detail }}
        run: |
          set -euo pipefail
          # AC37: bind to the candidate PR's exact CURRENT (freshly
          # re-fetched) head SHA, never a stale workflow_run head_sha, so a
          # stale run can never publish a green CheckRun on the live head.
          # If no open PR could even be resolved, fall back to the
          # workflow_run's own head_sha so the failure is still visible.
          BIND_SHA="${LIVE_HEAD_SHA:-${RUN_HEAD_SHA}}"
          CONCLUSION="failure"
          SUMMARY="visual-impact-policy-trusted: could not resolve an open PR for this workflow_run (head_sha ${RUN_HEAD_SHA})."
          if [ -n "${PR_NUMBER}" ]; then
            if [ "${RUN_HEAD_SHA}" != "${LIVE_HEAD_SHA}" ]; then
              # AC35: stale workflow_run -- the candidate PR head has moved
              # on since this producer run started. Reject rather than
              # publish a verdict for a head that is no longer current.
              CONCLUSION="failure"
              SUMMARY="visual-impact-policy-trusted: stale workflow_run (head_sha ${RUN_HEAD_SHA}) does not match current PR #${PR_NUMBER} head (${LIVE_HEAD_SHA}); rejected."
            elif [ "${DOWNLOAD_STATUS:-}" = "rejected" ]; then
              # Issue #2505 AC8: report the ACTUAL archive/download
              # rejection reason -- never mis-attribute this to
              # trusted_input_derivation_failed (a different failure class:
              # the SEPARATE "Independently re-derive trusted-side inputs"
              # step, which never even runs once the `download` step fails
              # closed and GitHub Actions' default same-job step-skip
              # behavior takes over).
              CONCLUSION="failure"
              SUMMARY="visual-impact-policy-trusted: download_or_archive_rejected (${DOWNLOAD_FAILURE_REASON:-unknown}; ${DOWNLOAD_FAILURE_DETAIL:-}) for PR #${PR_NUMBER} head ${LIVE_HEAD_SHA}."
            elif [ "${TRUSTED_OUTCOME}" != "success" ]; then
              CONCLUSION="failure"
              SUMMARY="visual-impact-policy-trusted: trusted_input_derivation_failed; verifier_not_run for PR #${PR_NUMBER} head ${LIVE_HEAD_SHA}."
            elif [ "${VERIFY_OUTCOME}" = "success" ]; then
              CONCLUSION="success"
              SUMMARY="visual-impact-policy-trusted: producer VISUAL_IMPACT_DECISION_V1 artifact and evidence manifest independently re-verified for PR #${PR_NUMBER} head ${LIVE_HEAD_SHA}."
            elif [ "${VERIFY_OUTCOME}" = "failure" ]; then
              CONCLUSION="failure"
              SUMMARY="visual-impact-policy-trusted: producer_artifact_verification_rejected for PR #${PR_NUMBER} head ${LIVE_HEAD_SHA}."
            else
              # `skipped`, `cancelled`, or an absent outcome has no semantic
              # verifier result and is not an artifact rejection.
              CONCLUSION="failure"
              SUMMARY="visual-impact-policy-trusted: verifier_not_run after trusted input derivation for PR #${PR_NUMBER} head ${LIVE_HEAD_SHA}."
            fi
          fi
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPO}/check-runs" \
            -f name="visual-impact-policy-trusted" \
            -f head_sha="${BIND_SHA}" \
            -f status="completed" \
            -f conclusion="${CONCLUSION}" \
            -f "output[title]=visual-impact-policy-trusted" \
            -f "output[summary]=${SUMMARY}"

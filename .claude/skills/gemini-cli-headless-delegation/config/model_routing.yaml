# model_routing.yaml — optional override for DEFAULT_MODEL_ROUTING in run_gemini_headless.py
#
# When this file exists, its values are deep-merged into DEFAULT_MODEL_ROUTING.
# Keys not listed here fall back to the Python-side defaults.
# Edit model IDs here when stable Gemini model names change — no code change needed.
#
# Schema:
#   default_chain: list[str]          # tried in order when no role / no explicit model
#   roles:
#     <role_name>:
#       model_chain: list[str]        # tried in order for this role
#
# Supported role names (see references/model-routing.md for full table):
#   code_research, web_research, github_research, implementation, issue_authoring
#
# NOTE: model IDs below are placeholders matching DEFAULT_MODEL_ROUTING.
# Replace with verified stable IDs when Gemini releases official aliases.

default_chain:
  - gemini-3-flash-preview
  - gemini-2.5-flash

roles:
  code_research:
    model_chain:
      - gemini-3-flash-preview
      - gemini-2.5-flash
  web_research:
    model_chain:
      - gemini-3-flash-preview
      - gemini-2.5-flash
  github_research:
    model_chain:
      - gemini-3-flash-preview
      - gemini-2.5-flash
  implementation:
    model_chain:
      - gemini-3-pro-preview
      - gemini-3-flash-preview
      - gemini-2.5-flash
  issue_authoring:
    model_chain:
      - gemini-3-pro-preview
      - gemini-3-flash-preview
      - gemini-2.5-flash
  # grounded_research (Issue #1777): capability-driven routing replacement
  # for the former hardcoded AGY_GROUNDED_RESEARCH_MODEL constant in
  # run_gemini_headless.py. Consumed only by provider="agy"
  # tool_profile="grounded_research" via
  # resolve_agy_grounded_research_model() -- unrelated to the gemini-model
  # roles above (this role's model_chain is a list of AGY `--model`
  # candidate ids, not Gemini model ids). Model specification stays
  # optional: resolve_agy_grounded_research_model() falls back to no
  # `--model` flag at all (AGY account_default) if this chain is empty or
  # every candidate fails the availability preflight. A controlled
  # grounding matrix experiment (#1777) found prompt construction, not
  # model selection, to be the dominant reliability factor -- see
  # references/agy-headless-tool-use-investigation.md.
  #
  # Issue #2069: この empty chain (`[]`) は、上記 #1777 の実験知見
  # （`account_default` が `claude-sonnet-4-6` を上回る成功率だった）と
  # 整合しない旧来の `claude-sonnet-4-6` 固定設定を廃止するための意図的な
  # 変更である。固定モデルを列挙すると wrapper が Antigravity CLI の
  # 「Claude and GPT Models」共有クォータ枠を毎回消費してしまうため、
  # ここでは Claude 強制を外し、AGY 自身の account_default に選択権を返す。
  # `load_model_routing()` はこの role に限り empty chain を合法として
  # 許可する（識別子: `grounded_research_empty_chain_exception`）。他の
  # role は引き続き non-empty list を要求する。
  grounded_research:
    model_chain: []

# provider_auto_policy_v1 (Issue #1270)
#
# Fixed v1 policy for runtime provider="auto" dispatch in run_gemini_headless.py
# (see provider_auto_dispatch()). This block documents the policy; the
# authoritative enforcement lives in the Python constants of the same name
# (PROVIDER_AUTO_*) in run_gemini_headless.py -- this YAML block is not
# re-parsed at runtime, it exists so the policy is discoverable in docs/config
# per the Issue #1270 Outcome. Keep both in sync when editing either --
# test_provider_auto_policy_yaml_and_python_constants_are_in_sync() in
# tests/test_quota_fallback.py compares every key below against the Python
# constants and fails closed on drift.
#
# Issue #1692 (human decision, 2026-07-26, PR #1798 comment): agy is now
# the first provider, gemini the second/fallback provider. setup_check_order
# (setup_check.py --provider auto) is also agy-first, so it now matches
# runtime_order below (previously the two intentionally differed -- see
# references/model-routing.md, which still documents the pre-#1692
# gemini-first runtime_order and is a documented follow-up to refresh).
provider_auto_policy_v1:
  schema_version: v1
  runtime_order:
    - agy
    - gemini
  setup_check_order:
    - agy
    - gemini
  eligible_profiles:
    - no_tools
    - proposal_only
  retryable_failure_classes:
    gemini:
      - quota_or_rate_limited
      - model_capacity_exhausted
      - model_chain_exhausted
    agy:
      - agy_rate_limited
      - agy_capacity_exhausted
      - agy_web_grounding_quota_exhausted
  stop_if:
    - request_validation_failed
    - auth_or_permission_failed
    - request_has_post_to_issue_url
    - provider_profile_unsupported
  result_fields:
    - selected_provider
    - provider_attempts
    - fallback_reason
    - fallback_policy_version
    - attempts_by_model
  idempotency_guard: >-
    Provider fallback stops permanently once any provider attempt for a
    request has reached (or would reach) non-idempotent post-processing --
    concretely, request.post_to_issue_url is set (a `gh issue comment` post
    is NOT idempotent; retrying it against a second provider would create a
    duplicate comment). No later provider attempt is made after that point,
    even if the attempt that reached post-processing failed.

# providers.<name>.retry_budget (Issue #1270 AC2)
#
# Provider-scoped retry budget, distinct from roles.<role>.model_chain above.
# model_chain answers "which models, in what order"; retry_budget answers
# "how many attempts / how much backoff per provider" independent of role.
# Validated fail-closed by load_model_routing() -- unknown keys, wrong types,
# and negative attempt/backoff counts raise ValueError.
providers:
  gemini:
    retry_budget:
      same_model_attempts: 3
      same_provider_attempts: 1
      initial_backoff_seconds: 1
      max_backoff_seconds: 4
      jitter: false
      retryable_failure_classes:
        - quota_or_rate_limited
        - model_capacity_exhausted
        - model_chain_exhausted
  agy:
    retry_budget:
      same_model_attempts: 1
      same_provider_attempts: 1
      initial_backoff_seconds: 2
      max_backoff_seconds: 10
      jitter: false
      retryable_failure_classes:
        - agy_rate_limited
        - agy_capacity_exhausted
        - agy_web_grounding_quota_exhausted

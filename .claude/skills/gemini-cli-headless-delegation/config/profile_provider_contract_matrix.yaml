schema: profile_provider_contract_matrix/v1

# profile_provider_contract_matrix/v1
#
# 5 profile x 2 provider = 10 セルを機械可読な 4 値 enum
# (implemented | unsupported_by_design | deferred | unsafe) で記録する。
# 各セルは判定根拠となる evidence (最低1件) と known_gaps (既知の制限事項、
# 空配列可) を持つ。evidence は型付きの構造 (kind: repo_file / test / issue / pr)
# を取り、repo_file / test は repo-relative path を、issue / pr は
# "#123" / "PR #123" 形式の ref を持つ (PR #1823 fix_delta Blocker 3:
# evidence の実在性を文字列ヒューリスティックでなく型付き構造 + repo-root
# 境界内 resolve() + is_file() で厳密検証する)。
#
# related: #1806, parent #1265 (Parent Closure Rule AC4)

profiles:
  no_tools:
    gemini:
      value: implemented
      evidence:
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/scripts/run_gemini_headless.py
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/references/provider-mapping.md
      known_gaps:
        - "OAuth ベース認証は Google の OAuth token / cached credential 方式に依存しており、恒久的な認証堅牢性の改善は GeminiCLI 側の改修ではなく AGY 移行（`_minimal_agy_env()` の allowlist 環境変数方式、references/provider-mapping.md の「認証堅牢性」節参照）を前提とする"
    agy:
      value: implemented
      evidence:
        - kind: test
          path: .claude/skills/gemini-cli-headless-delegation/tests/test_agy_provider.py
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/references/provider-mapping.md
      known_gaps:
        - "safety mode は degraded_wrapper_only（guaranteed read-only ではなく wrapper-constrained）"

  proposal_only:
    gemini:
      value: implemented
      evidence:
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/scripts/run_gemini_headless.py
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/references/provider-mapping.md
      known_gaps:
        - "OAuth ベース認証は Google の OAuth token / cached credential 方式に依存しており、恒久的な認証堅牢性の改善は GeminiCLI 側の改修ではなく AGY 移行（`_minimal_agy_env()` の allowlist 環境変数方式、references/provider-mapping.md の「認証堅牢性」節参照）を前提とする"
    agy:
      value: implemented
      evidence:
        - kind: test
          path: .claude/skills/gemini-cli-headless-delegation/tests/test_agy_provider.py
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/references/provider-mapping.md
      known_gaps:
        - "safety mode は degraded_wrapper_only（guaranteed read-only ではなく wrapper-constrained）"

  grounded_research:
    gemini:
      value: implemented
      evidence:
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/scripts/run_gemini_headless.py
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/references/provider-mapping.md
      known_gaps:
        - "OAuth ベース認証は Google の OAuth token / cached credential 方式に依存しており、恒久的な認証堅牢性の改善は GeminiCLI 側の改修ではなく AGY 移行（`_minimal_agy_env()` の allowlist 環境変数方式、references/provider-mapping.md の「認証堅牢性」節参照）を前提とする"
    agy:
      value: implemented
      evidence:
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/scripts/validate_agy_grounding_evidence.py
        - kind: test
          path: .claude/skills/gemini-cli-headless-delegation/tests/test_agy_provenance_grounding_wiring.py
        - kind: test
          path: .claude/skills/gemini-cli-headless-delegation/tests/test_validate_agy_grounding_evidence.py
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/references/provider-mapping.md
      known_gaps:
        - "grounded 判定は構造化 tool_calls トレース必須。stdout の bare URL 文字列だけでは実行証跡と扱わない（トレース欠如は agy_web_grounding_tool_call_missing で fail-closed）"

  local_asset_research:
    gemini:
      value: implemented
      evidence:
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/scripts/run_gemini_headless.py
        - kind: repo_file
          path: .claude/skills/gemini-cli-headless-delegation/scripts/build_request.py
        - kind: repo_file

      known_gaps:
        - "`.gemini/settings.json` の Serena allowlist（mcp.allowed == [\"serena\"] と read-only includeTools）を machine-checkable に確認できる場合のみ使用可"
    agy:
      value: implemented
      evidence:
        - kind: test
          path: .claude/skills/gemini-cli-headless-delegation/tests/test_agy_local_asset_research_contract.py
        - kind: test
          path: .claude/skills/gemini-cli-headless-delegation/tests/test_agy_targeted_evidence.py
        - kind: test

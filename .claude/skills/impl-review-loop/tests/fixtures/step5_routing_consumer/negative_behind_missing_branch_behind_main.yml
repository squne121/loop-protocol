scenario: negative_behind_missing_branch_behind_main
description: >-
  Issue #1856 (AC2): BEHIND merge_state_status with an empty
  required_auto_actions list must fail-closed without relying on
  branch_behind_main / test_verdict (removed).
loop_verdict:
  verdict: APPROVE
  merge_ready: false
  reviewed_head_sha: "abc123def456"
  mergeability:
    merge_state_status: BEHIND
  required_auto_actions: []
expected:
